    moral: '<svg viewBox="0 0 40 40"><g fill="none" stroke="#0a2a3f" stroke-width="2.4" stroke-linejoin="round"><ellipse cx="20" cy="13" rx="12" ry="5" fill="#f5f1ff"/><path d="M8 13 a12 12 0 0 0 24 0" fill="#ffffff"/><path d="M15 25 h10 M17 29 h6" stroke="#8a5cf6"/><circle cx="20" cy="20" r="3.4" fill="#ffe6a6"/></g></svg>',
    history: '<svg viewBox="0 0 40 40"><g fill="none" stroke="#0a2a3f" stroke-width="2.4" stroke-linejoin="round"><circle cx="20" cy="22" r="12" fill="#ffffff"/><path d="M20 15 v7 l5 3"/><path d="M10 9 a14 14 0 0 1 9 -3" stroke="#8a5cf6" stroke-width="3"/><path d="M8 6 l2 5 5 -2" fill="#8a5cf6" stroke="#8a5cf6" stroke-width="2"/></g></svg>'
  };

  // ==========================================================================
  //  ⑤  开局
  // ==========================================================================
  function spawn(f) {
    const left = f.side === 'left';
    const xMin = left ? BORDER + f.hw + 16 : W / 2 + f.hw + 16;
    const xMax = left ? W / 2 - f.hw - 16 : W - BORDER - f.hw - 16;
    f.x = rand(xMin, Math.max(xMin + 1, xMax));
    f.y = rand(BORDER + f.hh + 40, H - BORDER - f.hh - 40);
    const sp = rand(f.cfg.speed[0], f.cfg.speed[1]);
    const ang = left ? rand(-55, 55) * DEG : rand(125, 235) * DEG;
    f.vx = Math.cos(ang) * sp;
    f.vy = Math.sin(ang) * sp;
    f.sp = sp;
  }

  function seedSnow() {
    fx.snow.length = 0;
    for (let i = 0; i < CFG.feel.snow; i++) {
      fx.snow.push({
        x: Math.random() * W, y: Math.random() * H,
        r: rand(1, 3.2), sp: rand(24, 80), drift: rand(-16, 16), a: rand(0.25, 0.85)
      });
    }
  }

  function reset() {
    gen += 1;
    clock = 0; over = null; blobs = []; pending = [];
    fx.nums.length = 0; fx.rings.length = 0; fx.sparks.length = 0; fx.shards.length = 0;

    for (const f of fighters) {
      // 每次重开都重新读一次 CFG，改完参数点「重新开局」即可生效
      f.maxHp = f.cfg.maxHp; f.atk = f.cfg.atk;
      f.hp = f.maxHp; f.stun = 0; f.flash = 0; f.shake = 0; f.squash = 0; f.frozen = 0;
      f.dealt = 0; f.taken = 0; f.healed = 0; f.hits = 0; f.dmgLog = [];
      f.sky = 0; f.invuln = 0;
      f.buffHp = 0; f.buffAtk = 0;
      spawn(f);
    }
    R.on = false; R.t = 0; R.idle = 1.0; R.ang = -Math.PI / 2; R.hitDone = false; R.tail = 0;
    R.duckHit = false;
    R.ultLeft = CFG.rabbit.ult.uses; R.ultCount = 0;
    R.lockT = 0; R.iceT = 0; R.freezeT = 0;

    // ---- 摇摆鸭：回到场地中央，撞击数与增益全部清零 ----
    duck.hits = 0; duck.roundHits = 0; duck.sq = 0; duck.sqV = 0;
    duck.cd.left = -99; duck.cd.right = -99;
    duck.last = null; duck.lastSide = null; duck.join = null;
    duck.flash = 0; duck.hitPop = 0; duck.wob = Math.random() * 6.28;
    duck.firstAt = 0;
    duck.x = W * 0.5 + rand(-50, 50);
    duck.y = H * 0.5 + rand(-40, 40);
    duck.sp = CFG.duck.speed;
    const da = rand(0, Math.PI * 2);
    duck.vx = Math.cos(da) * duck.sp; duck.vy = Math.sin(da) * duck.sp;
    duck.face = 1;

    buff.target = null; buff.hp = 0; buff.atk = 0; buff.round = 0; buff.prev = null;
    closeBili(true);

    S.idle = 2.0; S.chain = 0; S.chainT = 0;
    S.moral.cd = CFG.slime.moral.startCd; S.moral.air = 0; S.moral.readyFor = 0;
    S.history.cd = CFG.slime.history.startCd; S.history.mute = 0; S.history.readyFor = 0;
    S.lastHeal = 0; S.lastReflect = 0;

    overT = 0; mvpOn = false;
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('koText').classList.remove('show');
    const _mvp = document.getElementById('mvpCard');
    _mvp.classList.remove('show');
    _mvp.innerHTML = '';
    showBanner('');
  }

  // ==========================================================================
  //  ⑥  伤害 / 治疗
  // ==========================================================================
  function addNum(x, y, text, color, size) {
    fx.nums.push({
      x: clamp(x, 60, W - 60), y: clamp(y, 34, H - 30),
      t: 0, dur: CFG.feel.numLife, text, color, size: size || 20
    });
  }

  function heal(target, amount, color) {
    if (amount <= 0 || target.hp <= 0) return 0;
    const before = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + amount);
    const real = target.hp - before;
    target.healed += real;
    if (real >= 1) {
      addNum(target.x, target.y - target.hh - 30, '+' + Math.round(real), color || '#7bd88f', 20);
      fx.rings.push({ x: target.x, y: target.y, t: 0, dur: 0.5, r0: 6, r1: 62, color: '#7bd88f', w: 3 });
    }
    return real;
  }

  function damage(target, amount, opt) {
    opt = opt || {};
    if (over || target.hp <= 0) return 0;
    amount = Math.max(0, Math.round(amount));

    if (target.invuln > 0 || target.sky > 0) {
      const locked = target.invuln > 0;
      addNum(target.x, target.y - target.hh - 34, locked ? '锁血' : '免疫',
        locked ? '#ff9a8a' : '#b98bff', 17);
      fx.rings.push({
        x: target.x, y: target.y, t: 0, dur: 0.42, r0: 4, r1: 52,
        color: locked ? '#ff9a8a' : '#b98bff', w: 3
      });
      return 0;
    }

    // 兔子大招：还有次数时，任何伤害都停在 20% 线上（等本帧 castIce 触发）
    if (target === rabbit && R.ultLeft > 0) {
      const floor = target.maxHp * CFG.rabbit.ult.hpThreshold;
      // 已经压在线上了就完全免伤，否则同一帧的第二下会直接打穿这条线
      amount = target.hp > floor ? Math.min(amount, target.hp - floor) : 0;
    }

    const before = target.hp;
    target.hp = Math.max(0, target.hp - amount);
    const real = before - target.hp;
    target.taken += real;
    target.dmgLog.push({ t: clock, amount: real });
    if (opt.source) opt.source.dealt += real;

    const big = real >= target.maxHp * 0.15;
    addNum(target.x, target.y - target.hh - 30, '-' + Math.round(real),
      opt.color || (big ? '#ff3b12' : '#ff9d6b'), big ? 28 : 21);
    fx.sparks.push({ x: target.x, y: target.y, t: 0, dur: 0.3, color: opt.color || '#ffb27a' });
    fx.rings.push({ x: target.x, y: target.y, t: 0, dur: 0.32, r0: 4, r1: 48, color: '#ffffff', w: 2.4 });

    target.flash = 0.2; target.shake = 0.3; target.squash = 0.24;
    sfxHit(big);

    if (target.hp <= 0) {
      over = target === rabbit ? 'slime' : 'rabbit';
      overT = 0; mvpOn = false;
      closeBili(true);
      sfxKO();
      shake(3.2);
      showKO();
      say((target === rabbit ? '兔子' : '史莱姆') + '被击倒，K O！', true);
    }
    return real;
  }

  function takenBetween(f, from, to) {
    let s = 0;
    for (const d of f.dmgLog) {
      const ago = clock - d.t;
      if (ago >= from && ago < to) s += d.amount;
    }
    return s;
  }

  // ==========================================================================
  //  ⑦  兔子
  // ==========================================================================
  function hammerHead() {
    const r = CFG.rabbit.hammer.orbitR + CFG.rabbit.hammer.len * 0.30;
    return { x: rabbit.x + Math.cos(R.ang) * r, y: rabbit.y + Math.sin(R.ang) * r };
  }

  // 统一伤害公式：基础攻击力 × 百分比（全场只有 atk 是绝对数值）
  function atkDmg(who, ratio) {
    return Math.max(0, Math.round(who.atk * ratio));
  }

  function rabbitDamage() {
    return atkDmg(rabbit, CFG.rabbit.dmgAtkRatio);
  }

  function castIce() {
    const U = CFG.rabbit.ult;
    const canCounter = S.moral.cd <= 0 && S.moral.air <= 0;
    const countered = canCounter && Math.random() < CFG.slime.moral.counterChance;

    R.ultLeft = Math.max(0, R.ultLeft - 1);
    R.ultCount += 1;
    R.lockT = U.lockDur;
    rabbit.invuln = U.lockDur;
    R.iceT = U.iceDur;
    R.freezeT = U.freeze;

    sfxIce();
    sfxFreeze();
    shake(1.8);

    // 释放瞬间回血：此前累计造成伤害的 30%
    const healAmt = Math.round(rabbit.dealt * U.healRatio);
    const healed = heal(rabbit, healAmt, '#7bd88f');
    if (healed > 0) {
      for (let i = 0; i < 3; i++) {
        fx.rings.push({
          x: rabbit.x, y: rabbit.y, t: i * 0.1, dur: 0.85,
          r0: 24, r1: 132 + i * 22, color: '#7bd88f', w: 3.2
        });
      }
      sfxIceHeal();
      showBanner('冰岛冲击 · 回血 ' + fmt(healed));
      say('冰岛冲击！回复 ' + fmt(healed), true);
    } else {
      showBanner('冰岛冲击');
      say('冰岛冲击！', true);
    }

    rabbit.face = slime.x > rabbit.x ? 1 : -1;
    slime.face = rabbit.x > slime.x ? 1 : -1;

    if (countered) {
      castMoral(true);
      pending.push({
        at: clock + 0.7, gen,
        fn: () => {
          showBanner('对轴成功 · 完全免疫');
          say('对轴成功，完全免疫！');
          addNum(slime.x, slime.y - slime.hh - 76, '对轴！', '#ffe6a6', 26);
          for (let i = 0; i < 3; i++) {
            fx.rings.push({ x: slime.x, y: slime.y, t: i * 0.1, dur: 0.8, r0: 10, r1: 150, color: '#c9a6ff', w: 3 });
          }
        }
      });
    } else {
      // 冰岛冲击：冰冻期间分多次结算，单段伤害小、总伤害不变
      const total = atkDmg(rabbit, U.dmgAtkRatio);
      const per = Math.ceil(total / U.ticks);
      for (let i = 0; i < U.ticks; i++) {
        pending.push({
          at: clock + 0.55 + i * U.tickGap, gen,
          fn: () => {
            if (over) return;
            const dealt = damage(slime, per, { source: rabbit, color: '#8fd8ff' });
            if (dealt > 0) {
              fx.rings.push({
                x: slime.x, y: slime.y, t: 0, dur: 0.32,
                r0: 8, r1: 78, color: '#b9ecff', w: 2.6
              });
              for (let k = 0; k < 6; k++) {
                const a = Math.PI * 2 * k / 6 + Math.random() * 0.5;
                fx.shards.push({
                  x: slime.x + Math.cos(a) * 40, y: slime.y + Math.sin(a) * 40,
                  tx: slime.x, ty: slime.y, t: 0, dur: 0.3, color: '#cdefff'
                });
              }
            }
            // 眩晕只上第一次
            if (i === 0 && slime.hp > 0) slime.stun = Math.max(slime.stun, U.stun);
            // 冰岛冲击是范围技：第 1 段顺手把摇摆鸭也扫一下（一次大招只计 1 击）
            if (i === 0) iceOnDuck();
          }
        });
      }
    }
  }

  function updateRabbit(dt) {
    if (rabbit.hp <= 0) return;

    if (R.ultLeft > 0 && rabbit.hp <= rabbit.maxHp * CFG.rabbit.ult.hpThreshold) castIce();

    if (R.lockT > 0) {
      R.lockT = Math.max(0, R.lockT - dt);
      if (R.lockT === 0) rabbit.invuln = 0;
    }
    if (R.iceT > 0) R.iceT = Math.max(0, R.iceT - dt);
    if (R.tail > 0) R.tail = Math.max(0, R.tail - dt);

    if (rabbit.frozen > 0 || rabbit.stun > 0) { R.on = false; return; }

    const HM = CFG.rabbit.hammer;

    if (!R.on) {
      R.idle += dt;
      if (R.idle >= HM.period) {
        R.idle = 0; R.on = true; R.t = 0; R.hitDone = false; R.duckHit = false;
        R.ang = Math.atan2(slime.y - rabbit.y, slime.x - rabbit.x) - 0.9;
        sfxOrbit();

        const d = Math.hypot(slime.x - rabbit.x, slime.y - rabbit.y);
        if (d > HM.dashGap) {
          const nx = (slime.x - rabbit.x) / d, ny = (slime.y - rabbit.y) / d;
          rabbit.x = clamp(slime.x - nx * 205, BORDER + rabbit.hw, W - BORDER - rabbit.hw);
          rabbit.y = clamp(slime.y - ny * 205, BORDER + rabbit.hh, H - BORDER - rabbit.hh);
          fx.rings.push({ x: rabbit.x, y: rabbit.y, t: 0, dur: 0.35, r0: 8, r1: 50, color: '#ffd08a', w: 3 });
        }
      }
      return;
    }

    R.t += dt;
    R.ang += dt * HM.spin * DEG;

    // v3.0：锤子扫到摇摆鸭——不计伤害，只计数并把它击飞
    if (!R.duckHit && hammerOnDuck()) R.duckHit = true;

    if (!R.hitDone && slime.hp > 0) {
      const hd = hammerHead();
      if (Math.hypot(slime.x - hd.x, slime.y - hd.y) <= HM.hitR + slime.rc * 0.86) {
        const dealt = damage(slime, rabbitDamage(), { source: rabbit, color: '#ff4d2d' });
        if (dealt > 0) rabbit.hits++;
        R.hitDone = true;
        shake(0.8);
        const dx = slime.x - rabbit.x, dy = slime.y - rabbit.y, dd = Math.hypot(dx, dy) || 1;
        if (slime.hp > 0 && slime.sky <= 0 && slime.frozen <= 0) {
          slime.vx = dx / dd * 250;
          slime.vy = dy / dd * 250;
        }
      }
    }

    if (R.t >= HM.dur) { R.on = false; R.idle = 0; R.tail = 0.3; }
  }

  // ==========================================================================
  //  ⑧  史莱姆
  // ==========================================================================
  function blobAt(x, y, r, g0) {
    return {
      x, y, vx: 0, vy: 0, sp: 0, r,
      dw: r * 2, dh: r * 2, hw: r, hh: r, rc: r,
      gen: g0, life: CFG.slime.spit.life, age: 0, wob: Math.random() * 6.28
    };
  }

  function spit() {
    const mx = slime.x + (slime.face || 1) * slime.hw * 0.5;
    const my = slime.y + slime.hh * 0.12;
    const SP = CFG.slime.spit;

    let prey = null;
    for (const b of blobs) if (b.gen === 0) { prey = b; break; }

    let ang, sp;
    if (prey) {
      ang = Math.atan2(prey.y - my, prey.x - mx) + (Math.random() - 0.5) * 0.05;
      sp = SP.speed * 1.16;
    } else {
      let px = rabbit.x, py = rabbit.y;
      for (let k = 0; k < 2; k++) {
        const tt = Math.hypot(px - mx, py - my) / SP.speed;
        px = rabbit.x + rabbit.vx * tt * 1.0;
        py = rabbit.y + rabbit.vy * tt * 1.0;
      }
      px = clamp(px, BORDER + 20, W - BORDER - 20);
      py = clamp(py, BORDER + 20, H - BORDER - 20);
      ang = Math.atan2(py - my, px - mx) + (Math.random() - 0.5) * 0.12;
      sp = SP.speed;
    }

    const b = blobAt(mx + Math.cos(ang) * 14, my + Math.sin(ang) * 14, SP.r, 0);
    b.sp = sp; b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
    blobs.push(b);
    while (blobs.length > SP.maxBlobs) blobs.shift();
    fx.rings.push({ x: mx, y: my, t: 0, dur: 0.28, r0: 4, r1: 30, color: '#8ef07a', w: 2.4 });
    sfxSpit();
  }

  function splitBlob(b) {
    const i = blobs.indexOf(b);
    if (i < 0 || over) return;
    blobs.splice(i, 1);
    const base = Math.atan2(b.vy, b.vx);
    for (let k = 0; k < CFG.slime.spit.split; k++) {
      const a = base + (k % 2 === 0 ? 1 : -1) * (0.66 + Math.random() * 0.34);
      const c = blobAt(b.x, b.y, CFG.slime.spit.miniR, 1);
      c.sp = b.sp * 1.04; c.vx = Math.cos(a) * c.sp; c.vy = Math.sin(a) * c.sp;
      c.life = CFG.slime.spit.life * 0.72;
      blobs.push(c);
    }
    fx.rings.push({ x: b.x, y: b.y, t: 0, dur: 0.4, r0: 5, r1: 56, color: '#b6ff8a', w: 3 });
    addNum(b.x, b.y - b.hh - 16, '分裂 x' + CFG.slime.spit.split, '#2f9e3f', 16);
  }

  function updateBlobs(dt) {
    for (let i = blobs.length - 1; i >= 0; i--) {
      const b = blobs[i];
      if (!b) continue;
      b.age += dt; b.life -= dt;
      if (b.life <= 0) { blobs.splice(i, 1); continue; }

      // v3.0：史莱姆的球打到摇摆鸭 → 弹开 + 计一次撞击（同一颗球 0.4s 内只算一次）
      if (!over && Math.hypot(duck.x - b.x, duck.y - b.y) <= b.r + duck.rc * 0.9) {
        if (b.age - (b.lastDuck === undefined ? -9 : b.lastDuck) > 0.4) {
          b.lastDuck = b.age;
          const nx = b.x - duck.x, ny = b.y - duck.y, dd = Math.hypot(nx, ny) || 1;
          const sp2 = Math.max(b.sp, 340);
          b.vx = nx / dd * sp2; b.vy = ny / dd * sp2; b.sp = sp2;
          fx.rings.push({ x: duck.x, y: duck.y, t: 0, dur: 0.3, r0: 4, r1: 46, color: '#b6ff8a', w: 2.4 });
          duckHit(slime, 'blob');
        }
      }

      if (rabbit.hp > 0 && Math.hypot(rabbit.x - b.x, rabbit.y - b.y) <= b.r + rabbit.rc * 0.9) {
        const dealt = damage(rabbit, atkDmg(slime, CFG.slime.spit.dmgAtkRatio), { source: slime, color: '#2f9e3f' });
        if (dealt > 0) {
          slime.hits++;
          heal(slime, Math.ceil(dealt * CFG.slime.lifestealRatio), '#2f9e3f');
        }
        blobs.splice(i, 1);
        continue;
      }

      if (b.gen === 0) {
        let by = null;
        for (const o of blobs) {
          if (o === b || o.gen !== 0 || o.age >= b.age) continue;
          if (Math.hypot(o.x - b.x, o.y - b.y) <= o.r + b.r + 2) { by = o; break; }
        }
        if (by) splitBlob(b);
      }
    }
  }

  function castMoral(force) {
    const M = CFG.slime.moral;
    if (!force && S.moral.cd > 0) return;
    S.moral.cd = M.cd;
    S.moral.air = M.air;
    S.moral.readyFor = 0;
    slime.sky = M.air;

    sfxMoral();
    showBanner('站在道德制高点');
    say('史莱姆，站在道德制高点');
    addNum(slime.x, slime.y - slime.hh - 60, '道德制高点', '#c9a6ff', 22);
    for (let i = 0; i < 4; i++) {
      fx.rings.push({ x: slime.x, y: slime.y, t: i * 0.08, dur: 0.7, r0: 10, r1: 120 + i * 26, color: '#c9a6ff', w: 3.4 });
    }
    for (let i = 0; i < 14; i++) {
      const a = -Math.PI / 2 + (i - 6.5) * 0.13;
      fx.sparks.push({
        x: slime.x + Math.cos(a) * 70, y: slime.y + Math.sin(a) * 70,
        t: 0.05 + i * 0.02, dur: 0.5, color: i % 2 ? '#ffe6a6' : '#c9a6ff'
      });
    }
  }

  function castHistory() {
    const Hc = CFG.slime.history;
    const prev = takenBetween(slime, Hc.lookBack, Hc.lookBack * 2);
    const now = takenBetween(slime, 0, Hc.lookBack);
    const healAmt = Math.round(prev * Hc.healRatio);
    const reflect = Math.round(now * Hc.reflectRatio);

    S.history.cd = Hc.cd;
    S.history.mute = Hc.mute;
    S.history.readyFor = 0;
    S.lastHeal = healAmt; S.lastReflect = reflect;

    sfxHistory();
    showBanner('历史的回眸');
    say('史莱姆，历史的回眸', true);
    addNum(slime.x, slime.y - slime.hh - 60, '历史的回眸', '#c9a6ff', 22);

    for (let i = 0; i < 5; i++) {
      fx.rings.push({ x: slime.x, y: slime.y, t: i * 0.07, dur: 0.9, r0: 130 - i * 18, r1: 10, color: '#a98bff', w: 2.6 });
    }
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, r0 = rand(40, 110);
      fx.shards.push({
        x: slime.x + Math.cos(a) * r0, y: slime.y + Math.sin(a) * r0,
        tx: slime.x, ty: slime.y, t: 0, dur: rand(0.35, 0.6), color: '#c9a6ff'
      });
    }

    if (healAmt > 0) heal(slime, healAmt, '#7bd88f');
    else addNum(slime.x + 40, slime.y - slime.hh - 16, '无旧伤', '#8a8a8a', 15);

    if (reflect > 0) {
      addNum(slime.x, slime.y - slime.hh - 90, '回溯 ' + reflect, '#a98bff', 19);
      pending.push({
        at: clock + 0.45, gen,
        fn: () => { if (!over) damage(rabbit, reflect, { source: slime, color: '#a98bff' }); }
      });
    }
  }

  function updateSlime(dt) {
    if (slime.hp <= 0) return;
    const M = CFG.slime.moral, Hc = CFG.slime.history;

    // ---- 冷却计时：就绪后开始累积"已经等了多久" ----
    if (S.moral.cd > 0) { S.moral.cd = Math.max(0, S.moral.cd - dt); S.moral.readyFor = 0; }
    else if (S.moral.air <= 0) S.moral.readyFor += dt;

    if (S.history.cd > 0) { S.history.cd = Math.max(0, S.history.cd - dt); S.history.readyFor = 0; }
    else if (S.history.mute <= 0) S.history.readyFor += dt;

    // ================= 道德制高点的释放判断 =================
    // 只在"能挡到东西"的时候起飞，但留招最多 20s
    if (S.moral.air > 0) {
      S.moral.air = Math.max(0, S.moral.air - dt);
      slime.sky = S.moral.air;
    } else if (S.moral.cd <= 0 && slime.frozen <= 0) {
      const dist = Math.hypot(rabbit.x - slime.x, rabbit.y - slime.y);
      const watchUlt = R.ultLeft > 0 && rabbit.hp <= rabbit.maxHp * M.watchHp;  // 等大招对轴
      const swinging = R.on && !R.hitDone && dist <= M.threatRange;          // 锤子正抡过来
      const lowHp = slime.hp <= slime.maxHp * M.lowHp;                       // 自己快死了
      const forced = S.moral.readyFor >= M.holdMax;                          // 留太久，必须用掉

      if (forced) castMoral(false);
      else if (watchUlt) { /* 继续留着接大招 */ }
      else if (swinging || lowHp) castMoral(false);
    }

    // ================= 历史的回眸的释放判断 =================
    // 要"吃到足够多的伤害"才值得放（放了要停手 10s，乱放等于自废武功）
    if (S.history.mute > 0) S.history.mute = Math.max(0, S.history.mute - dt);
    if (S.history.cd <= 0 && S.history.mute <= 0 && slime.frozen <= 0) {
      const recent = takenBetween(slime, 0, Hc.lookBack);
      const worth = recent >= slime.maxHp * Hc.needRatio;                 // 值得
      const forced = S.history.readyFor >= Hc.holdMax
                     && recent >= slime.maxHp * Hc.floorRatio;            // 留满后的保底
      if (worth || forced) castHistory();
    }

    if (slime.stun > 0 || slime.frozen > 0 || S.history.mute > 0) return;

    if (S.chain > 0) {
      S.chainT -= dt;
      if (S.chainT <= 0) { S.chain -= 1; S.chainT = CFG.slime.spit.chain; spit(); }
      return;
    }
    S.idle += dt;
    if (S.idle >= CFG.slime.spit.period) {
      S.idle = 0; spit();
      S.chain = 1; S.chainT = CFG.slime.spit.chain;
    }
  }

  // ==========================================================================
  //  ⑧.5  摇摆鸭（v3.0 中立单位）
  //      · 一开场就在场上，半透明
  //      · 可被撞动（物理互推）、可被锤子和史莱姆的球打到（计入撞击数）
  //      · 每 20 次撞击：第 20 次撞击者的【对手】获得增益，并清空上一次增益
  // ==========================================================================
  const SIDE_NAME = { left: '兔子', right: '史莱姆' };
  const SIDE_COLOR = { left: '#ff5a3c', right: '#2f9e3f' };

  // 本轮需要的撞击数：第一轮 20，之后每结算一次 +2（20 → 22 → 24 …）
  function duckNeed() {
    return CFG.duck.hitsPerRound + buff.round * CFG.duck.hitsPerStep;
  }

  function duckHit(source, kind) {
    if (over || !source) return;
    const k = source.side;
    if (clock - duck.cd[k] < CFG.duck.hitCooldown) return;
    duck.cd[k] = clock;

    duck.hits += 1;          // 累计数：只增不减
    duck.roundHits += 1;     // 本轮进度
    duck.last = source;
    duck.lastSide = k;
    duck.flash = 0.2;
    duck.hitPop = 0.24;
    duck.sqV += 7.5;         // Q 弹：先压扁，弹簧再把它弹回来

    const need = duckNeed();
    const done = duck.roundHits >= need;

    // 每一下都飘字，按 3 个高度错开，避免糊成一团
    if (done || clock - (duck.numAt || -9) > 0.16) {
      duck.numAt = clock;
      addNum(duck.x + rand(-30, 30), duck.y - duck.hh - 12 - (duck.hits % 3) * 17,
        done ? '满 ' + need + ' 次！' : '撞击 ' + duck.roundHits + '/' + need,
        done ? '#ffb400' : '#5b7d92', done ? 22 : 15);
    }
    fx.rings.push({ x: duck.x, y: duck.y, t: 0, dur: 0.34, r0: 6, r1: 58, color: '#ffd166', w: 2.6 });
    sfxDuck(kind);
    shake(kind === 'hammer' ? 0.35 : 0.12);

    if (done) { duck.roundHits = 0; settleDuckBuff(source); }
  }

  // 把两位角色的增益全部还原到基础值（只可能有一位带增益）
  function clearBuff() {
    for (const f of fighters) {
      if (!f.buffHp && !f.buffAtk) continue;
      const extra = f.buffHp;
      f.maxHp = f.cfg.maxHp;
      f.atk = f.cfg.atk;
      f.buffHp = 0; f.buffAtk = 0;
      f.hp = clamp(f.hp - extra, 0, f.maxHp);
    }
    buff.target = null; buff.hp = 0; buff.atk = 0;
  }

  // 幂等：先全部还原，再按 (hpB, atkB) 给 target 上增益
  function applyBuff(target, hpB, atkB) {
    clearBuff();
    const add = Math.round(target.cfg.maxHp * hpB);
    target.maxHp = target.cfg.maxHp + add;
    target.atk = Math.round(target.cfg.atk * (1 + atkB));
    target.buffHp = add;
    target.buffAtk = atkB;
    target.hp = clamp(target.hp + add, 0, target.maxHp);
    buff.target = target; buff.hp = hpB; buff.atk = atkB;
  }

  // 第 20 / 40 / 60… 次撞击：清空旧增益 → 给「撞击者的对手」上增益
  function settleDuckBuff(hitter) {
    const target = hitter === rabbit ? slime : rabbit;

    buff.round += 1;
    if (!duck.firstAt) duck.firstAt = clock;
    applyBuff(target, duckUI.hp, duckUI.atk);
    duck.join = target.side;

    const name = SIDE_NAME[target.side];
    showBanner('摇摆鸭加入' + name + ' · +' + Math.round(duckUI.hp * 100) + '%/' + Math.round(duckUI.atk * 100) + '%');
    say('摇摆鸭加入' + name + '阵营', true);
    sfxJoin();

    addNum(target.x, target.y - target.hh - 96, '鸭之祝福', '#ffb400', 26);
    for (let i = 0; i < 3; i++) {
      fx.rings.push({
        x: target.x, y: target.y, t: i * 0.1, dur: 0.9,
        r0: 20, r1: 160 + i * 26, color: '#ffd166', w: 3.4
      });
    }
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, r0 = rand(40, 120);
      fx.shards.push({
        x: target.x + Math.cos(a) * r0, y: target.y + Math.sin(a) * r0,
        tx: target.x, ty: target.y, t: 0, dur: rand(0.4, 0.7), color: '#ffe6a6'
      });
    }

    if (CFG.duck.buff.autoConfirm) return;   // 脚本批量跑：不弹窗
    openBili(target);
  }

  // 鸭子游走：追向双方中点 + 左右摇摆，保证它总在交火线上挨打
  function updateDuck(dt) {
    if (duck.flash > 0) duck.flash = Math.max(0, duck.flash - dt);
    if (duck.hitPop > 0) duck.hitPop = Math.max(0, duck.hitPop - dt);
    if (over) return;

    // Q 弹：阻尼弹簧，被打时 sqV 被推一下，之后自己晃回来
    duck.sqV += (-duck.sq * 300 - duck.sqV * 10.5) * dt;
    duck.sq = clamp(duck.sq + duck.sqV * dt, -0.62, 0.62);

    duck.wob += dt * 2.9;
    const mx = (rabbit.x + slime.x) / 2, my = (rabbit.y + slime.y) / 2;
    const gain = CFG.duck.chase * 1.9;
    // 目标速度 = 朝双方中点 + 猛烈左右摇摆（比例导引，比加速度式更跟得住）
    const tx = clamp((mx - duck.x) * gain, -duck.sp, duck.sp) + Math.cos(duck.wob * 1.9) * 250;
    const ty = clamp((my - duck.y) * gain, -duck.sp, duck.sp) + Math.sin(duck.wob * 2.7) * 230;
    const kv = Math.min(1, dt * 2.8);
    duck.vx += (tx - duck.vx) * kv;
    duck.vy += (ty - duck.vy) * kv;

    // 被撞飞后的高速会慢慢回落到基础游走速度
    duck.sp += (CFG.duck.speed - duck.sp) * Math.min(1, dt * CFG.duck.drag);
    const s = Math.hypot(duck.vx, duck.vy) || 1;
    const cap = clamp(duck.sp, CFG.duck.speed, CFG.duck.maxSpeed);
    if (s > cap) { duck.vx = duck.vx / s * cap; duck.vy = duck.vy / s * cap; }
    if (Math.abs(duck.vx) > 26) duck.face = duck.vx > 0 ? 1 : -1;
  }

  // 角色撞上鸭子：互推（鸭子轻，被撞得更远），并计一次撞击
  function collideDuck(f) {
    if (over || !f || f.hp <= 0) return;
    const dx = f.x - duck.x, dy = f.y - duck.y;
    const d = Math.hypot(dx, dy), min = f.rc + duck.rc;
    if (!d || d >= min) return;
    const nx = dx / d, ny = dy / d, ov = min - d;
    duck.x -= nx * ov * 0.7; duck.y -= ny * ov * 0.7;
    f.x += nx * ov * 0.3; f.y += ny * ov * 0.3;

    const vn = (f.vx - duck.vx) * nx + (f.vy - duck.vy) * ny;
    if (vn > 0) {
      duck.vx += nx * vn * 1.45;
      duck.vy += ny * vn * 1.45;
      duck.sp = clamp(Math.hypot(duck.vx, duck.vy), CFG.duck.speed, CFG.duck.maxSpeed);
      keepSpeed(duck);
    }
    duckHit(f, 'bump');
  }

  // 冰岛冲击扫到鸭子：击飞 + 冰屑 + 计一次撞击
  function iceOnDuck() {
    const dx = duck.x - rabbit.x, dy = duck.y - rabbit.y, dd = Math.hypot(dx, dy) || 1;
    duck.vx = dx / dd * 400;
    duck.vy = dy / dd * 400;
    duck.sp = 400;
    duck.sqV += 7.5;
    duckHit(rabbit, 'ice');
    for (let k = 0; k < 8; k++) {
      const a = Math.PI * 2 * k / 8 + Math.random() * 0.4, r0 = rand(30, 70);
      fx.shards.push({
        x: duck.x + Math.cos(a) * r0, y: duck.y + Math.sin(a) * r0,
        tx: duck.x, ty: duck.y, t: 0, dur: rand(0.25, 0.45), color: '#cdefff'
      });
    }
    fx.rings.push({ x: duck.x, y: duck.y, t: 0, dur: 0.5, r0: 10, r1: 96, color: '#b9ecff', w: 3 });
  }

  // 锤子打中鸭子：击飞 + 计一次撞击
  function hammerOnDuck() {
    const HM = CFG.rabbit.hammer;
    const hd = hammerHead();
    if (Math.hypot(duck.x - hd.x, duck.y - hd.y) > HM.hitR + duck.rc * 0.9) return false;
    const dx = duck.x - rabbit.x, dy = duck.y - rabbit.y, dd = Math.hypot(dx, dy) || 1;
    duck.vx = dx / dd * CFG.duck.knock;
    duck.vy = dy / dd * CFG.duck.knock;
    duck.sp = CFG.duck.knock;
    duckHit(rabbit, 'hammer');
    return true;
  }


  // ==========================================================================
  //  ⑨  物理
  // ==========================================================================
  function keepSpeed(f) {
    const s = Math.hypot(f.vx, f.vy) || 1;
    f.vx = f.vx / s * f.sp;
    f.vy = f.vy / s * f.sp;
  }

  function bounce(o) {
    let hit = false;
    if (o.x - o.hw < BORDER) { o.x = BORDER + o.hw; o.vx = Math.abs(o.vx); hit = true; }
    else if (o.x + o.hw > W - BORDER) { o.x = W - BORDER - o.hw; o.vx = -Math.abs(o.vx); hit = true; }
    if (o.y - o.hh < BORDER) { o.y = BORDER + o.hh; o.vy = Math.abs(o.vy); hit = true; }
    else if (o.y + o.hh > H - BORDER) { o.y = H - BORDER - o.hh; o.vy = -Math.abs(o.vy); hit = true; }
    if (hit && o.sp) keepSpeed(o);
  }

  function collide(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy), min = a.rc + b.rc;
    if (!d || d >= min) return;
    const nx = dx / d, ny = dy / d, ov = (min - d) / 2;
    a.x -= nx * ov; a.y -= ny * ov;
    b.x += nx * ov; b.y += ny * ov;
    const va = a.vx * nx + a.vy * ny, vb = b.vx * nx + b.vy * ny;
    if (va - vb <= 0) return;
    const s = va - vb;
    a.vx -= s * nx; a.vy -= s * ny;
    b.vx += s * nx; b.vy += s * ny;
    if (a.sp) keepSpeed(a);
    if (b.sp) keepSpeed(b);
  }

  function step(dt) {
    const sub = 4, h = dt / sub;
    for (let s = 0; s < sub; s++) {
      for (const f of fighters) {
        if (f.stun > 0 || f.frozen > 0) continue;
        f.x += f.vx * h; f.y += f.vy * h;
      }
      for (const b of blobs) { b.x += b.vx * h; b.y += b.vy * h; }
      if (!over) { duck.x += duck.vx * h; duck.y += duck.vy * h; }
      for (const f of fighters) bounce(f);
      if (!over) bounce(duck);
      for (const b of blobs) bounce(b);
      collide(rabbit, slime);
      if (!over) { collideDuck(rabbit); collideDuck(slime); }
      for (let i = 0; i < blobs.length; i++)
        for (let j = i + 1; j < blobs.length; j++) collide(blobs[i], blobs[j]);
    }
  }

  let shakeAmp = 0;
  function shake(v) { shakeAmp = Math.max(shakeAmp, v * CFG.feel.shake); }

  // ==========================================================================
  //  ⑩  主循环
  // ==========================================================================
  function update(dt) {
    if (over) {
      overT += dt;
      if (!mvpOn && overT >= 1.4) { mvpOn = true; showMVP(); }
      return;
    }
    clock += dt;

    if (R.freezeT > 0) {
      R.freezeT = Math.max(0, R.freezeT - dt);
      rabbit.frozen = R.freezeT;
      slime.frozen = R.freezeT;
    } else {
      step(dt);
    }

    for (const f of fighters) {
      if (f.stun > 0) {
        f.stun -= dt;
        if (f.stun <= 0) {
          f.stun = 0;
          const a = Math.random() * Math.PI * 2;
          f.vx = Math.cos(a) * f.sp; f.vy = Math.sin(a) * f.sp;
        }
      }
      if (f.flash > 0) f.flash = Math.max(0, f.flash - dt);
      if (f.shake > 0) f.shake = Math.max(0, f.shake - dt);
      if (f.squash > 0) f.squash = Math.max(0, f.squash - dt);
      if (f.frozen <= 0 && f.stun <= 0 && Math.abs(f.vx) > 20) f.face = f.vx > 0 ? 1 : -1;
      while (f.dmgLog.length && clock - f.dmgLog[0].t > 30) f.dmgLog.shift();
    }

    updateRabbit(dt);
    updateSlime(dt);
    updateDuck(dt);
    updateBlobs(dt);

    for (let i = pending.length - 1; i >= 0; i--) {
      const ev = pending[i];
      if (ev.gen !== gen) { pending.splice(i, 1); continue; }
      if (clock >= ev.at) { pending.splice(i, 1); ev.fn(); }
    }

    for (const k in fx) {
      if (k === 'snow') continue;
      const arr = fx[k];
      for (let i = arr.length - 1; i >= 0; i--) {
        arr[i].t += dt;
        if (arr[i].t >= arr[i].dur) arr.splice(i, 1);
      }
    }

    for (const s of fx.snow) {
      s.y += s.sp * dt;
      s.x += s.drift * dt;
      if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
      if (s.x < -4) s.x = W + 4;
      if (s.x > W + 4) s.x = -4;
    }

    if (shakeAmp > 0) shakeAmp = Math.max(0, shakeAmp - dt * 6.5);
  }

  // ==========================================================================
  //  ⑪  渲染
  // ==========================================================================
  function drawBackdrop() {
    if (R.iceT > 0 && img.ice.complete && img.ice.naturalWidth) {
      const p = 1 - R.iceT / CFG.rabbit.ult.iceDur;
      const z = 1 + 0.07 * p;
      const iw = img.ice.naturalWidth, ih = img.ice.naturalHeight;
      const k = Math.max(W / iw, H / ih) * z;
      const dw = iw * k, dh = ih * k;
      ctx.save();
      ctx.globalAlpha = Math.min(1, R.iceT / 0.35);
      ctx.drawImage(img.ice, (W - dw) / 2, (H - dh) / 2, dw, dh);
      ctx.fillStyle = 'rgba(10,42,63,.34)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      return;
    }

    ctx.fillStyle = '#11b4f3';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.09)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();
  }

  function drawSnow() {
    if (R.iceT <= 0) return;
    const a0 = Math.min(1, R.iceT / 0.4);
    ctx.save();
    ctx.fillStyle = '#ffffff';
    for (const s of fx.snow) {
      ctx.globalAlpha = s.a * a0;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawChar(f) {
    const dying = f.hp <= 0;
    const sk = f.shake > 0 ? f.shake / 0.3 : 0;
    const ox = sk ? Math.sin(clock * 86) * 4.4 * sk : 0;
    const oy = sk ? Math.cos(clock * 71) * 2.6 * sk : 0;
    const sq = f.squash > 0 ? f.squash / 0.24 : 0;
    const floatY = f.sky > 0 ? -56 - Math.sin(clock * 2.4) * 6 : 0;

    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#062033';
    ctx.beginPath();
    ctx.ellipse(f.x, f.y + f.hh * 0.88 + 6, f.hw * 0.78, f.hw * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (f.sky > 0) {
      const top = f.y + floatY - f.hh;
      const g = ctx.createLinearGradient(0, top - 70, 0, f.y + f.hh);
      g.addColorStop(0, 'rgba(201,166,255,0)');
      g.addColorStop(0.55, 'rgba(201,166,255,.36)');
      g.addColorStop(1, 'rgba(201,166,255,0)');
      ctx.save();
      ctx.fillStyle = g;
      ctx.fillRect(f.x - f.hw * 1.55, top - 70, f.hw * 3.1, f.hh * 2 + 80);
      ctx.restore();
    }

    ctx.save();
    if (dying) ctx.globalAlpha = 0.3;
    ctx.translate(f.x + ox, f.y + oy + floatY);
    if (sq > 0) ctx.scale(1 + 0.1 * sq, 1 - 0.1 * sq);
    if (f.face < 0) ctx.scale(-1, 1);
    ctx.drawImage(img[f.key], -f.hw, -f.hh, f.dw, f.dh);
    ctx.restore();

    if (!dying && f.flash > 0) {
      ctx.save();
      ctx.globalAlpha = (f.flash / 0.2) * 0.45;
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(f.x + ox, f.y + oy + floatY);
      if (f.face < 0) ctx.scale(-1, 1);
      ctx.drawImage(img[f.key], -f.hw, -f.hh, f.dw, f.dh);
      ctx.restore();
    }

    if (f.sky > 0) {
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.globalAlpha = 0.55 - i * 0.13;
        ctx.strokeStyle = i === 0 ? '#ffe6a6' : '#c9a6ff';
        ctx.lineWidth = 3 - i * 0.6;
        ctx.beginPath();
        ctx.ellipse(f.x, f.y + floatY + i * 14, f.hw * (1.1 + i * 0.16), f.hw * (0.34 + i * 0.07), 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    if (f.invuln > 0) {
      ctx.save();
      ctx.globalAlpha = 0.45 + 0.25 * Math.sin(clock * 12);
      ctx.strokeStyle = '#ff9a8a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(f.x, f.y + floatY, Math.max(f.hw, f.hh) * 1.22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // v3.0：被摇摆鸭增益的一方，脚下有一圈流动的金环
    if (buff.target === f) {
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.22 * Math.sin(clock * 2.6);
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 3.4;
      ctx.setLineDash([11, 9]);
      ctx.lineDashOffset = -clock * 46;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y + f.hh * 0.86, f.hw * 1.28, f.hw * 0.31, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    if (f.frozen > 0) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#9fe3ff';
      ctx.beginPath();
      ctx.ellipse(f.x, f.y + floatY, f.hw * 1.16, f.hh * 1.12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = '#e6faff';
      ctx.lineWidth = 2.4;
      ctx.stroke();
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * Math.PI * 2 + 0.3, rr = f.hw;
        ctx.beginPath();
        ctx.moveTo(f.x + Math.cos(a) * rr * 0.4, f.y + floatY + Math.sin(a) * rr * 0.4);
        ctx.lineTo(f.x + Math.cos(a) * rr * 1.1, f.y + floatY + Math.sin(a) * rr * 1.1);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawHammer() {
    if (!img.hammer.complete || !img.hammer.naturalWidth || rabbit.hp <= 0) return;
    if (!R.on) return;
    const HM = CFG.rabbit.hammer;
    const cx = clamp(rabbit.x, 80, W - 80), cy = clamp(rabbit.y, 80, H - 80);

    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.setLineDash([9, 12]);
    ctx.lineDashOffset = -clock * 60;
    ctx.beginPath();
    ctx.arc(cx, cy, HM.orbitR + HM.len * 0.3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    const s = HM.len / img.hammer.naturalWidth;
    const dw = HM.len, dh = img.hammer.naturalHeight * s;

    for (let i = 4; i >= 0; i--) {
      const a = R.ang - i * 0.13;
      ctx.save();
      ctx.globalAlpha = i === 0 ? 1 : Math.max(0, 0.26 - i * 0.05);
      ctx.translate(cx + Math.cos(a) * HM.orbitR, cy + Math.sin(a) * HM.orbitR);
      ctx.rotate(a);
      ctx.drawImage(img.hammer, -dw / 2, -dh / 2, dw, dh);
      ctx.restore();
    }
  }

  // ---------- v3.0 摇摆鸭渲染 ----------
  function roundRectPath(g, x, y, w, h, r) {
    const rr = Math.min(r, h / 2, w / 2);
    g.beginPath();
    g.moveTo(x + rr, y);
    g.arcTo(x + w, y, x + w, y + h, rr);
    g.arcTo(x + w, y + h, x, y + h, rr);
    g.arcTo(x, y + h, x, y, rr);
    g.arcTo(x, y, x + w, y, rr);
    g.closePath();
  }

  function drawDuck() {
    if (!img.duck.complete || !img.duck.naturalWidth) return;
    const joined = !!duck.join;
    const col = joined ? (SIDE_COLOR[duck.join] || '#ffd166') : '#ffd166';
    const a = joined ? CFG.duck.joinedAlpha : CFG.duck.alpha;
    // Q 弹形变：sq > 0 压扁、< 0 拉长，再叠一点自带的果冻抖动
    const sq = duck.sq;
    const jelly = 1 + 0.035 * Math.sin(clock * 6.4 + duck.wob);
    const kx = (1 + sq * 0.52) * jelly;
    const ky = (1 - sq * 0.52) / jelly;

    // 地面阴影
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#062033';
    ctx.beginPath();
    ctx.ellipse(duck.x, duck.y + duck.hh * 0.92, duck.hw * 0.82, duck.hw * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 加入阵营后的金色光柱
    if (joined) {
      const g = ctx.createLinearGradient(0, duck.y - duck.hh * 1.6, 0, duck.y + duck.hh);
      g.addColorStop(0, 'rgba(255,209,102,0)');
      g.addColorStop(0.5, 'rgba(255,209,102,.26)');
      g.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = g;
      ctx.fillRect(duck.x - duck.hw * 1.3, duck.y - duck.hh * 1.6, duck.hw * 2.6, duck.hh * 2.6);
      ctx.restore();
    }

    // 半透明白底光：避免半透明的黄色鸭叠在蓝色场地上发绿
    if (!joined) {
      const g = ctx.createRadialGradient(duck.x, duck.y, duck.hw * 0.15, duck.x, duck.y, duck.hw * 1.55);
      g.addColorStop(0, 'rgba(255,255,255,.62)');
      g.addColorStop(0.58, 'rgba(255,255,255,.26)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.save();
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(duck.x, duck.y, duck.hw * 1.55, duck.hh * 1.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 本体（半透明 + 摇摆）
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(duck.x, duck.y);
    ctx.rotate(Math.sin(clock * 3.6 + duck.wob * 1.5) * 0.15);
    ctx.scale(duck.face < 0 ? -kx : kx, ky);
    ctx.drawImage(img.duck, -duck.hw, -duck.hh, duck.dw, duck.dh);
    ctx.restore();

    if (duck.flash > 0) {
      ctx.save();
      ctx.globalAlpha = (duck.flash / 0.2) * 0.5;
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(duck.x, duck.y);
      ctx.scale(duck.face < 0 ? -1 : 1, 1);
      ctx.drawImage(img.duck, -duck.hw, -duck.hh, duck.dw, duck.dh);
      ctx.restore();
    }

    // 充能进度环
    const need0 = duckNeed();
    const prog = clamp(duck.roundHits / need0, 0, 1);
    const rr = duck.rc + 15;
    ctx.save();
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 10]);
    ctx.lineDashOffset = -clock * 24;
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(duck.x, duck.y, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 5;
    ctx.strokeStyle = col;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(duck.x, duck.y, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.004, prog));
    ctx.stroke();
    ctx.restore();

  }

  // 鸭子头顶的标签单独画在最上层，避免被角色盖住
  function drawDuckTag() {
    if (!img.duck.complete || !img.duck.naturalWidth) return;
    const joined = !!duck.join;
    const col = joined ? (SIDE_COLOR[duck.join] || '#ffd166') : '#ffd166';
    const need = duckNeed();
    const txt = joined
      ? '加入' + SIDE_NAME[duck.join] + ' +' + Math.round(buff.hp * 100) + '%/' + Math.round(buff.atk * 100) + '% · ' + duck.hits + ' 击'
      : '中立 ' + Math.floor(duck.roundHits) + '/' + need + ' · 累计 ' + duck.hits + ' 击';
    ctx.save();
    ctx.font = '900 15px "PingFang SC","Microsoft YaHei",sans-serif';
    const tw = ctx.measureText(txt).width;
    const pw = tw + 26, ph = 26;
    const px = clamp(duck.x - pw / 2, 6, W - pw - 6);
    const py = clamp(duck.y - duck.hh - 38, 6, H - ph - 6);
    ctx.globalAlpha = 0.94;
    roundRectPath(ctx, px, py, pw, ph, 13);
    ctx.fillStyle = 'rgba(10,42,63,.85)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = col;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, px + pw / 2, py + ph / 2 + 1);
    ctx.restore();
  }

  function drawBlobs() {
    for (const b of blobs) {
      let a = 1;
      if (b.life < 1.2) a = Math.max(0, b.life / 1.2);
      const wob = 1 + 0.09 * Math.sin(b.wob + clock * 9);
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const stretch = Math.min(1.18, 1 + sp / 3000);
      const ang = Math.atan2(b.vy, b.vx), r = b.r;

      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.scale(stretch, wob / stretch);
      const g = ctx.createRadialGradient(-r * 0.3, -r * 0.34, r * 0.12, 0, 0, r * 1.06);
      g.addColorStop(0, b.gen ? '#d8ffbc' : '#affa90');
      g.addColorStop(0.55, b.gen ? '#84e65e' : '#5fd94a');
      g.addColorStop(1, '#2f8f2a');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = Math.max(2, r * 0.16);
      ctx.strokeStyle = '#123d18';
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#123d18';
      ctx.beginPath();
      ctx.ellipse(b.x - r * 0.34, b.y - r * 0.16, r * 0.11, r * 0.16, 0, 0, Math.PI * 2);
      ctx.ellipse(b.x + r * 0.34, b.y - r * 0.16, r * 0.11, r * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#123d18';
      ctx.lineWidth = Math.max(1.4, r * 0.09);
      ctx.beginPath();
      ctx.arc(b.x, b.y + r * 0.16, r * 0.3, 0.18 * Math.PI, 0.82 * Math.PI);
      ctx.stroke();
      ctx.restore();
    }
  }

  function crossPath(g, cx, cy, s, t) {
    const a = s / 2, b = s * t / 2;
    g.beginPath();
    g.moveTo(cx - b, cy - a); g.lineTo(cx + b, cy - a); g.lineTo(cx + b, cy - b);
    g.lineTo(cx + a, cy - b); g.lineTo(cx + a, cy + b); g.lineTo(cx + b, cy + b);
    g.lineTo(cx + b, cy + a); g.lineTo(cx - b, cy + a); g.lineTo(cx - b, cy + b);
    g.lineTo(cx - a, cy + b); g.lineTo(cx - a, cy - b); g.lineTo(cx - b, cy - b);
    g.closePath();
  }

  function drawHp(f) {
    const s = 80, th = 0.46;
    const floatY = f.sky > 0 ? -56 : 0;
    let cy = f.y + floatY - f.hh - s / 2 - 10;
    if (cy - s / 2 < 6) cy = f.y + floatY + f.hh + s / 2 + 12;
    const cx = clamp(f.x, s / 2 + 6, W - s / 2 - 6);
    const ratio = clamp(f.hp / f.maxHp, 0, 1);
    const txt = String(Math.round(f.hp));

    ctx.save();
    crossPath(ctx, cx, cy, s, th);
    ctx.fillStyle = '#08161f';
    ctx.fill();

    ctx.save();
    crossPath(ctx, cx, cy, s, th);
    ctx.clip();
    const bottom = cy + s / 2;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - s / 2, bottom - s, s, s);
    const grd = ctx.createLinearGradient(0, bottom - s * ratio, 0, bottom);
    grd.addColorStop(0, '#ff6a5a');
    grd.addColorStop(1, '#d61b14');
    ctx.fillStyle = grd;
    ctx.fillRect(cx - s / 2, bottom - s * ratio, s, s * ratio);
    ctx.restore();

    crossPath(ctx, cx, cy, s, th);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(6,20,32,.75)';
    ctx.stroke();

    let fs = Math.round(s * 0.34);
    ctx.font = '900 ' + fs + 'px "PingFang SC",sans-serif';
    while (fs > 8 && ctx.measureText(txt).width > s - 18) {
      fs -= 1;
      ctx.font = '900 ' + fs + 'px "PingFang SC",sans-serif';
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, fs * 0.22);
    ctx.strokeStyle = 'rgba(6,20,32,.9)';
    ctx.strokeText(txt, cx, cy + 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(txt, cx, cy + 1);
    ctx.restore();
  }

  function drawFx() {
    for (const r of fx.rings) {
      const p = r.t / r.dur;
      const rad = r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - p, 2));
      ctx.save();
      ctx.globalAlpha = (1 - p) * 0.85;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = (r.w || 2.4) * (1 - p) + 0.6;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    for (const s of fx.sparks) {
      const p = s.t / s.dur;
      ctx.save();
      ctx.globalAlpha = 1 - p;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2 + 0.4;
        const r0 = 5 + p * 16, r1 = r0 + 6 * (1 - p);
        ctx.beginPath();
        ctx.moveTo(s.x + Math.cos(a) * r0, s.y + Math.sin(a) * r0);
        ctx.lineTo(s.x + Math.cos(a) * r1, s.y + Math.sin(a) * r1);
        ctx.stroke();
      }
      ctx.restore();
    }
    for (const s of fx.shards) {
      const p = s.t / s.dur;
      const x = s.x + (s.tx - s.x) * p, y = s.y + (s.ty - s.y) * p;
      ctx.save();
      ctx.globalAlpha = (1 - p) * 0.9;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.moveTo(x, y - 4); ctx.lineTo(x + 3, y); ctx.lineTo(x, y + 4); ctx.lineTo(x - 3, y);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    for (const n of fx.nums) {
      const p = n.t / n.dur;
      ctx.save();
      ctx.globalAlpha = p < 0.1 ? p / 0.1 : (p > 0.7 ? Math.max(0, 1 - (p - 0.7) / 0.3) : 1);
      ctx.font = '900 ' + n.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const y = n.y - p * 28;
      ctx.lineWidth = Math.max(3, n.size * 0.18);
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(6,20,32,.72)';
      ctx.strokeText(n.text, n.x, y);
      ctx.fillStyle = n.color;
      ctx.fillText(n.text, n.x, y);
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.save();
    if (shakeAmp > 0.01) {
      ctx.translate(Math.sin(clock * 97) * shakeAmp * 7, Math.cos(clock * 79) * shakeAmp * 5);
    }
    drawBackdrop();
    drawDuck();
    drawBlobs();
    for (const f of fighters) drawChar(f);
    drawHammer();
    drawDuckTag();
    drawFx();
    for (const f of fighters) drawHp(f);
    drawSnow();
    ctx.restore();
  }

  function setSkill(id, cls, state, remain, ratio) {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = 'sk' + (cls ? ' ' + cls : '');
    el.querySelector('.sk-line b').textContent = state;
    el.querySelector('.sk-line span').textContent = remain;
    el.querySelector('.sk-bar i').style.width = Math.round(clamp(ratio, 0, 1) * 100) + '%';
  }

  let uiAcc = 0;
  function updateUI(dt) {
    uiAcc += dt;
    if (uiAcc < 0.08) return;
    uiAcc = 0;

    for (const pair of [[rabbit, 'A'], [slime, 'B']]) {
      const f = pair[0], suf = pair[1];
      const ratio = clamp(f.hp / f.maxHp, 0, 1);
      const bar = document.getElementById('bar' + suf);
      bar.querySelector('i').style.width = (ratio * 100).toFixed(1) + '%';
      bar.querySelector('b').textContent = fmt(f.hp);
      document.getElementById('hp' + suf).textContent = fmt(f.hp) + ' / ' + fmt(f.maxHp);
      document.getElementById('dps' + suf).textContent = 'DPS ' + fmt(clock > 0.5 ? f.dealt / clock : 0);
      const stEl = document.getElementById('stat' + suf);
      if (stEl) stEl.textContent = '生命 ' + fmt(f.maxHp) + ' · 攻击 ' + fmt(f.atk);
      const blEl = document.getElementById('buff' + suf);
      if (blEl) {
        const on = buff.target === f;
        blEl.classList.toggle('on', on);
        if (on) blEl.textContent = '鸭之祝福 生命+' + Math.round(buff.hp * 100) + '% 攻击+' + Math.round(buff.atk * 100) + '%';
      }
    }

    const HM = CFG.rabbit.hammer;
    if (R.on) setSkill('skHammer', 'active', '挥击中', (HM.dur - R.t).toFixed(1) + 's', 1 - R.t / HM.dur);
    else {
      const left = Math.max(0, HM.period - R.idle);
      setSkill('skHammer', left <= 0.05 ? 'ready' : '', left <= 0.05 ? '就绪' : '冷却', left.toFixed(1) + 's', 1 - left / HM.period);
    }

    const ultTag = R.ultLeft + '/' + CFG.rabbit.ult.uses;
    if (R.ultLeft <= 0) {
      setSkill('skUlt', '', '已用尽', '0/' + CFG.rabbit.ult.uses, 0);
    } else if (R.lockT > 0) {
      setSkill('skUlt', 'lock', '锁血中', R.lockT.toFixed(1) + 's', R.lockT / CFG.rabbit.ult.lockDur);
    } else if (R.iceT > 0) {
      setSkill('skUlt', 'active', '冰岛展开', R.iceT.toFixed(1) + 's', R.iceT / CFG.rabbit.ult.iceDur);
    } else {
      const need = clamp((rabbit.hp / rabbit.maxHp - CFG.rabbit.ult.hpThreshold) / (1 - CFG.rabbit.ult.hpThreshold), 0, 1);
      setSkill('skUlt', 'ready', '待触发', ultTag, need);
    }

    const M = CFG.slime.moral;
    if (S.moral.air > 0) setSkill('skMoral', 'active', '浮空免疫', S.moral.air.toFixed(1) + 's', S.moral.air / M.air);
    else if (S.moral.cd > 0) setSkill('skMoral', '', '冷却', S.moral.cd.toFixed(1) + 's', 1 - S.moral.cd / M.cd);
    else if (S.moral.readyFor > 0.4) setSkill('skMoral', 'ready', '留招', S.moral.readyFor.toFixed(0) + 's', 1 - S.moral.readyFor / M.holdMax);
    else setSkill('skMoral', 'ready', '就绪', '✓', 1);

    const Hc = CFG.slime.history;
    if (S.history.mute > 0) setSkill('skHistory', 'active', '停手中', S.history.mute.toFixed(1) + 's', 1 - S.history.mute / Hc.mute);
    else if (S.history.cd > 0) setSkill('skHistory', '', '冷却', S.history.cd.toFixed(1) + 's', 1 - S.history.cd / Hc.cd);
    else if (S.history.readyFor > 0.4) setSkill('skHistory', 'ready', '留招', S.history.readyFor.toFixed(0) + 's', 1 - S.history.readyFor / Hc.holdMax);
    else setSkill('skHistory', 'ready', '就绪', '✓', 1);

    // ---- v3.0 摇摆鸭状态条 ----
    const needD = duckNeed();
    const rHits = Math.floor(duck.roundHits);
    const chip = document.getElementById('duckChip');
    if (chip) {
      const joined = !!duck.join;
      chip.classList.toggle('joined', joined);
      // 中立居中；加入阵营则整块滑到那一侧并换主题色
      document.getElementById('duckName').textContent =
        '摇摆鸭 · ' + (joined ? SIDE_NAME[duck.join] + '阵营' : '中立');
      document.getElementById('duckState').textContent = joined
        ? '累计 ' + duck.hits + ' 击 · 加成 +' + Math.round(buff.hp * 100) + '%/' + Math.round(buff.atk * 100) + '%'
        : '累计 ' + duck.hits + ' 击 · 本轮 ' + rHits + '/' + needD;
      document.getElementById('duckProg').style.width = Math.round((duck.roundHits / needD) * 100) + '%';
      dockDuckChip();
      const bA = document.getElementById('duckBadgeA');
      const bB = document.getElementById('duckBadgeB');
      if (bA) bA.classList.toggle('on', joined && duck.join === 'left');
      if (bB) bB.classList.toggle('on', joined && duck.join === 'right');
    }

    if (detailOn) updateDetail();
  }

  function rowBar(k, ratio, val) {
    return '<div class="row"><span class="k">' + k + '</span>'
      + '<span class="bar2"><i style="width:' + Math.round(clamp(ratio, 0, 1) * 100) + '%"></i></span>'
      + '<span class="v">' + val + '</span></div>';
  }

  function tagOf(f) {
    if (f.hp <= 0) return '<span class="tag t-lock">倒下</span>';
    if (f.invuln > 0) return '<span class="tag t-lock">锁血</span>';
    if (f.sky > 0) return '<span class="tag t-on">浮空·免疫</span>';
    if (f.frozen > 0) return '<span class="tag t-on">冰冻</span>';
    if (f.stun > 0) return '<span class="tag t-cd">眩晕</span>';
    return '<span class="tag t-ok">正常</span>';
  }

  // ==========================================================================
  //  ⑫.5  v3.1 摇摆鸭 · 增益结算弹窗（B 站登录框 1:1）/ 策划面板
  // ==========================================================================
  const duckUI = {
    hp: CFG.duck.buff.hpDefault,
    atk: CFG.duck.buff.atkDefault
  };
  const bili = { open: false, target: null };
  const biliEl = id => document.getElementById(id);

  // 弹窗是固定 1010×600 的设计稿，屏幕不够就整卡等比缩放，保证版式一模一样
  function biliScale() {
    const s = Math.min((window.innerWidth - 32) / 1010, (window.innerHeight - 32) / 600, 1);
    document.documentElement.style.setProperty('--bs', Math.max(0.35, s).toFixed(3));
  }

  // 滑块左侧已填充的蓝色进度
  function syncRangeFill(el) {
    const min = +el.min || 0, max = +el.max || 100, v = +el.value;
    el.style.setProperty('--p', (((v - min) / (max - min)) * 100).toFixed(1) + '%');
  }

  function refreshBiliInfo() {
    const t = bili.target || slime;
    const need = duckNeed();
    biliEl('tgName').textContent = SIDE_NAME[t.side];
    biliEl('tgStat').textContent = fmt(t.maxHp) + ' / ' + fmt(t.atk);
    biliEl('tgHits').textContent = duck.hits + ' 次（本轮 ' + Math.floor(duck.roundHits) + ' / ' + need + '）';
    biliEl('tgNext').textContent = '再撞 ' + Math.max(0, Math.ceil(need - duck.roundHits)) + ' 次';
  }

  function switchBiliPane(which) {
    document.querySelectorAll('.bili-tabs .tab').forEach(function (t) {
      t.classList.toggle('on', t.getAttribute('data-pane') === which);
    });
    biliEl('paneCfg').classList.toggle('on', which === 'cfg');
    biliEl('paneInfo').classList.toggle('on', which === 'info');
    if (which === 'info') refreshBiliInfo();
  }

  function openBili(target) {
    bili.open = true;
    bili.target = target;
    const left = target.side === 'left';
    // 右下角立绘跟着增益对象走：增益兔子就放兔子，增益史莱姆就放史莱姆
    const deco = biliEl('decoR');
    deco.src = left ? IMG_SRC.a : IMG_SRC.b;
    deco.classList.toggle('slime', !left);
    biliEl('soRabbit').classList.toggle('hot', left);
    biliEl('soSlime').classList.toggle('hot', !left);
    biliEl('soDuck').classList.remove('hot');
    biliEl('sldHp').value = String(Math.round(duckUI.hp * 100));
    biliEl('sldAtk').value = String(Math.round(duckUI.atk * 100));
    biliEl('valHp').textContent = '+' + Math.round(duckUI.hp * 100) + '%';
    biliEl('valAtk').textContent = '+' + Math.round(duckUI.atk * 100) + '%';
    syncRangeFill(biliEl('sldHp'));
    syncRangeFill(biliEl('sldAtk'));
    switchBiliPane('cfg');
    refreshBiliInfo();
    biliScale();
    const mask = biliEl('biliMask');
    mask.classList.remove('show', 'closing');
    void mask.offsetWidth;    // 强制重排，连开两次也能重播入场动画
    mask.classList.add('show');
    sfxModalIn();
    updateUI(1);              // 弹窗一打开就把侧栏刷成增益后的数值

  let biliTimer = 0;
  function closeBili(instant) {
    bili.open = false;
    const d = document.getElementById('designer');
    if (d) d.classList.remove('show');
    const m = document.getElementById('biliMask');
    if (!m) return;
    clearTimeout(biliTimer);
    if (instant) { m.classList.remove('show', 'closing'); return; }
    m.classList.add('closing');
    sfxModalOut();
    biliTimer = setTimeout(function () { m.classList.remove('show', 'closing'); }, 180);
  }

  // ---- 策划面板 ----
  const DESIGNER_ROWS = [
    { k: '兔子 · 基础生命', p: 'rabbit.maxHp', min: 6000, max: 20000, step: 100 },
    { k: '兔子 · 基础攻击', p: 'rabbit.atk', min: 1500, max: 6000, step: 50 },
    { k: '兔子 · 锤击倍率 %', p: 'rabbit.dmgAtkRatio', min: 30, max: 140, step: 1, pct: true },
    { k: '兔子 · 大招回血 %', p: 'rabbit.ult.healRatio', min: 0, max: 80, step: 1, pct: true },
    { k: '史莱姆 · 基础生命', p: 'slime.maxHp', min: 6000, max: 20000, step: 100 },
    { k: '史莱姆 · 基础攻击', p: 'slime.atk', min: 1500, max: 6000, step: 50 },
    { k: '史莱姆 · 单球倍率 %', p: 'slime.spit.dmgAtkRatio', min: 30, max: 120, step: 1, pct: true },
    { k: '史莱姆 · 历史回血 %', p: 'slime.history.healRatio', min: 0, max: 80, step: 1, pct: true },
    { k: '摇摆鸭 · 首轮撞击数', p: 'duck.hitsPerRound', min: 5, max: 80, step: 1 },
    { k: '摇摆鸭 · 每轮递增', p: 'duck.hitsPerStep', min: 0, max: 10, step: 1 },
    { k: '摇摆鸭 · 生命增益默认 %', p: 'duck.buff.hpDefault', min: 0, max: 40, step: 1, pct: true },
    { k: '摇摆鸭 · 攻击增益默认 %', p: 'duck.buff.atkDefault', min: 0, max: 30, step: 1, pct: true }
  ];
  const CFG0 = JSON.parse(JSON.stringify(CFG));

  function getPath(path) {
    return path.split('.').reduce(function (o, k) { return o[k]; }, CFG);
  }
  function setPath(path, val) {
    const p = path.split('.');
    let o = CFG;
    for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
    o[p[p.length - 1]] = val;
  }
  function getPathFrom(root, path) {
    return path.split('.').reduce(function (o, k) { return o[k]; }, root);
  }

  function buildDesigner() {
    const body = document.getElementById('designerBody');
    if (!body) return;
    body.innerHTML = DESIGNER_ROWS.map(function (r, i) {
      const v = getPath(r.p);
      const shown = r.pct ? Math.round(v * 100) : v;
      return '<div class="drow"><div class="dk">' + r.k + '<small>' + r.p + '</small></div>'
        + '<input type="number" data-i="' + i + '" min="' + r.min + '" max="' + r.max
        + '" step="' + r.step + '" value="' + shown + '"></div>';
    }).join('');
  }

  function applyDesigner() {
    document.querySelectorAll('#designerBody input').forEach(function (el) {
      const r = DESIGNER_ROWS[+el.getAttribute('data-i')];
      let v = parseFloat(el.value);
      if (!isFinite(v)) return;
      v = clamp(v, r.min, r.max);
      setPath(r.p, r.pct ? v / 100 : v);
    });
    duckUI.hp = CFG.duck.buff.hpDefault;
    duckUI.atk = CFG.duck.buff.atkDefault;
    closeBili();
    buildHud();
    if (detailOn) {
      document.getElementById('detailA').classList.add('show');
      document.getElementById('detailB').classList.add('show');
      document.querySelectorAll('.card').forEach(function (c) { c.classList.add('detail-on'); });
    }
    reset();
    updateUI(1);
    showBanner('策划面板已应用');
  }

  function initBili() {
    // 图片统一从 IMG_SRC 取，避免同一张 base64 在 HTML 里重复内联
    biliEl('duckChipImg').src = IMG_SRC.duck;
    biliEl('soRabbitImg').src = IMG_SRC.a;
    biliEl('soSlimeImg').src = IMG_SRC.b;
    biliEl('soDuckImg').src = IMG_SRC.duck;
    biliEl('decoL').src = IMG_SRC.duck;
    biliEl('decoR').src = IMG_SRC.a;
    var bA = biliEl('duckBadgeImgA'), bB = biliEl('duckBadgeImgB');
    if (bA) bA.src = IMG_SRC.duck;
    if (bB) bB.src = IMG_SRC.duck;

    const sHp = biliEl('sldHp'), sAtk = biliEl('sldAtk');
    sHp.max = String(Math.round(CFG.duck.buff.hpMax * 100));
    sAtk.max = String(Math.round(CFG.duck.buff.atkMax * 100));

    sHp.addEventListener('input', function () {
      duckUI.hp = (+this.value) / 100;
      biliEl('valHp').textContent = '+' + Math.round(duckUI.hp * 100) + '%';
      syncRangeFill(this);
      if (bili.target) applyBuff(bili.target, duckUI.hp, duckUI.atk);
      refreshBiliInfo();
      updateUI(1);
    });
    sAtk.addEventListener('input', function () {
      duckUI.atk = (+this.value) / 100;
      biliEl('valAtk').textContent = '+' + Math.round(duckUI.atk * 100) + '%';
      syncRangeFill(this);
      if (bili.target) applyBuff(bili.target, duckUI.hp, duckUI.atk);
      refreshBiliInfo();
      updateUI(1);
    });

    biliEl('biliDefault').addEventListener('click', function () {
      duckUI.hp = CFG.duck.buff.hpDefault;
      duckUI.atk = CFG.duck.buff.atkDefault;
      sHp.value = String(Math.round(duckUI.hp * 100));
      sAtk.value = String(Math.round(duckUI.atk * 100));
      biliEl('valHp').textContent = '+' + Math.round(duckUI.hp * 100) + '%';
      biliEl('valAtk').textContent = '+' + Math.round(duckUI.atk * 100) + '%';
      syncRangeFill(sHp); syncRangeFill(sAtk);
      if (bili.target) applyBuff(bili.target, duckUI.hp, duckUI.atk);
      refreshBiliInfo();
      updateUI(1);
    });

    biliEl('biliConfirm').addEventListener('click', function () {
      if (bili.target) applyBuff(bili.target, duckUI.hp, duckUI.atk);
      closeBili();
      showBanner('增益已确认');
      say('增益已确认');
    });

    biliEl('biliClose').addEventListener('click', function () { closeBili(); });

    document.querySelectorAll('.bili-tabs .tab').forEach(function (t) {
      t.addEventListener('click', function () { switchBiliPane(t.getAttribute('data-pane')); });
    });

    biliEl('biliMask').addEventListener('click', function (e) {
      if (e.target === biliEl('biliMask')) closeBili();
    });

    // 策划面板
    biliEl('btnDesigner').addEventListener('click', function () {
      buildDesigner();
      biliEl('designer').classList.add('show');
    });
    biliEl('dClose').addEventListener('click', function () {
      biliEl('designer').classList.remove('show');
    });
    biliEl('dApply').addEventListener('click', applyDesigner);
    biliEl('dResetCfg').addEventListener('click', function () {
      DESIGNER_ROWS.forEach(function (r) {
        setPath(r.p, getPathFrom(CFG0, r.p));
      });
      buildDesigner();
    });
    biliEl('designer').addEventListener('click', function (e) {
      if (e.target === biliEl('designer')) biliEl('designer').classList.remove('show');
    });

    biliEl('soDuck').classList.add('hot');
    syncRangeFill(sHp); syncRangeFill(sAtk);
    window.addEventListener('resize', biliScale);
    biliScale();
  }


  // 状态条停靠：中立居中，加入兔子贴左，加入史莱姆贴右（带过渡）
  let chipSide = 'none';
  function dockDuckChip() {
    const chip = document.getElementById('duckChip');
    if (!chip) return;
    const side = duck.join || 'none';
    const w = stage.clientWidth || 1;
    const half = Math.max(0, w / 2 - chip.offsetWidth / 2 - 10);
    const dx = side === 'left' ? -half : side === 'right' ? half : 0;
    chip.classList.toggle('theme-l', side === 'left');
    chip.classList.toggle('theme-r', side === 'right');
    chip.style.transform = 'translate(calc(-50% + ' + dx.toFixed(1) + 'px), 0)';
    chipSide = side;
  }

  // ==========================================================================
  //  ⑬  横幅 / 结算 / 交互
  // ==========================================================================
  let bannerT = 0;
  function showBanner(text) {
    const el = document.getElementById('banner');
    if (!text) { el.classList.remove('show'); return; }
    el.textContent = text;
    el.classList.add('show');
    bannerT = 1.1;
  }

  // 死亡瞬间：黑场 + 大字 K.O.
  function showKO() {
    showBanner('');
    const ov = document.getElementById('overlay');
    const ko = document.getElementById('koText');
    const mvp = document.getElementById('mvpCard');
    mvp.classList.remove('show');
    mvp.innerHTML = '';
    ko.classList.remove('show');
    ov.classList.add('show');
    void ko.offsetWidth;          // 强制重排，动画才会重新播
    ko.classList.add('show');
  }

  // 1.4s 后：MVP 结算卡
  function showMVP() {
    const win = over === 'rabbit' ? rabbit : slime;
    const name = over === 'rabbit' ? '兔子' : '史莱姆';
    const ava = over === 'rabbit' ? IMG_SRC.a : IMG_SRC.b;
    const rate = Math.round(win.hp / win.maxHp * 100);
    const dps = Math.round(win.dealt / Math.max(1, clock));
    const heal = win === slime ? fmt(win.healed) : '—';

    const rows = [
      ['剩余生命', fmt(win.hp) + ' / ' + fmt(win.maxHp) + '（' + rate + '%）'],
      ['造成伤害', fmt(win.dealt)],
      ['承受伤害', fmt(win.taken)],
      ['命中次数', fmt(win.hits) + ' 次'],
      ['吸血 / 治疗', heal],
      ['平均 DPS', fmt(dps)],
      ['对局时长', clock.toFixed(1) + ' 秒'],
      ['最终状态', rate >= 50 ? '压倒性' : rate >= 20 ? '险胜' : '残血翻盘']
    ];

    const card = document.getElementById('mvpCard');
    card.innerHTML =
      '<div class="mvp-top"><img class="mvp-ava" src="' + ava + '">'
      + '<div><div class="mvp-name">' + name + '<span class="mvp-badge">MVP</span></div>'
      + '<div class="mvp-sub">K.O. 获胜 · ' + clock.toFixed(1) + ' 秒</div></div></div>'
      + '<div class="mvp-grid">'
      + rows.map(function (r) {
          return '<div class="mvp-row"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>';
        }).join('')
      + '</div>'
      + '<div class="mvp-actions"><button id="btnAgain">再来一局</button></div>'
      + '<div class="mvp-hint">点卡片外区域也可以重开</div>';

    document.getElementById('koText').classList.remove('show');
    card.classList.add('show');
    sfxWin();
    say('本局 M V P，' + name + '，剩余生命百分之' + rate);

    const again = document.getElementById('btnAgain');
    if (again) again.addEventListener('click', function (e) { e.stopPropagation(); reset(); });
  }

  document.getElementById('btnReset').addEventListener('click', () => { reset(); });

  window.__sim = {
    pause() { paused = true; },
    resume() { paused = false; last = performance.now(); acc = 0; },
    // silent=true 时只推进逻辑、不渲染，用于批量模拟
    advance(sec, silent) {
      for (let i = 0; i < sec * 60; i++) update(1 / 60);
      if (!silent) { render(); updateUI(1); }
    },
    state() {
      return {
        clock, over,
        hp: [Math.round(rabbit.hp), Math.round(slime.hp)],
        maxHp: [Math.round(rabbit.maxHp), Math.round(slime.maxHp)],
        atk: [Math.round(rabbit.atk), Math.round(slime.atk)],
        dealt: [Math.round(rabbit.dealt), Math.round(slime.dealt)],
        hits: [rabbit.hits, slime.hits],
        ultLeft: R.ultLeft, ultCount: R.ultCount, healed: [Math.round(rabbit.healed), Math.round(slime.healed)],
        iceT: +R.iceT.toFixed(2), freezeT: +R.freezeT.toFixed(2),
        moral: { cd: +S.moral.cd.toFixed(1), air: +S.moral.air.toFixed(1), wait: +S.moral.readyFor.toFixed(1) },
        history: { cd: +S.history.cd.toFixed(1), mute: +S.history.mute.toFixed(1), wait: +S.history.readyFor.toFixed(1) },
        blobs: blobs.length,
        duck: {
          hits: duck.hits,
          roundHits: Math.floor(duck.roundHits),
          need: duckNeed(),
          inRound: Math.floor(duck.roundHits),
          join: duck.join,
          round: buff.round,
          buffHp: +buff.hp.toFixed(3),
          buffAtk: +buff.atk.toFixed(3),
          buffed: buff.target ? buff.target.side : null,
          firstAt: +duck.firstAt.toFixed(1)
        }
      };
    },
    // ---- v3.0 摇摆鸭调试 ----
    duckState() {
      return {
        hits: duck.hits, join: duck.join, round: buff.round,
        hp: duckUI.hp, atk: duckUI.atk, modal: bili.open,
        buffed: buff.target ? buff.target.side : null,
        maxHp: [rabbit.maxHp, slime.maxHp], atk: [rabbit.atk, slime.atk]
      };
    },
    // 手动结算一次（不等 20 次撞击），hitter = 'rabbit' | 'slime'
    settle(hitter) { settleDuckBuff(hitter === 'slime' ? slime : rabbit); },
    setAuto(on) { CFG.duck.buff.autoConfirm = !!on; },
    closeModal() { closeBili(); }
  };

  // ==========================================================================
  //  ⑬.5  全屏冰岛背景 + 语音播报
  // ==========================================================================
  let iceDomOn = false;

  function initIceBg() {
    document.getElementById('iceBg').style.backgroundImage = 'url("' + IMG_SRC.ice + '")';
  }

  // 冰岛冲击时，整个页面（含作战区外）都切成冰岛照片
  function syncIceDom() {
    const on = R.iceT > 0;
    if (on === iceDomOn) return;
    iceDomOn = on;
    document.getElementById('iceBg').classList.toggle('on', on);
    document.body.classList.toggle('ice-mode', on);
  }

  // ---- 语音播报（浏览器自带 TTS） ----
  const TTS = { on: false, voice: null };   // 默认关闭语音播报，需要时点右下角打开

  function initTTS() {
    if (!window.speechSynthesis) { TTS.on = false; return; }
    const pick = () => {
      const vs = window.speechSynthesis.getVoices() || [];
      TTS.voice =
        vs.find(v => /zh[-_]CN/i.test(v.lang) && /Xiaoxiao|Huihui|Yaoyao|Kangkang|female|女/i.test(v.name)) ||
        vs.find(v => /zh[-_]CN/i.test(v.lang)) ||
        vs.find(v => /zh/i.test(v.lang)) || null;
    };
    pick();
    window.speechSynthesis.onvoiceschanged = pick;
  }

  // force = true 时打断当前播报（用于大招 / 阵亡这种关键节点）
  function say(text, force) {
    if (!TTS.on || !window.speechSynthesis) return;
    if (force) window.speechSynthesis.cancel();
    else if (window.speechSynthesis.speaking) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 1.08;
    u.pitch = 1.0;
    u.volume = 1.0;
    if (TTS.voice) u.voice = TTS.voice;
    window.speechSynthesis.speak(u);
  }

  // ==========================================================================
  //  ⑭  启动
  // ==========================================================================
  buildHud();
  initIceBg();
  initTTS();
  initBili();
  seedSnow();
  reset();
  resize();

  let last = performance.now(), acc = 0;
  const STEP = 1 / 60;

  let paused = false;          // 调试用：暂停实时主循环，改由 __sim.advance 手动推进

  function loop(now) {
    if (paused) { requestAnimationFrame(loop); return; }
    // 增益弹窗打开时暂停实时主循环（脚本用 __sim.advance 不受影响）
    if (bili.open) { last = now; acc = 0; requestAnimationFrame(loop); return; }
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard < 6) { update(STEP); acc -= STEP; guard++; }
    if (guard >= 6) acc = 0;

    if (bannerT > 0) {
      bannerT -= dt;
      if (bannerT <= 0) document.getElementById('banner').classList.remove('show');
    }

    render();
    syncIceDom();
    updateUI(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

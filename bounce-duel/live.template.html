<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>兔子 vs 史莱姆 · 实时演算</title>
<style>
  :root{
    --ink:#08202f;
    --ink-2:#4a6577;
    --line:rgba(8,32,47,.14);
    --bg:#eef4f8;
    --card:#ffffff;
    --blue:#0fb6f5;
    --blue-d:#0a8ec0;
    --red:#e0552f;
    --green:#2f9e3f;
    --violet:#8a5cf6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:linear-gradient(180deg,#f6fafd 0%, #e7f1f7 100%);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1560px;margin:0 auto;padding:16px 20px 20px;min-height:100vh;display:flex;flex-direction:column;}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;}
  h1{margin:0;font-size:26px;letter-spacing:.02em;font-weight:800}
  h1 em{font-style:normal;color:var(--ink-2);font-weight:600;font-size:18px;margin:0 .45em}
  .hud-actions{display:flex;gap:10px}
  button{
    font:inherit;font-size:14px;font-weight:700;color:var(--ink);
    background:#fff;border:2px solid var(--ink);border-radius:10px;
    padding:8px 16px;cursor:pointer;transition:transform .08s ease, background .15s ease;
    box-shadow:0 3px 0 rgba(8,32,47,.9);
  }
  button:hover{background:#f2f8fc}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(8,32,47,.9)}
  button.on{background:var(--ink);color:#fff}

  main{
    display:grid;
    grid-template-columns:250px minmax(0,1fr) 250px;
    gap:16px;align-items:center;flex:1;min-height:0;
  }

  /* ---------- 舞台 ---------- */
  .stage-wrap{display:flex;justify-content:center;align-items:flex-start;min-width:0}
  .stage{position:relative;background:var(--blue);border:3px solid var(--ink);border-radius:6px;overflow:hidden;width:100%}
  canvas{display:block;width:100%;height:100%}
  .verdict{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;background:rgba(6,30,46,.55);
    font-size:52px;font-weight:900;color:#fff;letter-spacing:.06em;
    text-shadow:0 4px 0 rgba(0,0,0,.25);
  }
  .verdict.show{display:flex}
  .verdict small{font-size:16px;font-weight:600;letter-spacing:.02em;opacity:.9}

  /* ---------- 侧栏 ---------- */
  .side{display:flex;flex-direction:column;gap:12px}
  .fighter{
    background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:12px;
    box-shadow:0 4px 0 rgba(8,32,47,.9);
  }
  .fighter .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .fighter .avatar{width:44px;height:44px;border:2px solid var(--ink);border-radius:10px;object-fit:cover;background:#eaf3f8}
  .fighter .fname{font-weight:800;font-size:16px;line-height:1.1}
  .fighter .fsub{font-size:11px;color:var(--ink-2);margin-top:3px}
  .hpbar{height:14px;border:2px solid var(--ink);border-radius:8px;background:#dfe9f0;overflow:hidden;position:relative}
  .hpbar i{display:block;height:100%;width:100%;background:linear-gradient(180deg,#5ee07a,#2f9e3f);transition:width .12s linear}
  .hpbar.low i{background:linear-gradient(180deg,#ff8a5c,#e0552f)}
  .hptxt{font-size:12px;color:var(--ink-2);margin-top:5px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}

  .skills{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .sk{border:2px solid var(--line);border-radius:10px;padding:8px 9px;background:#fbfdff}
  .sk.ready{border-color:rgba(47,158,63,.45);background:#f3fcf5}
  .sk.active{border-color:var(--violet);background:#f7f4ff}
  .sk-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .sk-name{font-size:12.5px;font-weight:800}
  .sk-cd{font-size:11px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .sk.ready .sk-cd{color:var(--green)}
  .sk.active .sk-cd{color:var(--violet)}
  .sk-bar{height:6px;border-radius:4px;background:#e3ecf2;margin-top:6px;overflow:hidden}
  .sk-bar i{display:block;height:100%;width:100%;background:var(--blue);transition:width .1s linear}
  .sk.ready .sk-bar i{background:var(--green)}
  .sk.active .sk-bar i{background:var(--violet)}
  .sk-note{font-size:10.5px;color:var(--ink-2);margin-top:5px;line-height:1.35}

  /* ---------- 详细模式（底部抽屉，不挤压画布） ---------- */
  .detail{
    display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;
    max-width:1560px;margin:0 auto;max-height:44vh;overflow:auto;
    background:var(--card);border:2px solid var(--ink);border-bottom:0;
    border-radius:14px 14px 0 0;box-shadow:0 -8px 28px rgba(8,32,47,.22);
  }
  .detail.show{display:block}
  /* 抽屉打开时，画布和面板改为顶部对齐，避免被抽屉压住 */
  body.detail-open main{align-items:flex-start}
  .detail h2{margin:0;padding:12px 16px;font-size:14px;background:#f2f8fc;border-bottom:2px solid var(--line);letter-spacing:.04em}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .col{padding:12px 16px}
  .col+.col{border-left:2px solid var(--line)}
  .col h3{margin:0 0 8px;font-size:13px;color:var(--blue-d);letter-spacing:.03em}
  table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  td{padding:4px 0;border-bottom:1px dashed rgba(8,32,47,.10)}
  td.k{color:var(--ink-2);width:46%}
  td.v{text-align:right;font-weight:700}
  .tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:800;border:1.5px solid currentColor}
  .t-ok{color:var(--green)} .t-cd{color:var(--ink-2)} .t-on{color:var(--violet)} .t-lock{color:var(--red)}

  @media (max-width:1180px){
    main{grid-template-columns:1fr;}
    .side{flex-direction:row;flex-wrap:wrap}
    .fighter{flex:1 1 320px}
    .cols{grid-template-columns:1fr}
    .col+.col{border-left:0;border-top:2px solid var(--line)}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>兔子 <em>vs</em> 史莱姆<span style="font-size:13px;color:#4a6577;font-weight:600;margin-left:12px">实时演算</span></h1>
    <div class="hud-actions">
      <button id="btnDetail">详细模式</button>
      <button id="btnReset">重新开局</button>
    </div>
  </header>

  <main>
    <aside class="side" id="sideA"></aside>

    <div class="stage-wrap" id="wrap">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="verdict" id="verdict"></div>
      </div>
    </div>

    <aside class="side" id="sideB"></aside>
  </main>

  <section class="detail" id="detail">
    <h2>详细数值</h2>
    <div class="cols">
      <div class="col" id="detailA"></div>
      <div class="col" id="detailB"></div>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  // ============================================================
  // 配置：所有数值集中在这里，改这一块就能调平衡
  // ============================================================
  const CFG = {
    arena: { w: 960, h: 720, border: 3 },

    rabbit: {
      name: '兔子',
      maxHp: 10000,
      atk: 3000,
      speed: [180, 320],          // 开局随机速度区间（"随机的一个力"）
      hammer: {
        period: 3.4,              // 每几秒抡一次
        dur: 1.7,                 // 抡的持续时间
        spin: 820,                // 度/秒
        orbitR: 128,              // 锤心绕身半径
        len: 178,                 // 锤子显示长度
        hitR: 62                  // 锤头判定半径
      },
      // 锤子伤害 = 70% 基础攻击 + 1% 当前生命
      dmgAtkRatio: 0.70,
      dmgHpRatio: 0.01,
      // 破釜沉舟：生命低于 20% → 锁血 + 冰岛冲击（每局一次）
      ult: {
        hpThreshold: 0.20,
        lockDur: 3.0,             // 锁血持续
        dmg: 2900,                // 冰岛冲击伤害（占位，等你给具体设定）
        stun: 1.5,
        airType: true             // 属于空中/全屏伤害，浮空也躲不掉
      }
    },

    slime: {
      name: '史莱姆',
      maxHp: 10000,               // 你没给数值，先和兔子对称
      atk: 3000,
      speed: [180, 320],
      spit: {
        period: 5.3,
        dmgRatio: 0.60,           // 每颗球伤害 = 60% 攻击力
        speed: 380,
        r: 33, miniR: 23,
        life: 14,
        split: 2,
        maxBlobs: 8
      },
      lifesteal: 0.03,            // 命中回复自身最大生命 3%
      // 技能一：站在道德制高点
      moral: {
        cd: 18, air: 5
      },
      // 技能二：历史的回眸
      history: {
        cd: 26,
        mute: 10,                 // 施放后停手时间
        lookBack: 10,             // "10 秒前" 的前一个窗口
        healRatio: 0.30,          // 回复前窗口承伤的 30%
        reflectRatio: 0.20,       // 把本窗口承伤的 20% 打回给对方
        minDamageToCast: 0.05     // 最近 10s 承伤超过 5% 血才值得放
      }
    }
  };

  const W = CFG.arena.w, H = CFG.arena.h, BORDER = CFG.arena.border;
  const DEG = Math.PI / 180;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  // ============================================================
  // 资源
  // ============================================================
  const IMG = { a: '__IMG_A__', b: '__IMG_B__', hammer: '__IMG_HAMMER__' };

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  let scale = 1;

  function resize() {
    // 先按可用宽高把舞台定成画布比例，避免拉伸
    const wrap = document.getElementById('wrap');
    const availW = wrap.clientWidth || 640;
    // 详细模式抽屉打开时，给底部留出抽屉高度，画布相应缩小
    const reserve = detailOn ? Math.min(window.innerHeight * 0.44, 430) : 0;
    const availH = Math.max(240, window.innerHeight - 120 - reserve);
    const w = Math.min(availW, availH * (W / H));
    stage.style.width = Math.floor(w) + 'px';
    stage.style.height = Math.floor(w * H / W) + 'px';

    const r = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(2, Math.round(r.width * dpr));
    cv.height = Math.max(2, Math.round(r.height * dpr));
    scale = cv.width / W;
  }
  window.addEventListener('resize', resize);

  // ============================================================
  // 实体
  // ============================================================
  function makeFighter(cfg, side, imgSrc) {
    const f = {
      cfg, side,
      img: new Image(),
      dw: 1, dh: 1, hw: 1, hh: 1, rc: 1,
      maxHp: cfg.maxHp, hp: cfg.maxHp,
      atk: cfg.atk,
      x: 0, y: 0, vx: 0, vy: 0, sp: 0,
      face: side === 'left' ? 1 : -1,
      stun: 0, flash: 0, shake: 0, squash: 0,
      dealt: 0, taken: 0, healed: 0, hits: 0,
      dmgLog: [],                 // {t, amount}
      sky: 0,                     // 浮空剩余时间
      mute: 0,                    // 停手剩余时间
      invuln: 0,                  // 锁血剩余时间
      ready: false
    };
    f.img.onload = () => {
      const iw = f.img.naturalWidth, ih = f.img.naturalHeight;
      const maxSide = (side === 'left' ? 165 : 178) * 1.12;
      const s = maxSide / Math.max(iw, ih);
      f.dw = iw * s; f.dh = ih * s;
      f.hw = f.dw / 2; f.hh = f.dh / 2;
      f.rc = (f.hw + f.hh) / 2;
      f.ready = true;
    };
    f.img.src = imgSrc;
    return f;
  }

  const rabbit = makeFighter(CFG.rabbit, 'left', IMG.a);
  const slime = makeFighter(CFG.slime, 'right', IMG.b);
  const fighters = [rabbit, slime];

  // 锤子贴图（锤头朝右）
  const hammer = { img: new Image(), dw: 1, dh: 1, ready: false };
  hammer.img.onload = () => {
    const s = CFG.rabbit.hammer.len / hammer.img.naturalWidth;
    hammer.dw = CFG.rabbit.hammer.len;
    hammer.dh = hammer.img.naturalHeight * s;
    hammer.ready = true;
  };
  hammer.img.src = IMG.hammer;

  // ============================================================
  // 状态
  // ============================================================
  let clock = 0;
  let over = null;                // null | 'rabbit' | 'slime'
  let blobs = [];
  let pending = [];               // 按模拟时间触发的延迟事件
  let gen = 0;                    // 局数代号，重开后丢弃上一局的延迟事件
  const fx = { nums: [], shock: [], sparks: [], ring: [] };

  const rState = {
    on: false, t: 0, idle: 0, ang: -Math.PI / 2, hitDone: false,
    ultUsed: false, lockT: 0, castT: 0
  };
  const sState = {
    idle: 2.0, chain: 0, chainT: 0,
    moral: { cd: 0, air: 0 },
    history: { cd: 0, mute: 0 },
    lastReflect: 0, lastHeal: 0
  };

  // ============================================================
  // 开局：随机位置 + 随机力
  // ============================================================
  function spawn(f) {
    const leftHalf = f.side === 'left';
    const xMin = leftHalf ? BORDER + f.hw + 20 : W / 2 + f.hw + 20;
    const xMax = leftHalf ? W / 2 - f.hw - 20 : W - BORDER - f.hw - 20;
    f.x = rand(xMin, Math.max(xMin + 1, xMax));
    f.y = rand(BORDER + f.hh + 30, H - BORDER - f.hh - 30);

    const [lo, hi] = f.cfg.speed;
    const sp = rand(lo, hi);
    // 朝斜向内部飞，避免一开局就贴墙
    const ang = leftHalf ? rand(-55, 55) * DEG : rand(125, 235) * DEG;
    f.vx = Math.cos(ang) * sp;
    f.vy = Math.sin(ang) * sp;
    f.sp = sp;
  }

  function reset() {
    clock = 0; over = null; blobs = [];
    gen += 1; pending = [];
    fx.nums.length = 0; fx.shock.length = 0; fx.sparks.length = 0; fx.ring.length = 0;

    for (const f of fighters) {
      f.hp = f.maxHp;
      f.stun = 0; f.flash = 0; f.shake = 0; f.squash = 0;
      f.dealt = 0; f.taken = 0; f.healed = 0; f.hits = 0;
      f.dmgLog = []; f.sky = 0; f.mute = 0; f.invuln = 0;
      spawn(f);
    }

    rState.on = false; rState.t = 0; rState.idle = 1.2;
    rState.ang = -Math.PI / 2; rState.hitDone = false;
    rState.ultUsed = false; rState.lockT = 0; rState.castT = 0;

    sState.idle = 2.0; sState.chain = 0; sState.chainT = 0;
    sState.moral.cd = 6; sState.moral.air = 0;
    sState.history.cd = 10; sState.history.mute = 0;
    sState.lastReflect = 0; sState.lastHeal = 0;

    document.getElementById('verdict').classList.remove('show');
  }

  // ============================================================
  // 伤害系统
  // ============================================================
  function heal(target, amount, color) {
    if (amount <= 0 || target.hp <= 0) return 0;
    const before = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + amount);
    const real = target.hp - before;
    target.healed += real;
    if (real >= 1) {
      addNum(target.x, target.y - target.hh - 18, '+' + Math.round(real), color || '#7bd88f', 20);
      fx.ring.push({ x: target.x, y: target.y, t: 0, dur: 0.5, r0: 5, r1: 58, color: '#7bd88f' });
    }
    return real;
  }

  /**
   * kind: 'ground' | 'air'
   * 浮空（站在道德制高点）只免疫 ground
   */
  function damage(target, amount, opt) {
    opt = opt || {};
    if (over || target.hp <= 0) return 0;
    amount = Math.max(0, amount);

    let note = null;
    if (target.invuln > 0) {
      note = '锁血';
    } else if (target.sky > 0 && opt.kind !== 'air') {
      note = '免疫';
    }

    if (note) {
      addNum(target.x, target.y - target.hh - 30, note, '#8fd8ff', 17);
      fx.ring.push({ x: target.x, y: target.y, t: 0, dur: 0.42, r0: 4, r1: 46, color: '#8fd8ff' });
      return 0;
    }

    const before = target.hp;

    // 兔子破釜沉舟：任何一下都不能把它从阈值上方直接打死，最多打到 20% 线
    if (target === rabbit && !rState.ultUsed) {
      const floor = target.maxHp * CFG.rabbit.ult.hpThreshold;
      if (target.hp > floor && target.hp - amount < floor) {
        amount = target.hp - floor;
      }
    }

    target.hp = Math.max(0, target.hp - amount);
    const real = before - target.hp;
    target.taken += real;
    target.dmgLog.push({ t: clock, amount: real });
    if (opt.source) opt.source.dealt += real;

    addNum(target.x, target.y - target.hh - 26, '-' + Math.round(real),
           opt.color || (amount >= target.maxHp * 0.15 ? '#ff4d2d' : '#ff9d6b'),
           amount >= target.maxHp * 0.15 ? 28 : 21);
    fx.sparks.push({ x: target.x, y: target.y, t: 0, dur: 0.3, color: opt.color || '#ffb27a' });
    fx.ring.push({ x: target.x, y: target.y, t: 0, dur: 0.34, r0: 3, r1: 44, color: '#ffffff' });

    target.flash = 0.2;
    target.shake = 0.3;
    target.squash = 0.24;

    if (target.hp <= 0) {
      over = target === rabbit ? 'slime' : 'rabbit';
      showVerdict(over);
    }
    return real;
  }

  function addNum(x, y, text, color, size) {
    // 夹进画面内，贴边时不至于把字切掉一半
    fx.nums.push({
      x: clamp(x, 70, W - 70),
      y: clamp(y, 30, H - 24),
      t: 0, dur: 1.0, text, color, size: size || 18
    });
  }

  // 时间窗口内承受的伤害
  function takenBetween(f, from, to) {
    let sum = 0;
    for (const d of f.dmgLog) {
      const ago = clock - d.t;
      if (ago >= from && ago < to) sum += d.amount;
    }
    return sum;
  }

  // ============================================================
  // 兔子：巨锤环绕
  // ============================================================
  function hammerHead() {
    const r = CFG.rabbit.hammer.orbitR + CFG.rabbit.hammer.len * 0.30;
    return { x: rabbit.x + Math.cos(rState.ang) * r, y: rabbit.y + Math.sin(rState.ang) * r };
  }

  function rabbitDamage() {
    return Math.round(CFG.rabbit.atk * CFG.rabbit.dmgAtkRatio + rabbit.hp * CFG.rabbit.dmgHpRatio);
  }

  function updateRabbit(dt) {
    if (rabbit.hp <= 0) return;

    // ---- 破釜沉舟：生命低于阈值 → 锁血 + 冰岛冲击 ----
    if (!rState.ultUsed && rabbit.hp <= rabbit.maxHp * CFG.rabbit.ult.hpThreshold) {
      rState.ultUsed = true;
      rState.lockT = CFG.rabbit.ult.lockDur;
      rabbit.invuln = CFG.rabbit.ult.lockDur;
      castIceImpact();
    }
    if (rState.lockT > 0) {
      rState.lockT = Math.max(0, rState.lockT - dt);
      if (rState.lockT === 0) rabbit.invuln = 0;
    }

    // ---- 巨锤 ----
    if (rState.tail > 0) rState.tail = Math.max(0, rState.tail - dt);

    if (rabbit.stun > 0) { rState.on = false; return; }

    if (!rState.on) {
      rState.idle += dt;
      if (rState.idle >= CFG.rabbit.hammer.period) {
        rState.idle = 0;
        rState.on = true;
        rState.t = 0;
        rState.hitDone = false;
        rState.ang = Math.atan2(slime.y - rabbit.y, slime.x - rabbit.x) - 0.9;

        // 太远先冲过去
        const d = Math.hypot(slime.x - rabbit.x, slime.y - rabbit.y);
        if (d > 250) {
          const nx = (slime.x - rabbit.x) / d, ny = (slime.y - rabbit.y) / d;
          const tx = clamp(slime.x - nx * 205, BORDER + rabbit.hw, W - BORDER - rabbit.hw);
          const ty = clamp(slime.y - ny * 205, BORDER + rabbit.hh, H - BORDER - rabbit.hh);
          fx.shock.push({ x0: rabbit.x, y0: rabbit.y, x1: tx, y1: ty, t: 0, dur: 0.3 });
          rabbit.x = tx; rabbit.y = ty;
        }
      }
      return;
    }

    rState.t += dt;
    rState.ang += dt * CFG.rabbit.hammer.spin * DEG;

    if (!rState.hitDone && slime.hp > 0) {
      const hd = hammerHead();
      const hit = Math.hypot(slime.x - hd.x, slime.y - hd.y) <= CFG.rabbit.hammer.hitR + slime.rc * 0.86;
      if (hit) {
        // 浮空时锤子打不到：仍然消耗这一次挥击判定，但显示免疫
        const dealt = damage(slime, rabbitDamage(), { kind: 'ground', source: rabbit, color: '#ff4d2d' });
        if (dealt > 0) rabbit.hits++;
        rState.hitDone = true;
        fx.shock.push({ x: slime.x, y: slime.y, t: 0, dur: 0.45, r0: 6, r1: 76 });
        const ddx = slime.x - rabbit.x, ddy = slime.y - rabbit.y;
        const dd = Math.hypot(ddx, ddy) || 1;
        if (slime.hp > 0 && slime.sky <= 0 && slime.stun <= 0) {
          slime.vx = ddx / dd * 260;
          slime.vy = ddy / dd * 260;
        }
      }
    }

    if (rState.t >= CFG.rabbit.hammer.dur) {
      rState.on = false;
      rState.idle = 0;
      rState.tail = 0.3;
    }
  }

  // 冰岛冲击（占位实现：全屏冰环 + 空中伤害 + 冰冻）
  function castIceImpact() {
    const dmg = CFG.rabbit.ult.dmg;
    fx.shock.push({ x: rabbit.x, y: rabbit.y, t: 0, dur: 0.9, r0: 10, r1: Math.max(W, H) });
    fx.shock.push({ x: rabbit.x, y: rabbit.y, t: 0.12, dur: 0.75, r0: 4, r1: Math.max(W, H) * 0.7 });
    for (let i = 0; i < 18; i++) {
      const a = Math.PI * 2 * (i / 18);
      fx.sparks.push({
        x: rabbit.x + Math.cos(a) * 20, y: rabbit.y + Math.sin(a) * 20,
        t: 0.05, dur: 0.6, color: i % 2 ? '#e6faff' : '#8fd8ff'
      });
    }
    addNum(rabbit.x, rabbit.y - rabbit.hh - 56, '冰岛冲击', '#bfefff', 26);
    damage(slime, dmg, { kind: 'air', source: rabbit, color: '#8fd8ff' });
    if (slime.hp > 0) slime.stun = Math.max(slime.stun, CFG.rabbit.ult.stun);
  }

  // ============================================================
  // 史莱姆：喷球 + 两个技能
  // ============================================================
  function blobAt(x, y, r, gen) {
    return {
      x, y, vx: 0, vy: 0, sp: 0, r,
      dw: r * 2, dh: r * 2, hw: r, hh: r, rc: r,
      gen, life: CFG.slime.spit.life, age: 0, wob: Math.random() * 6.28
    };
  }

  function spit() {
    const mx = slime.x + (slime.face || 1) * slime.hw * 0.52;
    const my = slime.y + slime.hh * 0.12;

    let prey = null;
    for (const b of blobs) if (b.gen === 0) { prey = b; break; }

    let ang, sp;
    if (prey) {
      ang = Math.atan2(prey.y - my, prey.x - mx) + (Math.random() - 0.5) * 0.05;
      sp = CFG.slime.spit.speed * 1.16;
    } else {
      let px = rabbit.x, py = rabbit.y;
      for (let k = 0; k < 2; k++) {
        const tt = Math.hypot(px - mx, py - my) / CFG.slime.spit.speed;
        px = rabbit.x + rabbit.vx * tt * 0.85;
        py = rabbit.y + rabbit.vy * tt * 0.85;
      }
      px = clamp(px, BORDER + 20, W - BORDER - 20);
      py = clamp(py, BORDER + 20, H - BORDER - 20);
      ang = Math.atan2(py - my, px - mx) + (Math.random() - 0.5) * 0.12;
      sp = CFG.slime.spit.speed;
    }

    const b = blobAt(mx + Math.cos(ang) * 14, my + Math.sin(ang) * 14, CFG.slime.spit.r, 0);
    b.sp = sp; b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
    blobs.push(b);
    while (blobs.length > CFG.slime.spit.maxBlobs) blobs.shift();

    fx.ring.push({ x: mx, y: my, t: 0, dur: 0.3, r0: 4, r1: 30, color: '#8ef07a' });
  }

  function splitBlob(b) {
    const i = blobs.indexOf(b);
    if (i < 0) return;
    blobs.splice(i, 1);

    const base = Math.atan2(b.vy, b.vx);
    for (let k = 0; k < CFG.slime.spit.split; k++) {
      const a = base + (k % 2 === 0 ? 1 : -1) * (0.66 + Math.random() * 0.34);
      const c = blobAt(b.x, b.y, CFG.slime.spit.miniR, 1);
      c.sp = b.sp * 1.04; c.vx = Math.cos(a) * c.sp; c.vy = Math.sin(a) * c.sp;
      c.life = CFG.slime.spit.life * 0.72;
      blobs.push(c);
    }
    fx.ring.push({ x: b.x, y: b.y, t: 0, dur: 0.42, r0: 4, r1: 54, color: '#b6ff8a' });
    addNum(b.x, b.y - b.hh - 14, '分裂 x' + CFG.slime.spit.split, '#2f9e3f', 16);
  }

  function updateBlobs(dt) {
    for (let i = blobs.length - 1; i >= 0; i--) {
      const b = blobs[i];
      if (!b) continue;
      b.age += dt;
      b.life -= dt;
      if (b.life <= 0) { blobs.splice(i, 1); continue; }

      if (rabbit.hp > 0 && Math.hypot(rabbit.x - b.x, rabbit.y - b.y) <= b.r + rabbit.rc * 0.90) {
        const dmg = Math.round(CFG.slime.atk * CFG.slime.spit.dmgRatio);
        const dealt = damage(rabbit, dmg, { kind: 'ground', source: slime, color: '#2f9e3f' });
        if (dealt > 0) {
          slime.hits++;
          const healAmt = Math.round(slime.maxHp * CFG.slime.lifesteal);
          heal(slime, healAmt, '#2f9e3f');
        }
        blobs.splice(i, 1);
        continue;
      }

      if (b.gen === 0) {
        let by = null;
        for (const o of blobs) {
          if (o === b || o.gen !== 0 || o.age >= b.age) continue;
          if (Math.hypot(o.x - b.x, o.y - b.y) <= o.r + b.r + 2) { by = o; break; }
        }
        if (by) { splitBlob(b); continue; }
      }
    }
  }

  function updateSlime(dt) {
    if (slime.hp <= 0) return;

    for (const k of ['moral', 'history']) {
      if (sState[k].cd > 0) sState[k].cd = Math.max(0, sState[k].cd - dt);
    }

    // ---- 站在道德制高点 ----
    if (sState.moral.air > 0) {
      sState.moral.air = Math.max(0, sState.moral.air - dt);
      slime.sky = sState.moral.air;
    } else if (sState.moral.cd <= 0) {
      sState.moral.cd = CFG.slime.moral.cd;
      sState.moral.air = CFG.slime.moral.air;
      slime.sky = CFG.slime.moral.air;
      addNum(slime.x, slime.y - slime.hh - 44, '站在道德制高点', '#8a5cf6', 22);
      fx.ring.push({ x: slime.x, y: slime.y, t: 0, dur: 0.6, r0: 8, r1: 90, color: '#8a5cf6' });
    }

    // ---- 历史的回眸 ----
    if (sState.history.mute > 0) {
      sState.history.mute = Math.max(0, sState.history.mute - dt);
      slime.mute = sState.history.mute;
    }
    if (sState.history.cd <= 0 && sState.history.mute <= 0) {
      const recent = takenBetween(slime, 0, CFG.slime.history.lookBack);
      if (recent >= slime.maxHp * CFG.slime.history.minDamageToCast) {
        castHistory();
      }
    }

    // ---- 喷球 ----
    if (slime.stun > 0 || slime.mute > 0) return;

    if (sState.chain > 0) {
      sState.chainT -= dt;
      if (sState.chainT <= 0) {
        sState.chain -= 1;
        sState.chainT = 0.34;
        spit();
      }
      return;
    }

    sState.idle += dt;
    if (sState.idle >= CFG.slime.spit.period) {
      sState.idle = 0;
      spit();
      sState.chain = 1;
      sState.chainT = 0.34;
    }
  }

  function castHistory() {
    const cfg = CFG.slime.history;

    // "10 秒前受到的伤害" → 上一个 10 秒窗口的承伤
    const prev = takenBetween(slime, cfg.lookBack, cfg.lookBack * 2);
    const now = takenBetween(slime, 0, cfg.lookBack);

    const healAmt = Math.round(prev * cfg.healRatio);
    const reflect = Math.round(now * cfg.reflectRatio);

    sState.history.cd = cfg.cd;
    sState.history.mute = cfg.mute;
    slime.mute = cfg.mute;
    sState.lastHeal = healAmt;
    sState.lastReflect = reflect;

    addNum(slime.x, slime.y - slime.hh - 44, '历史的回眸', '#8a5cf6', 22);
    fx.ring.push({ x: slime.x, y: slime.y, t: 0, dur: 0.7, r0: 10, r1: 104, color: '#8a5cf6' });

    if (healAmt > 0) heal(slime, healAmt, '#7bd88f');
    else addNum(slime.x + 30, slime.y - slime.hh - 8, '无旧伤', '#8a8a8a', 15);

    if (reflect > 0) {
      // 延迟一拍打回去，看得清
      fx.nums.push({ x: slime.x, y: slime.y - slime.hh - 70, t: 0, dur: 1.2, text: '回溯 ' + reflect, color: '#8a5cf6', size: 19 });
      const myGen = gen;
      pending.push({
        at: clock + 0.42, gen: myGen,
        fn: () => { if (!over && myGen === gen) damage(rabbit, reflect, { kind: 'air', source: slime, color: '#8a5cf6' }); }
      });
    }
  }

  // ============================================================
  // 物理
  // ============================================================
  function keepSpeed(f, want) {
    const s = Math.hypot(f.vx, f.vy) || 1;
    const k = (want || f.sp) / s;
    f.vx *= k; f.vy *= k;
  }

  function bounce(f) {
    let hit = false;
    if (f.x - f.hw < BORDER) { f.x = BORDER + f.hw; f.vx = Math.abs(f.vx); hit = true; }
    else if (f.x + f.hw > W - BORDER) { f.x = W - BORDER - f.hw; f.vx = -Math.abs(f.vx); hit = true; }
    if (f.y - f.hh < BORDER) { f.y = BORDER + f.hh; f.vy = Math.abs(f.vy); hit = true; }
    else if (f.y + f.hh > H - BORDER) { f.y = H - BORDER - f.hh; f.vy = -Math.abs(f.vy); hit = true; }
    if (hit) keepSpeed(f, f.sp);
  }

  function collide(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    const min = a.rc + b.rc;
    if (!dist || dist >= min) return;
    const nx = dx / dist, ny = dy / dist;
    const ov = (min - dist) / 2;
    a.x -= nx * ov; a.y -= ny * ov;
    b.x += nx * ov; b.y += ny * ov;
    const va = a.vx * nx + a.vy * ny, vb = b.vx * nx + b.vy * ny;
    if (va - vb <= 0) return;
    const s = va - vb;
    a.vx -= s * nx; a.vy -= s * ny;
    b.vx += s * nx; b.vy += s * ny;
    keepSpeed(a, a.sp); keepSpeed(b, b.sp);
  }

  function step(dt) {
    const sub = 4, h = dt / sub;
    for (let s = 0; s < sub; s++) {
      for (const f of fighters) {
        if (f.stun > 0) continue;
        f.x += f.vx * h;
        f.y += f.vy * h;
      }
      for (const b of blobs) { b.x += b.vx * h; b.y += b.vy * h; }

      for (const f of fighters) bounce(f);
      for (const b of blobs) bounce(b);

      collide(rabbit, slime);
      for (let i = 0; i < blobs.length; i++) {
        for (let j = i + 1; j < blobs.length; j++) collide(blobs[i], blobs[j]);
      }
    }
  }

  // ============================================================
  // 主更新
  // ============================================================
  function update(dt) {
    if (over) return;
    clock += dt;

    step(dt);

    for (const f of fighters) {
      if (f.stun > 0) {
        f.stun -= dt;
        if (f.stun <= 0) {
          f.stun = 0;
          const a = Math.random() * Math.PI * 2;
          f.vx = Math.cos(a) * f.sp;
          f.vy = Math.sin(a) * f.sp;
        }
      }
      if (f.flash > 0) f.flash = Math.max(0, f.flash - dt);
      if (f.shake > 0) f.shake = Math.max(0, f.shake - dt);
      if (f.squash > 0) f.squash = Math.max(0, f.squash - dt);
      if (Math.abs(f.vx) > 20 && f.stun <= 0) f.face = f.vx > 0 ? 1 : -1;

      // 日志裁剪
      while (f.dmgLog.length && clock - f.dmgLog[0].t > 30) f.dmgLog.shift();
    }

    updateRabbit(dt);
    updateSlime(dt);
    updateBlobs(dt);

    for (let i = pending.length - 1; i >= 0; i--) {
      const ev = pending[i];
      if (ev.gen !== gen) { pending.splice(i, 1); continue; }
      if (clock >= ev.at) { pending.splice(i, 1); ev.fn(); }
    }

    for (const k in fx) {
      const arr = fx[k];
      for (let i = arr.length - 1; i >= 0; i--) {
        arr[i].t += dt;
        if (arr[i].t >= arr[i].dur) arr.splice(i, 1);
      }
    }
  }

  // ============================================================
  // 渲染
  // ============================================================
  function drawBg() {
    ctx.fillStyle = '#0fb6f5';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 网格，让位移看得出来
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y <= H; y += 60) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawChar(f) {
    if (!f.ready) return;
    const dying = f.hp <= 0;
    const sk = f.shake > 0 ? f.shake / 0.3 : 0;
    const ox = sk ? Math.sin(clock * 86) * 4.4 * sk : 0;
    const oy = sk ? Math.cos(clock * 71) * 2.6 * sk : 0;
    const sq = f.squash > 0 ? f.squash / 0.24 : 0;
    const floatY = f.sky > 0 ? -52 - Math.sin(clock * 2.4) * 5 : 0;

    ctx.save();
    if (dying) ctx.globalAlpha = 0.35;
    ctx.translate(f.x + ox, f.y + oy + floatY);

    // 浮空影子留在地面
    if (f.sky > 0) {
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#0a2a3f';
      ctx.beginPath();
      ctx.ellipse(f.x, f.y + f.hh * 0.86, f.hw * 0.7, f.hw * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(f.x + ox, f.y + oy + floatY);
    }

    if (sq > 0) ctx.scale(1 + 0.10 * sq, 1 - 0.10 * sq);
    if (f.side === 'right') ctx.scale(-1, 1);
    ctx.drawImage(f.img, -f.hw, -f.hh, f.dw, f.dh);
    ctx.restore();

    // 浮空光环
    if (f.sky > 0) {
      ctx.save();
      ctx.globalAlpha = 0.8;
      ctx.strokeStyle = '#8a5cf6';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 9]);
      ctx.lineDashOffset = -clock * 40;
      ctx.beginPath();
      ctx.arc(f.x, f.y + floatY, f.hw * 1.18, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 锁血护盾
    if (f.invuln > 0) {
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.25 * Math.sin(clock * 12);
      ctx.strokeStyle = '#bfefff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(f.x, f.y, Math.max(f.hw, f.hh) * 1.25, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawHammer() {
    if (!hammer.ready || rabbit.hp <= 0) return;
    if (!rState.on) return;

    const cx = clamp(rabbit.x, 70, W - 70);
    const cy = clamp(rabbit.y, 70, H - 70);
    const R = CFG.rabbit.hammer.orbitR;

    ctx.save();
    ctx.globalAlpha = 0.26;
    ctx.strokeStyle = '#ffe08a';
    ctx.lineWidth = 2;
    ctx.setLineDash([9, 11]);
    ctx.lineDashOffset = -clock * 70;
    ctx.beginPath();
    ctx.arc(cx, cy, R + CFG.rabbit.hammer.len * 0.30, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    for (let i = 3; i >= 0; i--) {
      const a = rState.ang - i * 0.15;
      ctx.save();
      ctx.globalAlpha = i === 0 ? 1 : Math.max(0, 0.3 - i * 0.075);
      ctx.translate(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
      ctx.rotate(a);
      ctx.drawImage(hammer.img, -hammer.dw / 2, -hammer.dh / 2, hammer.dw, hammer.dh);
      ctx.restore();
    }
  }

  function drawBlobs() {
    for (const b of blobs) {
      let alpha = 1;
      if (b.life < 1.2) alpha = Math.max(0, b.life / 1.2);
      const wob = 1 + 0.09 * Math.sin(b.wob + clock * 9);
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const stretch = Math.min(1.20, 1 + sp / 2800);
      const ang = Math.atan2(b.vy, b.vx);
      const r = b.r;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.scale(stretch, wob / stretch);
      const g = ctx.createRadialGradient(-r * 0.3, -r * 0.34, r * 0.12, 0, 0, r * 1.06);
      g.addColorStop(0, b.gen ? '#d8ffbc' : '#affa90');
      g.addColorStop(0.55, b.gen ? '#84e65e' : '#5fd94a');
      g.addColorStop(1, '#2f8f2a');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = Math.max(2, r * 0.15);
      ctx.strokeStyle = '#123d18'; ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = alpha;
      const ex = r * 0.34, ey = r * 0.16;
      ctx.fillStyle = '#123d18';
      ctx.beginPath();
      ctx.ellipse(b.x - ex, b.y - ey, r * 0.11, r * 0.16, 0, 0, Math.PI * 2);
      ctx.ellipse(b.x + ex, b.y - ey, r * 0.11, r * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#123d18';
      ctx.lineWidth = Math.max(1.4, r * 0.09);
      ctx.beginPath();
      ctx.arc(b.x, b.y + r * 0.16, r * 0.3, 0.18 * Math.PI, 0.82 * Math.PI);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawFx() {
    for (const s of fx.shock) {
      const p = s.t / s.dur;
      ctx.save();
      ctx.globalAlpha = (1 - p) * 0.75;
      ctx.strokeStyle = '#ffe08a';
      ctx.lineWidth = 2.5 * (1 - p) + 0.6;
      ctx.beginPath();
      ctx.arc(s.x0, s.y0, 60 * (1 - p), 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s.x0, s.y0);
      ctx.lineTo(s.x1, s.y1);
      ctx.stroke();
      ctx.restore();
    }
    for (const r of fx.ring) {
      const p = r.t / r.dur;
      const rad = r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - p, 2));
      ctx.save();
      ctx.globalAlpha = (1 - p) * 0.8;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 2.2 * (1 - p) + 0.6;
      ctx.beginPath();
      ctx.arc(r.x, r.y, rad, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    for (const s of fx.sparks) {
      const p = s.t / s.dur;
      ctx.save();
      ctx.globalAlpha = 1 - p;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 1.4;
      ctx.lineCap = 'round';
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2 + 0.4;
        const r0 = 4 + p * 14;
        const r1 = r0 + 5 * (1 - p);
        ctx.beginPath();
        ctx.moveTo(s.x + Math.cos(a) * r0, s.y + Math.sin(a) * r0);
        ctx.lineTo(s.x + Math.cos(a) * r1, s.y + Math.sin(a) * r1);
        ctx.stroke();
      }
      ctx.restore();
    }
    for (const n of fx.nums) {
      const p = n.t / n.dur;
      ctx.save();
      ctx.globalAlpha = p < 0.1 ? p / 0.1 : (p > 0.72 ? Math.max(0, 1 - (p - 0.72) / 0.28) : 1);
      ctx.font = '800 ' + n.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const y = n.y - p * 26;
      ctx.lineWidth = Math.max(2.6, n.size * 0.16);
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(8,32,47,.55)';
      ctx.strokeText(n.text, n.x, y);
      ctx.fillStyle = n.color;
      ctx.fillText(n.text, n.x, y);
      ctx.restore();
    }
  }

  function drawHp(f) {
    const w = 120, h = 12;
    const x = clamp(f.x - w / 2, 4, W - w - 4);
    // 血条跟着浮空一起抬起来；头顶放不下时翻到脚下，避免被画框切掉
    const floatY = f.sky > 0 ? -52 - Math.sin(clock * 2.4) * 5 : 0;
    let y = f.y + floatY - f.hh - (f.sky > 0 ? 26 : 44);
    if (y < 6) y = f.y + floatY + f.hh + 10;
    if (y > H - h - 6) y = f.y - f.hh - 44;
    const ratio = clamp(f.hp / f.maxHp, 0, 1);

    ctx.save();
    ctx.fillStyle = 'rgba(8,32,47,.55)';
    ctx.beginPath();
    ctx.roundRect(x - 2, y - 2, w + 4, h + 4, 5);
    ctx.fill();
    ctx.fillStyle = '#dfe9f0';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = ratio <= 0.2 ? '#e0552f' : '#2f9e3f';
    ctx.fillRect(x, y, w * ratio, h);
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 11px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(8,32,47,.75)';
    ctx.lineWidth = 2.4;
    ctx.strokeText(Math.round(f.hp) + ' / ' + f.maxHp, x + w / 2, y + h / 2);
    ctx.fillText(Math.round(f.hp) + ' / ' + f.maxHp, x + w / 2, y + h / 2);
    ctx.restore();
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawBg();
    drawBlobs();
    for (const f of fighters) drawChar(f);
    drawHammer();
    drawFx();
    for (const f of fighters) drawHp(f);
  }

  // ============================================================
  // UI
  // ============================================================
  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }

  function skillCard(id, name, note) {
    return '<div class="sk" id="' + id + '">'
      + '<div class="sk-head"><span class="sk-name">' + name + '</span><span class="sk-cd">—</span></div>'
      + '<div class="sk-bar"><i></i></div>'
      + '<div class="sk-note">' + note + '</div></div>';
  }

  function buildPanels() {
    document.getElementById('sideA').innerHTML =
      '<div class="fighter">'
      + '<div class="top"><img class="avatar" src="' + IMG.a + '">'
      + '<div><div class="fname">兔子</div><div class="fsub">生命 10,000 · 攻击 3,000</div></div></div>'
      + '<div class="hpbar" id="hpA"><i></i></div>'
      + '<div class="hptxt"><span id="hpTxtA">10000 / 10000</span><span id="dpsA">—</span></div>'
      + '<div class="skills">'
      + skillCard('skHammer', '巨锤环绕', '3.4s 一次 · 70%攻击 + 1%当前生命')
      + skillCard('skUlt', '冰岛冲击', '生命低于 20% 自动锁血释放')
      + '</div></div>';

    document.getElementById('sideB').innerHTML =
      '<div class="fighter">'
      + '<div class="top"><img class="avatar" src="' + IMG.b + '">'
      + '<div><div class="fname">史莱姆</div><div class="fsub">生命 10,000 · 攻击 3,000</div></div></div>'
      + '<div class="hpbar" id="hpB"><i></i></div>'
      + '<div class="hptxt"><span id="hpTxtB">10000 / 10000</span><span id="dpsB">—</span></div>'
      + '<div class="skills">'
      + skillCard('skMoral', '站在道德制高点', '浮空 5s · 免疫地面伤害')
      + skillCard('skHistory', '历史的回眸', '回血 + 反弹 + 停手 10s')
      + '</div></div>';
  }

  function setSkill(id, mode, cdTxt, pct) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('ready', mode === 'ready');
    el.classList.toggle('active', mode === 'active');
    el.querySelector('.sk-cd').textContent = cdTxt;
    el.querySelector('.sk-bar i').style.width = Math.round(clamp(pct, 0, 1) * 100) + '%';
  }

  let uiTick = 0;
  function updateUI(dt) {
    uiTick += dt;
    if (uiTick < 0.08) return;
    uiTick = 0;

    // 血条
    for (const [f, suf] of [[rabbit, 'A'], [slime, 'B']]) {
      const bar = document.getElementById('hp' + suf);
      const ratio = clamp(f.hp / f.maxHp, 0, 1);
      bar.querySelector('i').style.width = (ratio * 100).toFixed(1) + '%';
      bar.classList.toggle('low', ratio <= 0.2);
      document.getElementById('hpTxt' + suf).textContent = fmt(f.hp) + ' / ' + fmt(f.maxHp);
      const dps = clock > 0.5 ? f.dealt / clock : 0;
      document.getElementById('dps' + suf).textContent = 'DPS ' + fmt(dps);
    }

    // 兔子：巨锤
    const h = CFG.rabbit.hammer;
    if (rState.on) {
      setSkill('skHammer', 'active', '挥击 ' + (h.dur - rState.t).toFixed(1) + 's', 1 - rState.t / h.dur);
    } else {
      const left = Math.max(0, h.period - rState.idle);
      setSkill('skHammer', left <= 0.05 ? 'ready' : '', left <= 0.05 ? '就绪' : left.toFixed(1) + 's', 1 - left / h.period);
    }

    // 兔子：冰岛冲击
    if (rState.ultUsed) {
      const locking = rState.lockT > 0;
      setSkill('skUlt', locking ? 'active' : '', locking ? '锁血 ' + rState.lockT.toFixed(1) + 's' : '已释放', locking ? rState.lockT / CFG.rabbit.ult.lockDur : 0);
    } else {
      const hpPct = rabbit.hp / rabbit.maxHp;
      const need = clamp((hpPct - CFG.rabbit.ult.hpThreshold) / (1 - CFG.rabbit.ult.hpThreshold), 0, 1);
      setSkill('skUlt', 'ready', '待触发 ' + Math.round(hpPct * 100) + '%', need);
    }

    // 史莱姆：道德制高点
    const m = sState.moral;
    if (m.air > 0) {
      setSkill('skMoral', 'active', '浮空 ' + m.air.toFixed(1) + 's', m.air / CFG.slime.moral.air);
    } else if (m.cd > 0) {
      setSkill('skMoral', '', m.cd.toFixed(1) + 's', 1 - m.cd / CFG.slime.moral.cd);
    } else {
      setSkill('skMoral', 'ready', '就绪', 1);
    }

    // 史莱姆：历史的回眸
    const hist = sState.history;
    if (hist.mute > 0) {
      setSkill('skHistory', 'active', '停手 ' + hist.mute.toFixed(1) + 's', 1 - hist.mute / CFG.slime.history.mute);
    } else if (hist.cd > 0) {
      setSkill('skHistory', '', hist.cd.toFixed(1) + 's', 1 - hist.cd / CFG.slime.history.cd);
    } else {
      setSkill('skHistory', 'ready', '就绪', 1);
    }

    if (detailOn) updateDetail();
  }

  // ---------- 详细模式 ----------
  let detailOn = false;

  function row(k, v) { return '<tr><td class="k">' + k + '</td><td class="v">' + v + '</td></tr>'; }

  function statusTag(f) {
    if (f.hp <= 0) return '<span class="tag t-lock">已倒下</span>';
    if (f.invuln > 0) return '<span class="tag t-lock">锁血 ' + f.invuln.toFixed(1) + 's</span>';
    if (f.sky > 0) return '<span class="tag t-on">浮空 ' + f.sky.toFixed(1) + 's</span>';
    if (f.mute > 0) return '<span class="tag t-on">停手 ' + f.mute.toFixed(1) + 's</span>';
    if (f.stun > 0) return '<span class="tag t-cd">眩晕 ' + f.stun.toFixed(1) + 's</span>';
    return '<span class="tag t-ok">正常</span>';
  }

  function updateDetail() {
    const ra = rabbit, sl = slime;

    document.getElementById('detailA').innerHTML =
      '<h3>兔子 · 详细</h3><table>'
      + row('生命', fmt(ra.hp) + ' / ' + fmt(ra.maxHp) + '（' + (ra.hp / ra.maxHp * 100).toFixed(1) + '%）')
      + row('基础攻击', fmt(ra.atk))
      + row('锤击伤害', fmt(rabbitDamage()) + ' <span style="color:#4a6577;font-weight:500">= 70%×' + fmt(ra.atk) + ' + 1%×' + fmt(ra.hp) + '</span>')
      + row('状态', statusTag(ra))
      + row('累计输出', fmt(ra.dealt))
      + row('累计承伤', fmt(ra.taken))
      + row('命中次数', ra.hits)
      + row('平均速度', Math.round(ra.sp) + ' px/s')
      + row('当前坐标', Math.round(ra.x) + ', ' + Math.round(ra.y))
      + row('巨锤周期', CFG.rabbit.hammer.period + 's（挥击 ' + CFG.rabbit.hammer.dur + 's）')
      + row('冰岛冲击', raStateText())
      + row('最近 10s 承伤', fmt(takenBetween(ra, 0, 10)))
      + '</table>';

    document.getElementById('detailB').innerHTML =
      '<h3>史莱姆 · 详细</h3><table>'
      + row('生命', fmt(sl.hp) + ' / ' + fmt(sl.maxHp) + '（' + (sl.hp / sl.maxHp * 100).toFixed(1) + '%）')
      + row('基础攻击', fmt(sl.atk))
      + row('单球伤害', fmt(sl.atk * CFG.slime.spit.dmgRatio) + ' <span style="color:#4a6577;font-weight:500">= 60%×攻击</span>')
      + row('状态', statusTag(sl))
      + row('累计输出', fmt(sl.dealt))
      + row('累计承伤', fmt(sl.taken))
      + row('吸血回复', fmt(sl.healed) + ' <span style="color:#4a6577;font-weight:500">每次命中 3%(' + fmt(sl.maxHp * CFG.slime.lifesteal) + ')</span>')
      + row('命中次数', sl.hits)
      + row('场上球数', blobs.length)
      + row('平均速度', Math.round(sl.sp) + ' px/s')
      + row('当前坐标', Math.round(sl.x) + ', ' + Math.round(sl.y))
      + row('道德制高点', sState.moral.air > 0 ? '浮空中 ' + sState.moral.air.toFixed(1) + 's' : (sState.moral.cd > 0 ? '冷却 ' + sState.moral.cd.toFixed(1) + 's' : '就绪'))
      + row('历史的回眸', sState.history.mute > 0 ? '停手中 ' + sState.history.mute.toFixed(1) + 's' : (sState.history.cd > 0 ? '冷却 ' + sState.history.cd.toFixed(1) + 's' : '就绪'))
      + row('上次回溯', sState.lastReflect ? fmt(sState.lastReflect) + ' 伤害 / 回血 ' + fmt(sState.lastHeal) : '—')
      + row('最近 10s 承伤', fmt(takenBetween(sl, 0, 10)))
      + row('前 10s 承伤', fmt(takenBetween(sl, 10, 20)))
      + '</table>';
  }

  function raStateText() {
    if (!rState.ultUsed) return '待触发（<' + Math.round(CFG.rabbit.ult.hpThreshold * 100) + '% 生命）';
    if (rState.lockT > 0) return '锁血中 ' + rState.lockT.toFixed(1) + 's';
    return '已释放';
  }

  // ---------- 结算 ----------
  function showVerdict(winnerKey) {
    const el = document.getElementById('verdict');
    const win = winnerKey === 'rabbit' ? '兔子' : '史莱姆';
    el.innerHTML = '<div>' + win + ' 获胜</div><small>' + clock.toFixed(1) + ' 秒 · 点「重新开局」再来一局</small>';
    el.classList.add('show');
  }

  // ============================================================
  // 主循环
  // ============================================================
  let last = performance.now();
  let acc = 0;
  const STEP = 1 / 60;

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard < 6) { update(STEP); acc -= STEP; guard++; }
    if (guard >= 6) acc = 0;

    render();
    updateUI(dt);
    requestAnimationFrame(loop);
  }

  // ============================================================
  // 交互
  // ============================================================
  document.getElementById('btnReset').addEventListener('click', () => {
    reset();
    last = performance.now();
    acc = 0;
  });

  document.getElementById('btnDetail').addEventListener('click', (e) => {
    detailOn = !detailOn;
    e.currentTarget.classList.toggle('on', detailOn);
    document.getElementById('detail').classList.toggle('show', detailOn);
    document.body.classList.toggle('detail-open', detailOn);
    if (detailOn) updateDetail();
    resize();
  });

  // 调试用：快进 N 秒（正常使用不需要）
  window.__sim = {
    advance(sec) { for (let i = 0; i < sec * 60; i++) update(STEP); render(); updateUI(1); },
    state() {
      return {
        clock, over,
        hp: [rabbit.hp, slime.hp],
        dealt: [rabbit.dealt, slime.dealt],
        torn: [rabbit.taken, slime.taken],
        blobs: blobs.length,
        moral: sState.moral, history: sState.history, ult: rState.ultUsed,
        hammerReady: hammer.ready, hammerOn: rState.on, ang: +rState.ang.toFixed(2), pos: [Math.round(rabbit.x), Math.round(rabbit.y)]
      };
    }
  };

  buildPanels();
  reset();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>兔子 vs 史莱姆 vs 摇摆鸭 · 实时演算 v3.1.1</title>
<!--
  ============================================================================
  兔子 vs 史莱姆 vs 摇摆鸭 · 实时演算 v3.1.1
  ----------------------------------------------------------------------------
  单文件，双击即可运行；所有图片以 base64 内联。

  【怎么改数值】
  打开本文件，搜索 "const CFG"（在 <script> 开头的第 ① 区），
  所有可调参数都在那个对象里，每项后面都有中文注释。改完保存、刷新页面即可，
  不需要重新构建。（如果你有 live.template.html，改完要跑 python _build_live.py 重新内联图片。）

  常用参数索引（都在 CFG 里）：
    arena.w / arena.h           战场尺寸（默认 1080 × 740）
    rabbit.maxHp / rabbit.atk   兔子基础生命 / 攻击力（10000 / 3000）
    rabbit.dmgAtkRatio          锤击 = 该值 × 基础攻击（0.70 → 2100 ≈ 21% 生命）
                                ※ 全部伤害都是「基础攻击 × 百分比」，只有 atk 是数值
    rabbit.hammer.period        几秒抡一次（3.4）
    rabbit.ult.hpThreshold      低于多少血触发大招（0.20）
    rabbit.ult.lockDur          锁血时长（2 秒）
    rabbit.ult.freeze           冰冻时长（3 秒）
    rabbit.ult.iceDur           冰岛背景持续（3.4 秒）
    rabbit.ult.uses             全局可释放次数（3）
    rabbit.ult.dmgAtkRatio      大招总伤害 = 该值 × 基础攻击（1.00 → 3000 ≈ 30% 生命）
    rabbit.ult.ticks / tickGap  持续伤害段数 / 间隔（6 段 × 500，每 0.5s 跳一次）
    rabbit.ult.healRatio        释放瞬间回血 = 该值 × 此前累计造成的伤害（0.30）
    slime.maxHp / slime.atk     史莱姆基础生命 / 攻击力（12700 / 3000，比兔子高 27% 用来吃 3 次大招）
    slime.spit.period           几秒喷一组（3.0）
    slime.spit.dmgAtkRatio      单球伤害 = 该值 × 基础攻击（0.62 → 1860 ≈ 18.6% 生命）
    slime.spit.speed            球速（430），越大越准
    slime.lifestealRatio        命中吸血 = 向上取整(实际伤害 × 该值)（0.10 → 约 255/次）
    slime.moral.cd / air        道德制高点 冷却 / 浮空时长（30 / 5）
    slime.moral.counterChance   大招对轴成功概率（0.45）
    slime.moral.holdMax         技能就绪后最多留多久（20 秒）
    slime.history.cd / mute     历史的回眸 冷却 / 停手（15 / 5）
    slime.history.healRatio     回血 = 上一个 10s 窗口承伤的 35%
    slime.history.reflectRatio  反弹 = 最近 10s 窗口承伤的 20%
    slime.history.needRatio     最近 10s 承伤超过多少才值得放（0.12）

  【v3.1 摇摆鸭 · 中立单位】
    duck.size                   立绘长边（140）
    duck.speed                  基础游走速度（320）
    duck.alpha                  未入阵营时的半透明度（0.72）
    duck.chase                  追向双方中点的力度（0.95）
    duck.hitCooldown            同一角色的连续撞击计数间隔（0.34s，防止一帧算十次）
    duck.hitsPerRound           第一轮需要的撞击数（20）
    duck.hitsPerStep            之后每结算一次，所需撞击数 +2（20 → 22 → 24…）
    duck.buff.hpMax / atkMax    两条增益滑块的上限（0.40 / 0.30 = 最多 +40% / +30%）
    duck.buff.hpDefault         弹窗滑块初始值（0.18 = +18% 生命）
    duck.buff.atkDefault        弹窗滑块初始值（0.14 = +14% 攻击）
    duck.buff.autoConfirm       true = 不弹窗，直接按默认值结算（脚本批量跑用）

  规则：摇摆鸭一开场就在场中央，半透明、可被撞动、可被锤子和史莱姆的球打到。
        撞击数一直累加；第一轮满 20 次、之后每轮 22 / 24 / 26… 次时结算，
        **结算那一击的撞击者的对手**获得增益（并清空上一次增益），直到分出胜负。

  【语音播报】
  用浏览器自带 TTS（speechSynthesis），播报技能释放、对轴、K.O. 和 MVP。
  页面上的「语音播报」按钮可以随时开关；浏览器没有中文语音包时不会出声。

  【调试】
  控制台 __sim.advance(秒) 快进，__sim.state() 看状态。
  控制台 __CFG.slime.spit.period = 3 可实时改参数；点「重新开局」后新数值生效。
  ============================================================================
-->
<style>
  :root{
    --ink:#0a2a3f;
    --ink-soft:#2f5670;
    --sky:#11b4f3;
    --page1:#e8f6ff;
    --page2:#c6e7fa;
    --blood:#ff2f28;
    --gold:#ffcf5c;
    --violet:#8a5cf6;
    --ice:#8fd8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -8%, #ffffff 0%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg, var(--page1) 0%, var(--page2) 100%);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .app{
    max-width:1760px;margin:0 auto;padding:16px 26px 86px;
    min-height:100vh;display:flex;flex-direction:column;gap:10px;
  }

  /* 标题：黑体，居中压在战场正上方 */
  .title{
    margin:0 auto;text-align:center;line-height:1.04;
    font-family:"Heiti SC","SimHei",STHeiti,"Microsoft YaHei",ui-sans-serif,sans-serif;
    font-size:clamp(34px,4vw,58px);font-weight:900;letter-spacing:.08em;
    padding:2px 0 6px;
  }
  .title span{
    /* 白色硬描边，浅底/照片底都能压住 */
    text-shadow:
      3px 3px 0 #fff, -3px 3px 0 #fff, 3px -3px 0 #fff, -3px -3px 0 #fff,
      0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff,
      0 7px 14px rgba(10,42,63,.28);
  }
  .title .t-a{color:#e2452a}
  .title .t-b{color:#1c9448}
  .title em{
    font-style:normal;font-size:.46em;font-weight:900;color:#5b7d92;
    margin:0 .34em;letter-spacing:0;vertical-align:.16em;
  }

  /* 用 flex 让左右 HUD 紧贴画框，而不是被网格撑到大屏两端 */
  .board{
    display:flex;justify-content:center;align-items:center;
    gap:20px;flex:1;min-height:0;
  }
  .hud{width:270px;flex:none}
  .stage-wrap{display:flex;justify-content:center;align-items:center;min-width:0;flex:1 1 auto}
  .stage{
    position:relative;background:var(--sky);border:7px solid var(--ink);
    box-shadow:0 10px 0 rgba(10,42,63,.16), 0 18px 40px rgba(10,42,63,.20);
    overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%}

  /* 侧栏高度 = 作战区高度（--stage-h 由 JS 写入） */
  .hud{
    width:270px;flex:none;display:flex;flex-direction:column;
    height:var(--stage-h,720px);
  }
  .card{
    background:#eaf6fd;border:3px solid var(--ink);border-radius:12px;
    box-shadow:0 4px 0 var(--ink);
    height:100%;display:flex;flex-direction:column;overflow:hidden;
  }
  .card-top{display:flex;align-items:center;gap:8px;padding:8px 10px 6px}
  .avatar{
    width:38px;height:38px;border:2px solid var(--ink);border-radius:9px;
    object-fit:cover;background:#cfe9f7;flex:none;
  }
  .who{font-size:18px;font-weight:900;line-height:1.1}
  .who small{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-top:4px}
  .buff-line{padding:2px 12px 5px;height:19px;font-size:11px;font-weight:900;color:#b8770a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;visibility:hidden}
  .buff-line.on{visibility:visible}

  .bar{height:17px;margin:0 12px;border:2px solid var(--ink);border-radius:7px;background:#fff;overflow:hidden;position:relative}
  .bar i{display:block;height:100%;width:100%;background:linear-gradient(180deg,#ff6a5a,var(--blood));transition:width .12s linear}
  .bar b{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:900;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.55);
    letter-spacing:.02em;
  }
  .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);padding:5px 14px 0;font-variant-numeric:tabular-nums}

    /* 收起详情时：技能格子平分剩余高度，把侧栏撑满 */
  .skills{padding:10px;display:flex;flex-direction:column;gap:10px;flex:1}
  .sk{
    flex:1 1 0;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    border:2px solid rgba(10,42,63,.16);border-radius:11px;padding:14px 12px;background:#f7fcff;
    transition:border-color .12s ease, background .12s ease;
  }
  /* 展开详情时：技能卡缩成一行一条，详情占满剩余高度 */
  .card.detail-on .skills{flex:0 0 auto;padding:8px;gap:6px}
  .card.detail-on .sk{
    flex:0 0 auto;flex-direction:row;gap:7px;padding:5px 7px;border-radius:8px;align-items:center;
  }
  .card.detail-on .sk-main{text-align:left}
  .card.detail-on .sk-line{justify-content:space-between}
  .card.detail-on .sk-ico{width:32px;height:32px;flex:none}
  .card.detail-on .sk-name{font-size:12px}
  .card.detail-on .sk-line{font-size:10.5px;margin-top:1px}
  .card.detail-on .sk-bar{height:4px;margin-top:3px}
  .card.detail-on .sk-sub{display:none}
  .card.detail-on .detail{display:flex;flex-direction:column;justify-content:space-between;flex:1 1 auto;min-height:0;max-height:none}
  .sk.ready{border-color:rgba(34,160,74,.5);background:#f3fdf6}
  .sk.active{border-color:var(--violet);background:#f8f4ff}
  .sk.lock{border-color:var(--blood);background:#fff4f3}
  .sk-ico{width:76px;height:76px;display:block;flex:none}
  .sk-ico svg{width:100%;height:100%;display:block}
  .sk-main{min-width:0;width:100%;text-align:center}
  .sk-name{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sk-sub{font-size:12px;font-weight:600;color:var(--ink-soft);line-height:1.45;margin-top:6px;padding:0 2px}
  .sk-line{display:flex;justify-content:center;gap:14px;font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:8px;font-variant-numeric:tabular-nums}
  .sk.ready .sk-line b{color:#1c8b45}
  .sk.active .sk-line b{color:var(--violet)}
  .sk.lock .sk-line b{color:var(--blood)}
  .sk-bar{height:10px;border-radius:5px;background:#dce9f1;margin-top:8px;overflow:hidden}
  .sk-bar i{display:block;height:100%;width:100%;background:var(--sky);transition:width .1s linear}
  .sk.ready .sk-bar i{background:#35b45f}
  .sk.active .sk-bar i{background:var(--violet)}
  .sk.lock .sk-bar i{background:var(--blood)}

  /* 卡片内的详细数值 */
  .detail{
    display:none;padding:8px 9px 10px;overflow:auto;flex:0 1 auto;
    border-top:2px dashed rgba(10,42,63,.14);
  }
  /* 展开后：行距自动拉开，把整栏铺满 */
  .detail.show{display:flex;flex-direction:column;justify-content:space-between}
  .detail h3{margin:2px 0 6px;font-size:12px;color:var(--ink-soft);letter-spacing:.06em}
  .detail .row{grid-template-columns:78px 1fr auto;gap:6px;font-size:12px;padding:4px 0}
  .detail .row .k{font-size:12px}
  .detail .row .bar2{height:9px;min-width:44px}
  .detail .row .v{font-size:12px;font-weight:800}
  .detail .tag{font-size:11px;padding:1px 7px}

  /* 控制坞：左下 / 右下角固定 */
  .dock{
    position:fixed;bottom:18px;z-index:70;display:flex;gap:10px;align-items:center;
    padding:8px 10px;border-radius:14px;
    background:rgba(234,246,253,.86);border:3px solid var(--ink);
    box-shadow:0 5px 0 rgba(10,42,63,.85);
    backdrop-filter:blur(6px);
  }
  .dock.left{left:20px}
  .dock.right{right:20px}
  .dock button{padding:6px 13px;font-size:14px;box-shadow:0 3px 0 var(--ink)}
  .dock button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  body.ice-mode .dock{background:rgba(10,32,48,.8);border-color:#0a2a3f}
  body.ice-mode .dock button{background:#eaf6fd}
  body.ice-mode .dock button.on{background:#0a2a3f;color:#fff}
  button{
    font:inherit;font-size:15px;font-weight:900;color:var(--ink);
    background:#fff;border:3px solid var(--ink);border-radius:11px;
    padding:7px 16px;cursor:pointer;box-shadow:0 4px 0 var(--ink);
    transition:transform .07s ease, background .15s ease;
  }
  button:hover{background:#f0f9ff}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  button.on{background:var(--ink);color:#fff}

  .drawer{
    display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;
    max-width:1760px;margin:0 auto;max-height:46vh;overflow:auto;
    background:#eaf6fd;border:3px solid var(--ink);border-bottom:0;
    border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(10,42,63,.25);
  }
  .drawer.show{display:block}
  body.drawer-open .board{align-items:flex-start}
  .drawer h2{
    margin:0;padding:11px 16px;font-size:15px;letter-spacing:.08em;
    background:var(--ink);color:#fff;position:sticky;top:0;z-index:2;
  }
  .cols{display:grid;grid-template-columns:1fr 1fr}
  .col{padding:10px 14px 14px}
  .col+.col{border-left:2px dashed rgba(10,42,63,.18)}
  .col h3{margin:0 0 10px;font-size:16px;color:var(--ink)}
  .row{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:5px 0}
  .row .k{color:var(--ink-soft);font-weight:700}
  .row .bar2{height:11px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;min-width:70px}
  .row .bar2 i{display:block;height:100%;background:linear-gradient(180deg,#ff6a5a,var(--blood));transition:width .12s linear}
  .row .v{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
  .tag{display:inline-block;padding:2px 9px;border-radius:7px;font-size:12.5px;font-weight:900;border:2px solid currentColor}
  .t-ok{color:#1c8b45} .t-cd{color:var(--ink-soft)} .t-on{color:var(--violet)} .t-lock{color:var(--blood)}

  .params{display:none;position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:1760px;margin:0 auto;
    max-height:58vh;overflow:auto;background:#0a2a3f;color:#d7ecf7;border-radius:14px 14px 0 0;
    box-shadow:0 -10px 30px rgba(10,42,63,.35);font-size:11.5px}
  .params.show{display:block}
  .params h2{margin:0;padding:9px 14px;font-size:12.5px;letter-spacing:.08em;background:#08202f;color:#9ad7f5;
    position:sticky;top:0}
  .params pre{margin:0;padding:12px 16px 20px;line-height:1.7;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap}
  .params .c{color:#6f9ab0}
  .params .n{color:#ffd166}

  /* 全屏冰岛背景（冰岛冲击时铺满整页） */
  .ice-bg{
    position:fixed;inset:0;z-index:-2;pointer-events:none;
    background-size:cover;background-position:center;
    opacity:0;transition:opacity .5s ease;
  }
  .ice-bg.on{opacity:1}
  .ice-bg::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(6,24,38,.72), rgba(6,24,38,.55));
  }
  body.ice-mode{
    background:#08202f;
    transition:background .5s ease;
  }
  body.ice-mode .title span{
    color:#fff;
    text-shadow:
      3px 3px 0 rgba(6,30,46,.85), -3px 3px 0 rgba(6,30,46,.85),
      3px -3px 0 rgba(6,30,46,.85), -3px -3px 0 rgba(6,30,46,.85),
      0 0 28px rgba(143,216,255,.75);
  }
  body.ice-mode .title em{color:#bfe6ff}

  .sound-hint{
    position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    background:rgba(10,42,63,.8);color:#fff;font-size:11.5px;font-weight:700;
    padding:6px 14px;border-radius:20px;pointer-events:none;transition:opacity .4s ease;
  }
  .sound-hint.hide{opacity:0}

  .banner{
    position:absolute;left:50%;top:24%;transform:translateX(-50%);
    pointer-events:none;white-space:nowrap;
    max-width:92%;overflow:hidden;text-overflow:ellipsis;
    padding:4px 18px 6px;border-radius:12px;
    background:rgba(6,30,46,.62);border:2px solid rgba(143,216,255,.5);
    box-shadow:0 4px 0 rgba(4,18,28,.55);
    font-size:clamp(15px,1.9vw,23px);font-weight:900;color:#fff;letter-spacing:.04em;
    text-shadow:0 2px 0 rgba(10,42,63,.8), 0 0 20px rgba(143,216,255,.75);
    opacity:0;transition:opacity .18s ease;
  }
  .banner.show{opacity:1}
  /* ---------- 结算：K.O. + MVP ---------- */
  .overlay{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    z-index:9;background:radial-gradient(circle at 50% 45%, rgba(6,30,46,.62), rgba(4,18,28,.92));
    backdrop-filter:blur(1px);cursor:pointer;
  }
  .overlay.show{display:flex}
  .ko{
    font-size:clamp(76px,12vw,170px);font-weight:900;letter-spacing:.06em;color:#fff;line-height:1;
    /* 用多层阴影做硬描边：-webkit-text-stroke 会盖住字芯，HTML 文字不能用 */
    text-shadow:
      4px 4px 0 var(--ink), -4px 4px 0 var(--ink),
      4px -4px 0 var(--ink), -4px -4px 0 var(--ink),
      0 4px 0 var(--ink), 0 -4px 0 var(--ink),
      4px 0 0 var(--ink), -4px 0 0 var(--ink),
      0 14px 0 rgba(10,42,63,.7),
      0 0 48px rgba(143,216,255,.9),
      0 0 96px rgba(255,90,60,.65);
    opacity:0;transform:scale(2.6) rotate(-6deg);display:none;
  }
  .ko.show{display:block;animation:koSlam .5s cubic-bezier(.16,.9,.28,1) forwards}
  @keyframes koSlam{
    0%{opacity:0;transform:scale(2.6) rotate(-6deg);filter:blur(8px)}
    60%{opacity:1;transform:scale(.94) rotate(1deg);filter:blur(0)}
    100%{opacity:1;transform:scale(1) rotate(0)}
  }
  .mvp{
    display:none;width:min(780px,92%);background:#eaf6fd;border:5px solid var(--ink);border-radius:20px;
    box-shadow:0 10px 0 var(--ink);padding:20px 22px 22px;text-align:left;
  }
  .mvp.show{display:block;animation:mvpIn .34s ease both}
  @keyframes mvpIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  .mvp-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .mvp-ava{width:96px;height:96px;border:3px solid var(--ink);border-radius:14px;object-fit:cover;background:#cfe9f7}
  .mvp-name{font-size:36px;font-weight:900;line-height:1.1}
  .mvp-badge{
    display:inline-block;background:var(--gold);border:3px solid var(--ink);border-radius:10px;
    padding:2px 13px;font-size:17px;font-weight:900;margin-left:10px;vertical-align:middle;
    box-shadow:0 3px 0 var(--ink);
  }
  .mvp-sub{font-size:15px;color:var(--ink-soft);font-weight:700;margin-top:4px}
  .mvp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
  .mvp-row{display:flex;justify-content:space-between;align-items:baseline;font-size:16.5px;font-weight:700;
    border-bottom:1px dashed rgba(10,42,63,.16);padding:6px 0}
  .mvp-row span{color:var(--ink-soft)}
  .mvp-row b{font-variant-numeric:tabular-nums;font-size:17.5px}
  .mvp-actions{margin-top:18px;text-align:center}
  .mvp-hint{margin-top:10px;text-align:center;font-size:12.5px;color:var(--ink-soft);font-weight:700}

  /* ---------- v3.0 摇摆鸭：状态条 / 版本角标 ---------- */
  .duck-chip{
    position:absolute;left:50%;top:9px;z-index:8;
    transform:translate(-50%,0);
    display:flex;align-items:center;gap:9px;padding:6px 14px 6px 8px;
    background:rgba(255,255,255,.94);border:2.5px solid var(--ink);border-radius:14px;
    box-shadow:0 3px 0 rgba(10,42,63,.75);
    max-width:min(430px,88%);
    transition:transform .46s cubic-bezier(.16,1,.3,1),
               background-color .34s ease, border-color .34s ease, box-shadow .34s ease;
  }
  /* 加入阵营：整块贴着那一侧滑过去，主题色跟着换 */
  .duck-chip.theme-l{
    border-color:#ff5a3c;background:rgba(255,247,245,.96);
    box-shadow:0 3px 0 rgba(10,42,63,.75), 0 0 16px rgba(255,90,60,.35);
  }
  .duck-chip.theme-r{
    border-color:#2f9e3f;background:rgba(246,255,247,.96);
    box-shadow:0 3px 0 rgba(10,42,63,.75), 0 0 16px rgba(47,158,63,.35);
  }
  .duck-chip.theme-l .dt b{color:#e0381c}
  .duck-chip.theme-r .dt b{color:#1f7d36}
  .duck-chip.theme-l .dp i{background:linear-gradient(90deg,#ffb3a2,#ff5a3c)}
  .duck-chip.theme-r .dp i{background:linear-gradient(90deg,#a8e6a8,#2f9e3f)}

  /* 加入阵营后：鸭子头像出现在那一侧的卡片上 */
  .card-top .duck-badge{
    display:none;width:30px;height:30px;flex:none;margin-left:auto;border-radius:50%;
    overflow:hidden;background:#fff;border:2px solid #ffd166;
    box-shadow:0 0 0 2px rgba(255,209,102,.28);
  }
  .card-top .duck-badge.on{display:block;animation:duckPulse 1.8s ease-in-out infinite}
  .card-top .duck-badge img{width:100%;height:100%;object-fit:cover;display:block}
  @keyframes duckPulse{
    0%,100%{box-shadow:0 0 0 2px rgba(255,209,102,.28)}
    50%{box-shadow:0 0 0 4px rgba(255,209,102,.12),0 0 12px rgba(255,209,102,.85)}
  }
  .duck-chip img{width:32px;height:32px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 0 rgba(10,42,63,.25))}
  .duck-chip .dt{min-width:0;flex:1}
  .duck-chip .dt b{display:block;font-size:13px;font-weight:900;line-height:1.1;letter-spacing:.02em}
  .duck-chip .dt span{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .duck-chip .dp{width:52px;height:8px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;flex:none}
  .duck-chip .dp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff9d2e);transition:width .12s linear}
  .duck-chip.joined{background:rgba(255,251,235,.95)}
  .duck-chip .dt b em{font-style:normal;font-weight:900}

  .ver-chip{
    position:absolute;right:10px;bottom:9px;z-index:8;
    font-size:11px;font-weight:900;letter-spacing:.06em;color:#fff;
    background:rgba(10,42,63,.78);border-radius:20px;padding:3px 10px;
    pointer-events:none;
  }
  body.ice-mode .ver-chip{background:rgba(6,30,46,.9)}

  /* ---------- 增益弹窗：1:1 复刻 B 站登录框（v3.1） ---------- */
  .bili-mask{
    position:fixed;inset:0;z-index:200;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",ui-sans-serif,sans-serif;
    color:#18191c;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .24s ease-out, visibility 0s linear .24s;
  }
  .bili-mask.show{
    opacity:1;visibility:visible;pointer-events:auto;
    transition:opacity .24s ease-out, visibility 0s;
  }
  .bili-mask.closing{opacity:0;pointer-events:none;transition:opacity .18s ease-in}

  .bili-scaler{transform:scale(var(--bs,1));transform-origin:center center;will-change:transform}
  .bili-card{
    position:relative;width:1010px;height:600px;flex:none;
    background:#fff;border-radius:8px;overflow:hidden;
    box-shadow:0 12px 48px rgba(0,0,0,.3);
  }
  /* 卡片：0.92 缩放 + 下坠 26px 弹入（cubic-bezier(.16,1,.3,1) 有轻微过冲） */
  .bili-mask.show .bili-card{animation:biliEnter .34s cubic-bezier(.16,1,.3,1) both}
  .bili-mask.closing .bili-card{animation:biliOut .18s ease-in both}
  @keyframes biliEnter{
    0%{opacity:0;transform:scale(.92) translateY(26px)}
    70%{opacity:1;transform:scale(1.006) translateY(-2px)}
    100%{opacity:1;transform:scale(1) translateY(0)}
  }
  @keyframes biliOut{
    from{opacity:1;transform:scale(1) translateY(0)}
    to{opacity:0;transform:scale(.97) translateY(10px)}
  }
  /* 内容错层：每个区块晚 40~50ms 上来 */
  .bili-mask.show .bili-left,
  .bili-mask.show .bili-tabs,
  .bili-mask.show .bili-pane.on,
  .bili-mask.show .bili-social,
  .bili-mask.show .bili-legal,
  .bili-mask.show .bili-close,
  .bili-mask.show .bili-designer{animation:biliUp .42s cubic-bezier(.16,1,.3,1) both}
  .bili-mask.show .bili-left{animation-delay:.05s}
  .bili-mask.show .bili-tabs{animation-delay:.10s}
  .bili-mask.show .bili-pane.on{animation-delay:.15s}
  .bili-mask.show .bili-social{animation-delay:.20s}
  .bili-mask.show .bili-legal{animation-delay:.24s}
  @keyframes biliUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .bili-mask *{box-sizing:border-box}

  .bili-deco{position:absolute;bottom:-22px;pointer-events:none;user-select:none;opacity:.92}
  .bili-deco-l{left:-14px;width:108px}
  .bili-deco-r{right:-10px;width:96px}
  .bili-deco-r.slime{width:128px;right:-16px;bottom:-14px}

  .bili-close{
    position:absolute;right:14px;top:12px;z-index:5;width:36px;height:36px;padding:0;
    border:0;background:transparent;color:#18191c;font-size:23px;font-weight:300;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px;
    box-shadow:none;
  }
  .bili-close:hover{background:#f4f5f7;color:#00aeec}
  .bili-close:active{transform:none;box-shadow:none}
  .bili-designer{
    position:absolute;right:56px;top:17px;z-index:5;height:26px;padding:0 10px;
    border:1px solid #e3e5e7;border-radius:4px;background:#fff;color:#9499a0;
    font-family:inherit;font-size:12px;font-weight:400;box-shadow:none;cursor:pointer;
  }
  .bili-designer:hover{color:#00aeec;border-color:#8fd4f6;background:#f7fcff}
  .bili-designer:active{transform:none;box-shadow:none}

  /* 左栏：二维码 */
  .bili-left{
    position:absolute;left:0;top:0;width:399px;height:460px;
    display:flex;flex-direction:column;align-items:center;
  }
  .bili-qr-t{margin-top:58px;font-size:19px;font-weight:500;letter-spacing:.6px;color:#18191c}
  .bili-qr{
    margin-top:26px;width:213px;height:213px;padding:9px;
    border:1px solid #e3e5e7;border-radius:4px;background:#fff;
  }
  .bili-qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
  .bili-qr-tip{margin-top:45px;font-size:14px;line-height:26px;text-align:center;color:#9499a0}
  .bili-qr-tip b{color:#00aeec;font-weight:400}

  .bili-vline{position:absolute;left:399px;top:92px;width:1px;height:330px;background:#e3e5e7}

  /* 右栏：增益配置 */
  .bili-right{
    position:absolute;left:400px;right:0;top:0;height:460px;
    padding:55px 55px 0 58px;display:flex;flex-direction:column;
  }
  .bili-tabs{display:flex;align-items:center;height:32px;font-size:20px;font-weight:500;color:#9499a0}
  .bili-tabs .tab{cursor:pointer;transition:color .15s}
  .bili-tabs .tab:hover{color:#00aeec}
  .bili-tabs .tab.on{color:#00aeec}
  .bili-tabs i{width:1px;height:15px;background:#e3e5e7;margin:0 22px;display:block}

  .bili-pane{display:none;margin-top:28px}
  .bili-pane.on{display:block}

  .bili-box{border:1px solid #e3e5e7;border-radius:8px;overflow:hidden;background:#fff}
  .bili-row{display:flex;align-items:center;height:70px;padding:0 20px;background:#fff;margin:0}
  .bili-row + .bili-row{border-top:1px solid #e3e5e7}
  .bili-row .lb{flex:none;width:78px;font-size:16px;font-weight:400;color:#18191c}
  .bili-row .ctl{flex:1;display:flex;align-items:center;gap:14px;min-width:0}
  .bili-row .fv{
    flex:none;width:62px;text-align:right;font-size:17px;font-weight:600;
    color:#00aeec;font-variant-numeric:tabular-nums;
  }
  .bili-range{
    -webkit-appearance:none;appearance:none;flex:1;height:20px;margin:0;padding:0;
    background:transparent;border:0;box-shadow:none;cursor:pointer;display:block;
  }
  .bili-range::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;
    background:linear-gradient(90deg,#00aeec var(--p,0%),#e3e5e7 var(--p,0%));
  }
  .bili-range::-moz-range-track{
    height:4px;border-radius:2px;
    background:linear-gradient(90deg,#00aeec var(--p,0%),#e3e5e7 var(--p,0%));
  }
  .bili-range::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:14px;height:14px;margin-top:-5px;
    border-radius:50%;background:#fff;border:2px solid #00aeec;
    box-shadow:0 1px 4px rgba(0,174,236,.35);transition:transform .1s;
  }
  .bili-range:hover::-webkit-slider-thumb{transform:scale(1.14)}
  .bili-range::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #00aeec;
    box-shadow:0 1px 4px rgba(0,174,236,.35);
  }

  .bili-actions{display:flex;gap:14px;margin-top:12px}
  .bili-btn{
    flex:1;height:48px;border-radius:8px;font-family:inherit;font-size:16px;font-weight:400;
    border:1px solid #e3e5e7;background:#fff;color:#18191c;cursor:pointer;box-shadow:none;
    transition:background .15s,border-color .15s;
  }
  .bili-btn:hover{background:#f6f7f8}
  .bili-btn:active{transform:none;box-shadow:none}
  .bili-btn.primary{background:#00aeec;border-color:#00aeec;color:#fff}
  .bili-btn.primary:hover{background:#22baf0;border-color:#22baf0}

  /* 增益对象（对应「其他方式登录」） */
  .bili-social{margin-top:auto;text-align:center;padding-bottom:2px}
  .bili-social .ot{font-size:13px;color:#9499a0;margin-bottom:14px}
  .bili-social .socials{display:flex;justify-content:center;gap:56px}
  .bili-social .so{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bili-social .so i{
    width:40px;height:40px;border-radius:50%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  #soRabbit i{background:#ff5a3c}
  #soDuck i{background:#ffb62e}
  #soSlime i{background:#2f9e3f}
  .bili-social .so img{
    width:62%;height:62%;object-fit:contain;display:block;
    filter:brightness(0) invert(1);
  }
  .bili-social .so span{font-size:13px;color:#9499a0;transition:color .15s}
  .bili-social .so.hot i{box-shadow:0 0 0 2px #ffd166,0 0 12px rgba(255,209,102,.75)}
  .bili-social .so.hot span{color:#18191c;font-weight:600}

  /* 底部条款（对应「未注册过哔哩哔哩的手机号…」） */
  .bili-legal{
    position:absolute;left:0;right:0;bottom:44px;text-align:center;
    font-size:13px;line-height:25px;color:#9499a0;
  }
  .bili-legal b{color:#00aeec;font-weight:400}

  /* 第二页：增益对象详情 */
  .bili-box.tight .bili-row{height:60px}
  .bili-box.tight .lb{width:120px;color:#9499a0;font-size:15px}
  .bili-row .val{
    flex:1;text-align:right;font-size:15px;color:#18191c;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .bili-row .val b{color:#00aeec;font-weight:600}

  /* ---------- 策划面板 ---------- */
  .designer{
    position:fixed;z-index:210;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(560px,92vw);max-height:90vh;overflow:auto;display:none;
    background:#fff;border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.3), 0 0 0 100vmax rgba(0,0,0,.35);
    font-family:"PingFang SC","Microsoft YaHei",ui-sans-serif,sans-serif;color:#18191c;
  }
  .designer.show{display:block}
  .designer h3{margin:0;padding:15px 20px;font-size:16px;font-weight:700;border-bottom:1px solid #f1f2f3;
    display:flex;align-items:center;justify-content:space-between}
  .designer h3 span{font-size:11.5px;font-weight:600;color:#9499a0}
  .designer .dbody{padding:8px 20px 4px}
  .drow{display:grid;grid-template-columns:1fr 96px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px dashed #f0f2f4}
  .drow .dk{font-size:13px;color:#61666d;font-weight:600}
  .drow .dk small{display:block;font-size:10.5px;color:#c0c4cc;font-weight:400;margin-top:2px;font-family:ui-monospace,Consolas,monospace}
  .drow input[type=number]{
    width:100%;height:32px;padding:0 9px;font:inherit;font-size:13px;font-weight:700;text-align:right;
    border:1px solid #e3e5e7;border-radius:5px;color:#18191c;background:#fafbfc;
  }
  .drow input[type=number]:focus{outline:none;border-color:#00aeec;background:#fff}
  .designer .dactions{display:flex;gap:10px;padding:14px 20px 18px;position:sticky;bottom:0;background:#fff}
  .designer .dbtn{flex:1;height:38px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;
    border:1px solid #e3e5e7;background:#fff;color:#18191c;box-shadow:none}
  .designer .dbtn.primary{background:#00aeec;border-color:#00aeec;color:#fff}
  .designer .dbtn:active{transform:none;box-shadow:none}

  @media (max-width:860px){
    .bili-body{flex-direction:column;padding:40px 0 20px}
    .bili-left,.bili-right{width:100%;padding:0 22px}
    .bili-divider{display:none}
    .bili-left{margin-bottom:18px}
    .bili-qr{width:150px;height:150px}
    .bili-card{max-height:92vh;overflow:auto}
  }

  @media (max-width:1120px){
    .board{flex-direction:column;align-items:stretch}
    /* 窄屏不再锁定侧栏高度，技能格子改成并排两列 */
    .hud{width:auto;height:auto;flex-direction:row;gap:10px}
    .card{flex:1 1 300px;height:auto}
    .skills{flex-direction:row}
    .sk{flex:1 1 0;min-height:132px}
    .detail.show{justify-content:flex-start;gap:2px}
    .cols{grid-template-columns:1fr}
    .col+.col{border-left:0;border-top:2px dashed rgba(10,42,63,.18)}
  }
</style>
</head>
<body>
<div class="ice-bg" id="iceBg"></div>
<div class="app">
  <h1 class="title"><span class="t-a">兔子</span><em>vs</em><span class="t-b">史莱姆</span></h1>

  <div class="board">
    <aside class="hud" id="hudA"></aside>

    <div class="stage-wrap" id="wrap">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="duck-chip" id="duckChip">
          <img id="duckChipImg" alt="摇摆鸭">
          <div class="dt"><b id="duckName">摇摆鸭 · 中立</b><span id="duckState">撞击 0 / 20</span></div>
          <div class="dp"><i id="duckProg"></i></div>
        </div>
        <div class="ver-chip">v3.1.1</div>
        <div class="banner" id="banner"></div>
        <div class="overlay" id="overlay">
          <div class="ko" id="koText">K.O.</div>
          <div class="mvp" id="mvpCard"></div>
        </div>
        <div class="sound-hint" id="soundHint">点击画面开启音效</div>
      </div>
    </div>

    <aside class="hud" id="hudB"></aside>
  </div>

  <div class="dock left">
    <button id="btnDetail">详细数值</button>
  </div>

  <div class="dock right">
    <button id="btnSfx">音效：开</button>
    <button id="btnVoice" class="on">语音：关</button>
    <button id="btnReset">重新开局</button>
  </div>
</div>

<!-- ==========================================================================
     v3.1 摇摆鸭 · 增益结算弹窗（1:1 复刻 B 站登录框，只换元素）
     ========================================================================== -->
<div class="bili-mask" id="biliMask">
  <div class="bili-scaler">
  <div class="bili-card">
    <img class="bili-deco bili-deco-l" id="decoL" alt="">
    <img class="bili-deco bili-deco-r" id="decoR" alt="">
    <button class="bili-designer" id="btnDesigner">策划面板</button>
    <button class="bili-close" id="biliClose" title="关闭并继续">✕</button>

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const wrap = document.getElementById('wrap');
  let scale = 1;

  const img = {};
  for (const k in IMG_SRC) {
    img[k] = new Image();
    img[k].src = IMG_SRC[k];
  }

  function resize() {
    const availW = wrap.clientWidth || 640;
    const availH = Math.max(240, window.innerHeight - 150);
    const w = Math.min(availW, availH * (W / H));
    const h = Math.floor(w * H / W);
    stage.style.width = Math.floor(w) + 'px';
    stage.style.height = h + 'px';
    // 侧栏高度跟作战区对齐
    document.documentElement.style.setProperty('--stage-h', h + 'px');

    const r = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(2, Math.round(r.width * dpr));
    cv.height = Math.max(2, Math.round(r.height * dpr));
    scale = cv.width / W;
  }

  // ==========================================================================
  //  ③  音效（WebAudio 现场合成，无外部文件）
  // ==========================================================================
  const SFX = { ctx: null, out: null, muted: false };

  function audioInit() {
    if (SFX.ctx) { if (SFX.ctx.state === 'suspended') SFX.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    SFX.ctx = new AC();
    SFX.out = SFX.ctx.createGain();
    SFX.out.gain.value = SFX.muted ? 0 : 0.55;
    const comp = SFX.ctx.createDynamicsCompressor();
    SFX.out.connect(comp).connect(SFX.ctx.destination);
  }

  function noise(dur) {
    const sr = SFX.ctx.sampleRate, len = Math.ceil(sr * dur);
    const b = SFX.ctx.createBuffer(1, len, sr);
    const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  function tone(type, f0, f1, t0, dur, vol) {
    const c = SFX.ctx;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + Math.min(0.02, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0004, t0 + dur);
    o.connect(g).connect(SFX.out);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function burst(t0, dur, type, f0, f1, q, vol) {
    const c = SFX.ctx;
    const s = c.createBufferSource(); s.buffer = noise(dur);
    const bp = c.createBiquadFilter(); bp.type = type; bp.Q.value = q || 1;
    bp.frequency.setValueAtTime(f0, t0);
    if (f1) bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
    s.connect(bp).connect(g).connect(SFX.out);
    s.start(t0); s.stop(t0 + dur + 0.02);
  }

  function makeFighter(cfg, side, key) {
    const f = {
      cfg, side, key,
      maxHp: cfg.maxHp, hp: cfg.maxHp, atk: cfg.atk,
      dw: 1, dh: 1, hw: 1, hh: 1, rc: 1,
      x: 0, y: 0, vx: 0, vy: 0, sp: 0, face: side === 'left' ? 1 : -1,
      stun: 0, flash: 0, shake: 0, squash: 0, frozen: 0,
      dealt: 0, taken: 0, healed: 0, hits: 0,
      dmgLog: [], sky: 0, invuln: 0,
      buffHp: 0, buffAtk: 0          // v3.0：摇摆鸭增益（额外最大生命 / 攻击加成）
    };
    const im = img[key];
    const fit = () => {
      const iw = im.naturalWidth, ih = im.naturalHeight;
      if (!iw) return;
      const maxSide = (side === 'left' ? 198 : 214) * 1.10;
      const s = maxSide / Math.max(iw, ih);
      f.dw = iw * s; f.dh = ih * s;
      f.hw = f.dw / 2; f.hh = f.dh / 2;
      f.rc = (f.hw + f.hh) / 2;
    };
    if (im.complete && im.naturalWidth) fit(); else im.addEventListener('load', fit);
    return f;
  }

  function spawn(f) {

    const ang = left ? rand(-55, 55) * DEG : rand(125, 235) * DEG;
    f.vx = Math.cos(ang) * sp;
    f.vy = Math.sin(ang) * sp;
    f.sp = sp;

  // ==========================================================================
  //  ⑥  伤害 / 治疗
  // ==========================================================================
  function addNum(x, y, text, color, size) {
    fx.nums.push({
      x: clamp(x, 60, W - 60), y: clamp(y, 34, H - 30),
      t: 0, dur: CFG.feel.numLife, text, color, size: size || 20
    });
  }

  function heal(target, amount, color) {
    if (amount <= 0 || target.hp <= 0) return 0;
    const before = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + amount);
    const real = target.hp - before;
    target.healed += real;
    if (real >= 1) {
      addNum(target.x, target.y - target.hh - 30, '+' + Math.round(real), color || '#7bd88f', 20);
      fx.rings.push({ x: target.x, y: target.y, t: 0, dur: 0.5, r0: 6, r1: 62, color: '#7bd88f', w: 3 });
    }
    return real;
  }

  function damage(target, amount, opt) {
    opt = opt || {};
    if (over || target.hp <= 0) return 0;
    amount = Math.max(0, Math.round(amount));

    if (target.invuln > 0 || target.sky > 0) {
      const locked = target.invuln > 0;
      addNum(target.x, target.y - target.hh - 34, locked ? '锁血' : '免疫',
        locked ? '#ff9a8a' : '#b98bff', 17);
      fx.rings.push({
        x: target.x, y: target.y, t: 0, dur: 0.42, r0: 4, r1: 52,
        color: locked ? '#ff9a8a' : '#b98bff', w: 3
      });
      return 0;
    }

    // 兔子大招：还有次数时，任何伤害都停在 20% 线上（等本帧 castIce 触发）
    if (target === rabbit && R.ultLeft > 0) {
      const floor = target.maxHp * CFG.rabbit.ult.hpThreshold;
      // 已经压在线上了就完全免伤，否则同一帧的第二下会直接打穿这条线
      amount = target.hp > floor ? Math.min(amount, target.hp - floor) : 0;
    }

    const before = target.hp;
    target.hp = Math.max(0, target.hp - amount);
    const real = before - target.hp;
    target.taken += real;
    target.dmgLog.push({ t: clock, amount: real });
    if (opt.source) opt.source.dealt += real;

    const big = real >= target.maxHp * 0.15;
    addNum(target.x, target.y - target.hh - 30, '-' + Math.round(real),
      opt.color || (big ? '#ff3b12' : '#ff9d6b'), big ? 28 : 21);
    fx.sparks.push({ x: target.x, y: target.y, t: 0, dur: 0.3, color: opt.color || '#ffb27a' });
    fx.rings.push({ x: target.x, y: target.y, t: 0, dur: 0.32, r0: 4, r1: 48, color: '#ffffff', w: 2.4 });

    target.flash = 0.2; target.shake = 0.3; target.squash = 0.24;
    sfxHit(big);

    if (target.hp <= 0) {
      over = target === rabbit ? 'slime' : 'rabbit';
      overT = 0; mvpOn = false;
      closeBili(true);
      sfxKO();
      shake(3.2);
      showKO();
      say((target === rabbit ? '兔子' : '史莱姆') + '被击倒，K O！', true);
    }
    return real;
  }

  function takenBetween(f, from, to) {
    let s = 0;
    for (const d of f.dmgLog) {
      const ago = clock - d.t;
      if (ago >= from && ago < to) s += d.amount;
    }
    return s;
  }

  // ==========================================================================

  function hammerHead() {
    const r = CFG.rabbit.hammer.orbitR + CFG.rabbit.hammer.len * 0.30;
    return { x: rabbit.x + Math.cos(R.ang) * r, y: rabbit.y + Math.sin(R.ang) * r };
  }

  // 统一伤害公式：基础攻击力 × 百分比（全场只有 atk 是绝对数值）
  function atkDmg(who, ratio) {
    return Math.max(0, Math.round(who.atk * ratio));
  }

  function rabbitDamage() {
    return atkDmg(rabbit, CFG.rabbit.dmgAtkRatio);
  }

  function castIce() {
    const U = CFG.rabbit.ult;
    const canCounter = S.moral.cd <= 0 && S.moral.air <= 0;
    const countered = canCounter && Math.random() < CFG.slime.moral.counterChance;

    R.ultLeft = Math.max(0, R.ultLeft - 1);
    R.ultCount += 1;
    R.lockT = U.lockDur;
    rabbit.invuln = U.lockDur;
    R.iceT = U.iceDur;
    R.freezeT = U.freeze;

    sfxIce();
    sfxFreeze();
    shake(1.8);

    // 释放瞬间回血：此前累计造成伤害的 30%
    const healAmt = Math.round(rabbit.dealt * U.healRatio);
    const healed = heal(rabbit, healAmt, '#7bd88f');
    if (healed > 0) {
      for (let i = 0; i < 3; i++) {
        fx.rings.push({
          x: rabbit.x, y: rabbit.y, t: i * 0.1, dur: 0.85,
          r0: 24, r1: 132 + i * 22, color: '#7bd88f', w: 3.2
        });
      }
      sfxIceHeal();
      showBanner('冰岛冲击 · 回血 ' + fmt(healed));
      say('冰岛冲击！回复 ' + fmt(healed), true);
    } else {
      showBanner('冰岛冲击');
      say('冰岛冲击！', true);
    }

    rabbit.face = slime.x > rabbit.x ? 1 : -1;
    slime.face = rabbit.x > slime.x ? 1 : -1;

    if (countered) {
      castMoral(true);
      pending.push({
        at: clock + 0.7, gen,
        fn: () => {
          showBanner('对轴成功 · 完全免疫');
          say('对轴成功，完全免疫！');
          addNum(slime.x, slime.y - slime.hh - 76, '对轴！', '#ffe6a6', 26);
          for (let i = 0; i < 3; i++) {
            fx.rings.push({ x: slime.x, y: slime.y, t: i * 0.1, dur: 0.8, r0: 10, r1: 150, color: '#c9a6ff', w: 3 });
          }
        }
      });
    } else {
      // 冰岛冲击：冰冻期间分多次结算，单段伤害小、总伤害不变
      const total = atkDmg(rabbit, U.dmgAtkRatio);
      const per = Math.ceil(total / U.ticks);
      for (let i = 0; i < U.ticks; i++) {
        pending.push({
          at: clock + 0.55 + i * U.tickGap, gen,
          fn: () => {
            if (over) return;
            const dealt = damage(slime, per, { source: rabbit, color: '#8fd8ff' });
            if (dealt > 0) {
              fx.rings.push({
                x: slime.x, y: slime.y, t: 0, dur: 0.32,
                r0: 8, r1: 78, color: '#b9ecff', w: 2.6
              });
              for (let k = 0; k < 6; k++) {
                const a = Math.PI * 2 * k / 6 + Math.random() * 0.5;
                fx.shards.push({
                  x: slime.x + Math.cos(a) * 40, y: slime.y + Math.sin(a) * 40,
                  tx: slime.x, ty: slime.y, t: 0, dur: 0.3, color: '#cdefff'
                });
              }
            }
            // 眩晕只上第一次
            if (i === 0 && slime.hp > 0) slime.stun = Math.max(slime.stun, U.stun);
            // 冰岛冲击是范围技：第 1 段顺手把摇摆鸭也扫一下（一次大招只计 1 击）
            if (i === 0) iceOnDuck();
          }
        });
      }
    }
  }

  function updateRabbit(dt) {
    if (rabbit.hp <= 0) return;

    if (R.ultLeft > 0 && rabbit.hp <= rabbit.maxHp * CFG.rabbit.ult.hpThreshold) castIce();

    if (R.lockT > 0) {
      R.lockT = Math.max(0, R.lockT - dt);
      if (R.lockT === 0) rabbit.invuln = 0;
    }
    if (R.iceT > 0) R.iceT = Math.max(0, R.iceT - dt);
    if (R.tail > 0) R.tail = Math.max(0, R.tail - dt);

    if (rabbit.frozen > 0 || rabbit.stun > 0) { R.on = false; return; }

    const HM = CFG.rabbit.hammer;

    if (!R.on) {
      R.idle += dt;
      if (R.idle >= HM.period) {
        R.idle = 0; R.on = true; R.t = 0; R.hitDone = false; R.duckHit = false;
        R.ang = Math.atan2(slime.y - rabbit.y, slime.x - rabbit.x) - 0.9;
        sfxOrbit();

        const d = Math.hypot(slime.x - rabbit.x, slime.y - rabbit.y);
        if (d > HM.dashGap) {
          const nx = (slime.x - rabbit.x) / d, ny = (slime.y - rabbit.y) / d;
          rabbit.x = clamp(slime.x - nx * 205, BORDER + rabbit.hw, W - BORDER - rabbit.hw);
          rabbit.y = clamp(slime.y - ny * 205, BORDER + rabbit.hh, H - BORDER - rabbit.hh);
          fx.rings.push({ x: rabbit.x, y: rabbit.y, t: 0, dur: 0.35, r0: 8, r1: 50, color: '#ffd08a', w: 3 });
        }
      }
      return;
    }

    R.t += dt;
    R.ang += dt * HM.spin * DEG;

    // v3.0：锤子扫到摇摆鸭——不计伤害，只计数并把它击飞
    if (!R.duckHit && hammerOnDuck()) R.duckHit = true;

    if (!R.hitDone && slime.hp > 0) {
      const hd = hammerHead();
      if (Math.hypot(slime.x - hd.x, slime.y - hd.y) <= HM.hitR + slime.rc * 0.86) {
        const dealt = damage(slime, rabbitDamage(), { source: rabbit, color: '#ff4d2d' });
        if (dealt > 0) rabbit.hits++;
        R.hitDone = true;
        shake(0.8);
        const dx = slime.x - rabbit.x, dy = slime.y - rabbit.y, dd = Math.hypot(dx, dy) || 1;
        if (slime.hp > 0 && slime.sky <= 0 && slime.frozen <= 0) {
          slime.vx = dx / dd * 250;
          slime.vy = dy / dd * 250;
        }
      }
    }

    if (R.t >= HM.dur) { R.on = false; R.idle = 0; R.tail = 0.3; }
  }

  // ==========================================================================
  //  ⑧  史莱姆
  // ==========================================================================
  function blobAt(x, y, r, g0) {
    return {
      x, y, vx: 0, vy: 0, sp: 0, r,
      dw: r * 2, dh: r * 2, hw: r, hh: r, rc: r,
      gen: g0, life: CFG.slime.spit.life, age: 0, wob: Math.random() * 6.28
    };
  }

  function spit() {
    const mx = slime.x + (slime.face || 1) * slime.hw * 0.5;
    const my = slime.y + slime.hh * 0.12;
    const SP = CFG.slime.spit;

    let prey = null;
    for (const b of blobs) if (b.gen === 0) { prey = b; break; }

    let ang, sp;
    if (prey) {
      ang = Math.atan2(prey.y - my, prey.x - mx) + (Math.random() - 0.5) * 0.05;
      sp = SP.speed * 1.16;
    } else {
      let px = rabbit.x, py = rabbit.y;
      for (let k = 0; k < 2; k++) {
        const tt = Math.hypot(px - mx, py - my) / SP.speed;
        px = rabbit.x + rabbit.vx * tt * 1.0;
        py = rabbit.y + rabbit.vy * tt * 1.0;
      }
      px = clamp(px, BORDER + 20, W - BORDER - 20);
      py = clamp(py, BORDER + 20, H - BORDER - 20);
      ang = Math.atan2(py - my, px - mx) + (Math.random() - 0.5) * 0.12;
      sp = SP.speed;
    }

    const b = blobAt(mx + Math.cos(ang) * 14, my + Math.sin(ang) * 14, SP.r, 0);
    b.sp = sp; b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
    blobs.push(b);
    while (blobs.length > SP.maxBlobs) blobs.shift();
    fx.rings.push({ x: mx, y: my, t: 0, dur: 0.28, r0: 4, r1: 30, color: '#8ef07a', w: 2.4 });
    sfxSpit();
  }

  function splitBlob(b) {
    const i = blobs.indexOf(b);
    if (i < 0 || over) return;
    blobs.splice(i, 1);
    const base = Math.atan2(b.vy, b.vx);
    for (let k = 0; k < CFG.slime.spit.split; k++) {
      const a = base + (k % 2 === 0 ? 1 : -1) * (0.66 + Math.random() * 0.34);
      const c = blobAt(b.x, b.y, CFG.slime.spit.miniR, 1);
      c.sp = b.sp * 1.04; c.vx = Math.cos(a) * c.sp; c.vy = Math.sin(a) * c.sp;
      c.life = CFG.slime.spit.life * 0.72;
      blobs.push(c);
    }
    fx.rings.push({ x: b.x, y: b.y, t: 0, dur: 0.4, r0: 5, r1: 56, color: '#b6ff8a', w: 3 });
    addNum(b.x, b.y - b.hh - 16, '分裂 x' + CFG.slime.spit.split, '#2f9e3f', 16);
  }

  function updateBlobs(dt) {
    for (let i = blobs.length - 1; i >= 0; i--) {
      const b = blobs[i];
      if (!b) continue;
      b.age += dt; b.life -= dt;
      if (b.life <= 0) { blobs.splice(i, 1); continue; }

      // v3.0：史莱姆的球打到摇摆鸭 → 弹开 + 计一次撞击（同一颗球 0.4s 内只算一次）
      if (!over && Math.hypot(duck.x - b.x, duck.y - b.y) <= b.r + duck.rc * 0.9) {
        if (b.age - (b.lastDuck === undefined ? -9 : b.lastDuck) > 0.4) {
          b.lastDuck = b.age;
          const nx = b.x - duck.x, ny = b.y - duck.y, dd = Math.hypot(nx, ny) || 1;
          const sp2 = Math.max(b.sp, 340);
          b.vx = nx / dd * sp2; b.vy = ny / dd * sp2; b.sp = sp2;
          fx.rings.push({ x: duck.x, y: duck.y, t: 0, dur: 0.3, r0: 4, r1: 46, color: '#b6ff8a', w: 2.4 });
          duckHit(slime, 'blob');
        }
      }

      if (rabbit.hp > 0 && Math.hypot(rabbit.x - b.x, rabbit.y - b.y) <= b.r + rabbit.rc * 0.9) {
        const dealt = damage(rabbit, atkDmg(slime, CFG.slime.spit.dmgAtkRatio), { source: slime, color: '#2f9e3f' });
        if (dealt > 0) {
          slime.hits++;
          heal(slime, Math.ceil(dealt * CFG.slime.lifestealRatio), '#2f9e3f');
        }
        blobs.splice(i, 1);
        continue;
      }

      if (b.gen === 0) {
        let by = null;
        for (const o of blobs) {
          if (o === b || o.gen !== 0 || o.age >= b.age) continue;
          if (Math.hypot(o.x - b.x, o.y - b.y) <= o.r + b.r + 2) { by = o; break; }
        }
        if (by) splitBlob(b);
      }
    }
  }

  function castMoral(force) {
    const M = CFG.slime.moral;
    if (!force && S.moral.cd > 0) return;
    S.moral.cd = M.cd;
    S.moral.air = M.air;
    S.moral.readyFor = 0;
    slime.sky = M.air;

    sfxMoral();
    showBanner('站在道德制高点');
    say('史莱姆，站在道德制高点');
    addNum(slime.x, slime.y - slime.hh - 60, '道德制高点', '#c9a6ff', 22);
    for (let i = 0; i < 4; i++) {
      fx.rings.push({ x: slime.x, y: slime.y, t: i * 0.08, dur: 0.7, r0: 10, r1: 120 + i * 26, color: '#c9a6ff', w: 3.4 });
    }
    for (let i = 0; i < 14; i++) {
      const a = -Math.PI / 2 + (i - 6.5) * 0.13;
      fx.sparks.push({
        x: slime.x + Math.cos(a) * 70, y: slime.y + Math.sin(a) * 70,
        t: 0.05 + i * 0.02, dur: 0.5, color: i % 2 ? '#ffe6a6' : '#c9a6ff'
      });
    }
  }

  function castHistory() {
    const Hc = CFG.slime.history;
    const prev = takenBetween(slime, Hc.lookBack, Hc.lookBack * 2);
    const now = takenBetween(slime, 0, Hc.lookBack);
    const healAmt = Math.round(prev * Hc.healRatio);
    const reflect = Math.round(now * Hc.reflectRatio);

    S.history.cd = Hc.cd;
    S.history.mute = Hc.mute;
    S.history.readyFor = 0;
    S.lastHeal = healAmt; S.lastReflect = reflect;

    sfxHistory();
    showBanner('历史的回眸');
    say('史莱姆，历史的回眸', true);
    addNum(slime.x, slime.y - slime.hh - 60, '历史的回眸', '#c9a6ff', 22);

    for (let i = 0; i < 5; i++) {
      fx.rings.push({ x: slime.x, y: slime.y, t: i * 0.07, dur: 0.9, r0: 130 - i * 18, r1: 10, color: '#a98bff', w: 2.6 });
    }
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, r0 = rand(40, 110);
      fx.shards.push({
        x: slime.x + Math.cos(a) * r0, y: slime.y + Math.sin(a) * r0,
        tx: slime.x, ty: slime.y, t: 0, dur: rand(0.35, 0.6), color: '#c9a6ff'
      });
    }

    if (healAmt > 0) heal(slime, healAmt, '#7bd88f');
    else addNum(slime.x + 40, slime.y - slime.hh - 16, '无旧伤', '#8a8a8a', 15);

    if (reflect > 0) {
      addNum(slime.x, slime.y - slime.hh - 90, '回溯 ' + reflect, '#a98bff', 19);
      pending.push({
        at: clock + 0.45, gen,
        fn: () => { if (!over) damage(rabbit, reflect, { source: slime, color: '#a98bff' }); }
      });
    }
  }

  function updateSlime(dt) {
    if (slime.hp <= 0) return;
    const M = CFG.slime.moral, Hc = CFG.slime.history;

    // ---- 冷却计时：就绪后开始累积"已经等了多久" ----
    if (S.moral.cd > 0) { S.moral.cd = Math.max(0, S.moral.cd - dt); S.moral.readyFor = 0; }
    else if (S.moral.air <= 0) S.moral.readyFor += dt;

    if (S.history.cd > 0) { S.history.cd = Math.max(0, S.history.cd - dt); S.history.readyFor = 0; }
    else if (S.history.mute <= 0) S.history.readyFor += dt;

    // ================= 道德制高点的释放判断 =================
    // 只在"能挡到东西"的时候起飞，但留招最多 20s
    if (S.moral.air > 0) {
      S.moral.air = Math.max(0, S.moral.air - dt);
      slime.sky = S.moral.air;
    } else if (S.moral.cd <= 0 && slime.frozen <= 0) {
      const dist = Math.hypot(rabbit.x - slime.x, rabbit.y - slime.y);
      const watchUlt = R.ultLeft > 0 && rabbit.hp <= rabbit.maxHp * M.watchHp;  // 等大招对轴
      const swinging = R.on && !R.hitDone && dist <= M.threatRange;          // 锤子正抡过来
      const lowHp = slime.hp <= slime.maxHp * M.lowHp;                       // 自己快死了
      const forced = S.moral.readyFor >= M.holdMax;                          // 留太久，必须用掉

      if (forced) castMoral(false);
      else if (watchUlt) { /* 继续留着接大招 */ }
      else if (swinging || lowHp) castMoral(false);
    }

    // ================= 历史的回眸的释放判断 =================
    // 要"吃到足够多的伤害"才值得放（放了要停手 10s，乱放等于自废武功）
    if (S.history.mute > 0) S.history.mute = Math.max(0, S.history.mute - dt);
    if (S.history.cd <= 0 && S.history.mute <= 0 && slime.frozen <= 0) {
      const recent = takenBetween(slime, 0, Hc.lookBack);
      const worth = recent >= slime.maxHp * Hc.needRatio;                 // 值得
      const forced = S.history.readyFor >= Hc.holdMax
                     && recent >= slime.maxHp * Hc.floorRatio;            // 留满后的保底
      if (worth || forced) castHistory();
    }

    if (slime.stun > 0 || slime.frozen > 0 || S.history.mute > 0) return;

    if (S.chain > 0) {
      S.chainT -= dt;
      if (S.chainT <= 0) { S.chain -= 1; S.chainT = CFG.slime.spit.chain; spit(); }
      return;
    }
    S.idle += dt;
    if (S.idle >= CFG.slime.spit.period) {
      S.idle = 0; spit();
      S.chain = 1; S.chainT = CFG.slime.spit.chain;
    }
  }

  // ==========================================================================
  //  ⑧.5  摇摆鸭（v3.0 中立单位）
  //      · 一开场就在场上，半透明
  //      · 可被撞动（物理互推）、可被锤子和史莱姆的球打到（计入撞击数）
  //      · 每 20 次撞击：第 20 次撞击者的【对手】获得增益，并清空上一次增益
  // ==========================================================================
  const SIDE_NAME = { left: '兔子', right: '史莱姆' };
  const SIDE_COLOR = { left: '#ff5a3c', right: '#2f9e3f' };

  // 本轮需要的撞击数：第一轮 20，之后每结算一次 +2（20 → 22 → 24 …）
  function duckNeed() {
    return CFG.duck.hitsPerRound + buff.round * CFG.duck.hitsPerStep;
  }

  function duckHit(source, kind) {
    if (over || !source) return;
    const k = source.side;
    if (clock - duck.cd[k] < CFG.duck.hitCooldown) return;
    duck.cd[k] = clock;

    duck.hits += 1;          // 累计数：只增不减
    duck.roundHits += 1;     // 本轮进度
    duck.last = source;
    duck.lastSide = k;
    duck.flash = 0.2;
    duck.hitPop = 0.24;
    duck.sqV += 7.5;         // Q 弹：先压扁，弹簧再把它弹回来

    const need = duckNeed();
    const done = duck.roundHits >= need;

    // 每一下都飘字，按 3 个高度错开，避免糊成一团
    if (done || clock - (duck.numAt || -9) > 0.16) {
      duck.numAt = clock;
      addNum(duck.x + rand(-30, 30), duck.y - duck.hh - 12 - (duck.hits % 3) * 17,
        done ? '满 ' + need + ' 次！' : '撞击 ' + duck.roundHits + '/' + need,
        done ? '#ffb400' : '#5b7d92', done ? 22 : 15);
    }
    fx.rings.push({ x: duck.x, y: duck.y, t: 0, dur: 0.34, r0: 6, r1: 58, color: '#ffd166', w: 2.6 });
    sfxDuck(kind);
    shake(kind === 'hammer' ? 0.35 : 0.12);

    if (done) { duck.roundHits = 0; settleDuckBuff(source); }
  }

  // 把两位角色的增益全部还原到基础值（只可能有一位带增益）
  function clearBuff() {
    for (const f of fighters) {
      if (!f.buffHp && !f.buffAtk) continue;
      const extra = f.buffHp;
      f.maxHp = f.cfg.maxHp;
      f.atk = f.cfg.atk;
      f.buffHp = 0; f.buffAtk = 0;
      f.hp = clamp(f.hp - extra, 0, f.maxHp);
    }
    buff.target = null; buff.hp = 0; buff.atk = 0;
  }

  // 幂等：先全部还原，再按 (hpB, atkB) 给 target 上增益
  function applyBuff(target, hpB, atkB) {
    clearBuff();
    const add = Math.round(target.cfg.maxHp * hpB);
    target.maxHp = target.cfg.maxHp + add;
    target.atk = Math.round(target.cfg.atk * (1 + atkB));
    target.buffHp = add;
    target.buffAtk = atkB;
    target.hp = clamp(target.hp + add, 0, target.maxHp);
    buff.target = target; buff.hp = hpB; buff.atk = atkB;
  }

  // 第 20 / 40 / 60… 次撞击：清空旧增益 → 给「撞击者的对手」上增益
  function settleDuckBuff(hitter) {
    const target = hitter === rabbit ? slime : rabbit;

    buff.round += 1;
    if (!duck.firstAt) duck.firstAt = clock;
    applyBuff(target, duckUI.hp, duckUI.atk);
    duck.join = target.side;

    const name = SIDE_NAME[target.side];
    showBanner('摇摆鸭加入' + name + ' · +' + Math.round(duckUI.hp * 100) + '%/' + Math.round(duckUI.atk * 100) + '%');
    say('摇摆鸭加入' + name + '阵营', true);
    sfxJoin();

    addNum(target.x, target.y - target.hh - 96, '鸭之祝福', '#ffb400', 26);
    for (let i = 0; i < 3; i++) {
      fx.rings.push({
        x: target.x, y: target.y, t: i * 0.1, dur: 0.9,
        r0: 20, r1: 160 + i * 26, color: '#ffd166', w: 3.4
      });
    }
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, r0 = rand(40, 120);
      fx.shards.push({
        x: target.x + Math.cos(a) * r0, y: target.y + Math.sin(a) * r0,
        tx: target.x, ty: target.y, t: 0, dur: rand(0.4, 0.7), color: '#ffe6a6'
      });
    }

    if (CFG.duck.buff.autoConfirm) return;   // 脚本批量跑：不弹窗
    openBili(target);
  }

  // 鸭子游走：追向双方中点 + 左右摇摆，保证它总在交火线上挨打
  function updateDuck(dt) {
    if (duck.flash > 0) duck.flash = Math.max(0, duck.flash - dt);
    if (duck.hitPop > 0) duck.hitPop = Math.max(0, duck.hitPop - dt);
    if (over) return;

    // Q 弹：阻尼弹簧，被打时 sqV 被推一下，之后自己晃回来
    duck.sqV += (-duck.sq * 300 - duck.sqV * 10.5) * dt;
    duck.sq = clamp(duck.sq + duck.sqV * dt, -0.62, 0.62);

    duck.wob += dt * 2.9;
    const mx = (rabbit.x + slime.x) / 2, my = (rabbit.y + slime.y) / 2;
    const gain = CFG.duck.chase * 1.9;
    // 目标速度 = 朝双方中点 + 猛烈左右摇摆（比例导引，比加速度式更跟得住）
    const tx = clamp((mx - duck.x) * gain, -duck.sp, duck.sp) + Math.cos(duck.wob * 1.9) * 250;
    const ty = clamp((my - duck.y) * gain, -duck.sp, duck.sp) + Math.sin(duck.wob * 2.7) * 230;
    const kv = Math.min(1, dt * 2.8);
    duck.vx += (tx - duck.vx) * kv;
    duck.vy += (ty - duck.vy) * kv;

    // 被撞飞后的高速会慢慢回落到基础游走速度
    duck.sp += (CFG.duck.speed - duck.sp) * Math.min(1, dt * CFG.duck.drag);
    const s = Math.hypot(duck.vx, duck.vy) || 1;
    const cap = clamp(duck.sp, CFG.duck.speed, CFG.duck.maxSpeed);
    if (s > cap) { duck.vx = duck.vx / s * cap; duck.vy = duck.vy / s * cap; }
    if (Math.abs(duck.vx) > 26) duck.face = duck.vx > 0 ? 1 : -1;
  }

  // 角色撞上鸭子：互推（鸭子轻，被撞得更远），并计一次撞击
  function collideDuck(f) {
    if (over || !f || f.hp <= 0) return;
    const dx = f.x - duck.x, dy = f.y - duck.y;
    const d = Math.hypot(dx, dy), min = f.rc + duck.rc;
    if (!d || d >= min) return;
    const nx = dx / d, ny = dy / d, ov = min - d;
    duck.x -= nx * ov * 0.7; duck.y -= ny * ov * 0.7;
    f.x += nx * ov * 0.3; f.y += ny * ov * 0.3;

    const vn = (f.vx - duck.vx) * nx + (f.vy - duck.vy) * ny;
    if (vn > 0) {
      duck.vx += nx * vn * 1.45;
      duck.vy += ny * vn * 1.45;
      duck.sp = clamp(Math.hypot(duck.vx, duck.vy), CFG.duck.speed, CFG.duck.maxSpeed);
      keepSpeed(duck);
    }
    duckHit(f, 'bump');
  }

  // 冰岛冲击扫到鸭子：击飞 + 冰屑 + 计一次撞击
  function iceOnDuck() {
    const dx = duck.x - rabbit.x, dy = duck.y - rabbit.y, dd = Math.hypot(dx, dy) || 1;
    duck.vx = dx / dd * 400;
    duck.vy = dy / dd * 400;
    duck.sp = 400;
    duck.sqV += 7.5;
    duckHit(rabbit, 'ice');
    for (let k = 0; k < 8; k++) {
      const a = Math.PI * 2 * k / 8 + Math.random() * 0.4, r0 = rand(30, 70);
      fx.shards.push({
        x: duck.x + Math.cos(a) * r0, y: duck.y + Math.sin(a) * r0,
        tx: duck.x, ty: duck.y, t: 0, dur: rand(0.25, 0.45), color: '#cdefff'
      });
    }
    fx.rings.push({ x: duck.x, y: duck.y, t: 0, dur: 0.5, r0: 10, r1: 96, color: '#b9ecff', w: 3 });
  }

  // 锤子打中鸭子：击飞 + 计一次撞击
  function hammerOnDuck() {
    const HM = CFG.rabbit.hammer;
    const hd = hammerHead();
    if (Math.hypot(duck.x - hd.x, duck.y - hd.y) > HM.hitR + duck.rc * 0.9) return false;
    const dx = duck.x - rabbit.x, dy = duck.y - rabbit.y, dd = Math.hypot(dx, dy) || 1;
    duck.vx = dx / dd * CFG.duck.knock;
    duck.vy = dy / dd * CFG.duck.knock;
    duck.sp = CFG.duck.knock;
    duckHit(rabbit, 'hammer');
    return true;
  }


  // ==========================================================================
  //  ⑨  物理
  // ==========================================================================
  function keepSpeed(f) {
    const s = Math.hypot(f.vx, f.vy) || 1;
    f.vx = f.vx / s * f.sp;
    f.vy = f.vy / s * f.sp;
  }

  function bounce(o) {
    let hit = false;
    if (o.x - o.hw < BORDER) { o.x = BORDER + o.hw; o.vx = Math.abs(o.vx); hit = true; }
    else if (o.x + o.hw > W - BORDER) { o.x = W - BORDER - o.hw; o.vx = -Math.abs(o.vx); hit = true; }
    if (o.y - o.hh < BORDER) { o.y = BORDER + o.hh; o.vy = Math.abs(o.vy); hit = true; }
    else if (o.y + o.hh > H - BORDER) { o.y = H - BORDER - o.hh; o.vy = -Math.abs(o.vy); hit = true; }
    if (hit && o.sp) keepSpeed(o);
  }

  function collide(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy), min = a.rc + b.rc;
    if (!d || d >= min) return;
    const nx = dx / d, ny = dy / d, ov = (min - d) / 2;
    a.x -= nx * ov; a.y -= ny * ov;
    b.x += nx * ov; b.y += ny * ov;
    const va = a.vx * nx + a.vy * ny, vb = b.vx * nx + b.vy * ny;
    if (va - vb <= 0) return;
    const s = va - vb;
    a.vx -= s * nx; a.vy -= s * ny;
    b.vx += s * nx; b.vy += s * ny;
    if (a.sp) keepSpeed(a);
    if (b.sp) keepSpeed(b);
  }

  function step(dt) {
    const sub = 4, h = dt / sub;
    for (let s = 0; s < sub; s++) {
      for (const f of fighters) {
        if (f.stun > 0 || f.frozen > 0) continue;
        f.x += f.vx * h; f.y += f.vy * h;
      }
      for (const b of blobs) { b.x += b.vx * h; b.y += b.vy * h; }
      if (!over) { duck.x += duck.vx * h; duck.y += duck.vy * h; }
      for (const f of fighters) bounce(f);
      if (!over) bounce(duck);
      for (const b of blobs) bounce(b);
      collide(rabbit, slime);
      if (!over) { collideDuck(rabbit); collideDuck(slime); }
      for (let i = 0; i < blobs.length; i++)
        for (let j = i + 1; j < blobs.length; j++) collide(blobs[i], blobs[j]);
    }
  }

  let shakeAmp = 0;
  function shake(v) { shakeAmp = Math.max(shakeAmp, v * CFG.feel.shake); }

  // ==========================================================================
  //  ⑩  主循环
  // ==========================================================================
  function update(dt) {
    if (over) {
      overT += dt;
      if (!mvpOn && overT >= 1.4) { mvpOn = true; showMVP(); }
      return;
    }
    clock += dt;

    if (R.freezeT > 0) {
      R.freezeT = Math.max(0, R.freezeT - dt);
      rabbit.frozen = R.freezeT;
      slime.frozen = R.freezeT;
    } else {
      step(dt);
    }

    for (const f of fighters) {
      if (f.stun > 0) {
        f.stun -= dt;
        if (f.stun <= 0) {
          f.stun = 0;
          const a = Math.random() * Math.PI * 2;
          f.vx = Math.cos(a) * f.sp; f.vy = Math.sin(a) * f.sp;
        }
      }
      if (f.flash > 0) f.flash = Math.max(0, f.flash - dt);
      if (f.shake > 0) f.shake = Math.max(0, f.shake - dt);
      if (f.squash > 0) f.squash = Math.max(0, f.squash - dt);
      if (f.frozen <= 0 && f.stun <= 0 && Math.abs(f.vx) > 20) f.face = f.vx > 0 ? 1 : -1;
      while (f.dmgLog.length && clock - f.dmgLog[0].t > 30) f.dmgLog.shift();
    }

    updateRabbit(dt);
    updateSlime(dt);
    updateDuck(dt);
    updateBlobs(dt);

    for (let i = pending.length - 1; i >= 0; i--) {
      const ev = pending[i];
      if (ev.gen !== gen) { pending.splice(i, 1); continue; }
      if (clock >= ev.at) { pending.splice(i, 1); ev.fn(); }
    }

    for (const k in fx) {
      if (k === 'snow') continue;
      const arr = fx[k];
      for (let i = arr.length - 1; i >= 0; i--) {
        arr[i].t += dt;
        if (arr[i].t >= arr[i].dur) arr.splice(i, 1);
      }
    }

    for (const s of fx.snow) {
      s.y += s.sp * dt;
      s.x += s.drift * dt;
      if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
      if (s.x < -4) s.x = W + 4;
      if (s.x > W + 4) s.x = -4;
    }

    if (shakeAmp > 0) shakeAmp = Math.max(0, shakeAmp - dt * 6.5);
  }

  // ==========================================================================
  //  ⑪  渲染
  // ==========================================================================
  function drawBackdrop() {
    if (R.iceT > 0 && img.ice.complete && img.ice.naturalWidth) {
      const p = 1 - R.iceT / CFG.rabbit.ult.iceDur;
      const z = 1 + 0.07 * p;
      const iw = img.ice.naturalWidth, ih = img.ice.naturalHeight;
      const k = Math.max(W / iw, H / ih) * z;
      const dw = iw * k, dh = ih * k;
      ctx.save();
      ctx.globalAlpha = Math.min(1, R.iceT / 0.35);
      ctx.drawImage(img.ice, (W - dw) / 2, (H - dh) / 2, dw, dh);
      ctx.fillStyle = 'rgba(10,42,63,.34)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      return;
    }

    ctx.fillStyle = '#11b4f3';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.09)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();
  }

  function drawSnow() {
    if (R.iceT <= 0) return;
    const a0 = Math.min(1, R.iceT / 0.4);
    ctx.save();
    ctx.fillStyle = '#ffffff';
    for (const s of fx.snow) {
      ctx.globalAlpha = s.a * a0;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawChar(f) {
    const dying = f.hp <= 0;
    const sk = f.shake > 0 ? f.shake / 0.3 : 0;
    const ox = sk ? Math.sin(clock * 86) * 4.4 * sk : 0;
    const oy = sk ? Math.cos(clock * 71) * 2.6 * sk : 0;
    const sq = f.squash > 0 ? f.squash / 0.24 : 0;
    const floatY = f.sky > 0 ? -56 - Math.sin(clock * 2.4) * 6 : 0;

    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#062033';
    ctx.beginPath();
    ctx.ellipse(f.x, f.y + f.hh * 0.88 + 6, f.hw * 0.78, f.hw * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (f.sky > 0) {
      const top = f.y + floatY - f.hh;
      const g = ctx.createLinearGradient(0, top - 70, 0, f.y + f.hh);
      g.addColorStop(0, 'rgba(201,166,255,0)');
      g.addColorStop(0.55, 'rgba(201,166,255,.36)');
      g.addColorStop(1, 'rgba(201,166,255,0)');
      ctx.save();
      ctx.fillStyle = g;
      ctx.fillRect(f.x - f.hw * 1.55, top - 70, f.hw * 3.1, f.hh * 2 + 80);
      ctx.restore();
    }

    ctx.save();
    if (dying) ctx.globalAlpha = 0.3;
    ctx.translate(f.x + ox, f.y + oy + floatY);
    if (sq > 0) ctx.scale(1 + 0.1 * sq, 1 - 0.1 * sq);
    if (f.face < 0) ctx.scale(-1, 1);
    ctx.drawImage(img[f.key], -f.hw, -f.hh, f.dw, f.dh);
    ctx.restore();

    if (!dying && f.flash > 0) {
      ctx.save();
      ctx.globalAlpha = (f.flash / 0.2) * 0.45;
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(f.x + ox, f.y + oy + floatY);
      if (f.face < 0) ctx.scale(-1, 1);
      ctx.drawImage(img[f.key], -f.hw, -f.hh, f.dw, f.dh);
      ctx.restore();
    }

    if (f.sky > 0) {
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.globalAlpha = 0.55 - i * 0.13;
        ctx.strokeStyle = i === 0 ? '#ffe6a6' : '#c9a6ff';
        ctx.lineWidth = 3 - i * 0.6;
        ctx.beginPath();
        ctx.ellipse(f.x, f.y + floatY + i * 14, f.hw * (1.1 + i * 0.16), f.hw * (0.34 + i * 0.07), 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    if (f.invuln > 0) {
      ctx.save();
      ctx.globalAlpha = 0.45 + 0.25 * Math.sin(clock * 12);
      ctx.strokeStyle = '#ff9a8a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(f.x, f.y + floatY, Math.max(f.hw, f.hh) * 1.22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // v3.0：被摇摆鸭增益的一方，脚下有一圈流动的金环
    if (buff.target === f) {
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.22 * Math.sin(clock * 2.6);
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 3.4;
      ctx.setLineDash([11, 9]);
      ctx.lineDashOffset = -clock * 46;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y + f.hh * 0.86, f.hw * 1.28, f.hw * 0.31, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    if (f.frozen > 0) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#9fe3ff';
      ctx.beginPath();
      ctx.ellipse(f.x, f.y + floatY, f.hw * 1.16, f.hh * 1.12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = '#e6faff';
      ctx.lineWidth = 2.4;
      ctx.stroke();
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * Math.PI * 2 + 0.3, rr = f.hw;
        ctx.beginPath();
        ctx.moveTo(f.x + Math.cos(a) * rr * 0.4, f.y + floatY + Math.sin(a) * rr * 0.4);
        ctx.lineTo(f.x + Math.cos(a) * rr * 1.1, f.y + floatY + Math.sin(a) * rr * 1.1);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawHammer() {
    if (!img.hammer.complete || !img.hammer.naturalWidth || rabbit.hp <= 0) return;
    if (!R.on) return;
    const HM = CFG.rabbit.hammer;
    const cx = clamp(rabbit.x, 80, W - 80), cy = clamp(rabbit.y, 80, H - 80);

    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.setLineDash([9, 12]);
    ctx.lineDashOffset = -clock * 60;
    ctx.beginPath();
    ctx.arc(cx, cy, HM.orbitR + HM.len * 0.3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    const s = HM.len / img.hammer.naturalWidth;
    const dw = HM.len, dh = img.hammer.naturalHeight * s;

    for (let i = 4; i >= 0; i--) {
      const a = R.ang - i * 0.13;
      ctx.save();
      ctx.globalAlpha = i === 0 ? 1 : Math.max(0, 0.26 - i * 0.05);
      ctx.translate(cx + Math.cos(a) * HM.orbitR, cy + Math.sin(a) * HM.orbitR);
      ctx.rotate(a);
      ctx.drawImage(img.hammer, -dw / 2, -dh / 2, dw, dh);
      ctx.restore();
    }
  }

  // ---------- v3.0 摇摆鸭渲染 ----------
  function roundRectPath(g, x, y, w, h, r) {
    const rr = Math.min(r, h / 2, w / 2);
    g.beginPath();
    g.moveTo(x + rr, y);
    g.arcTo(x + w, y, x + w, y + h, rr);
    g.arcTo(x + w, y + h, x, y + h, rr);
    g.arcTo(x, y + h, x, y, rr);
    g.arcTo(x, y, x + w, y, rr);
    g.closePath();
  }

  function drawDuck() {
    if (!img.duck.complete || !img.duck.naturalWidth) return;
    const joined = !!duck.join;
    const col = joined ? (SIDE_COLOR[duck.join] || '#ffd166') : '#ffd166';
    const a = joined ? CFG.duck.joinedAlpha : CFG.duck.alpha;
    // Q 弹形变：sq > 0 压扁、< 0 拉长，再叠一点自带的果冻抖动
    const sq = duck.sq;
    const jelly = 1 + 0.035 * Math.sin(clock * 6.4 + duck.wob);
    const kx = (1 + sq * 0.52) * jelly;
    const ky = (1 - sq * 0.52) / jelly;

    // 地面阴影
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#062033';
    ctx.beginPath();
    ctx.ellipse(duck.x, duck.y + duck.hh * 0.92, duck.hw * 0.82, duck.hw * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 加入阵营后的金色光柱
    if (joined) {
      const g = ctx.createLinearGradient(0, duck.y - duck.hh * 1.6, 0, duck.y + duck.hh);
      g.addColorStop(0, 'rgba(255,209,102,0)');
      g.addColorStop(0.5, 'rgba(255,209,102,.26)');
      g.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = g;
      ctx.fillRect(duck.x - duck.hw * 1.3, duck.y - duck.hh * 1.6, duck.hw * 2.6, duck.hh * 2.6);
      ctx.restore();
    }

    // 半透明白底光：避免半透明的黄色鸭叠在蓝色场地上发绿
    if (!joined) {
      const g = ctx.createRadialGradient(duck.x, duck.y, duck.hw * 0.15, duck.x, duck.y, duck.hw * 1.55);
      g.addColorStop(0, 'rgba(255,255,255,.62)');
      g.addColorStop(0.58, 'rgba(255,255,255,.26)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.save();
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(duck.x, duck.y, duck.hw * 1.55, duck.hh * 1.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 本体（半透明 + 摇摆）
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(duck.x, duck.y);
    ctx.rotate(Math.sin(clock * 3.6 + duck.wob * 1.5) * 0.15);
    ctx.scale(duck.face < 0 ? -kx : kx, ky);
    ctx.drawImage(img.duck, -duck.hw, -duck.hh, duck.dw, duck.dh);
    ctx.restore();

    if (duck.flash > 0) {
      ctx.save();
      ctx.globalAlpha = (duck.flash / 0.2) * 0.5;
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(duck.x, duck.y);
      ctx.scale(duck.face < 0 ? -1 : 1, 1);
      ctx.drawImage(img.duck, -duck.hw, -duck.hh, duck.dw, duck.dh);
      ctx.restore();
    }

    // 充能进度环
    const need0 = duckNeed();
    const prog = clamp(duck.roundHits / need0, 0, 1);
    const rr = duck.rc + 15;
    ctx.save();
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 10]);
    ctx.lineDashOffset = -clock * 24;
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(duck.x, duck.y, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 5;
    ctx.strokeStyle = col;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(duck.x, duck.y, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.004, prog));
    ctx.stroke();
    ctx.restore();

  }

  // 鸭子头顶的标签单独画在最上层，避免被角色盖住
  function drawDuckTag() {
    if (!img.duck.complete || !img.duck.naturalWidth) return;
    const joined = !!duck.join;
    const col = joined ? (SIDE_COLOR[duck.join] || '#ffd166') : '#ffd166';
    const need = duckNeed();
    const txt = joined
      ? '加入' + SIDE_NAME[duck.join] + ' +' + Math.round(buff.hp * 100) + '%/' + Math.round(buff.atk * 100) + '% · ' + duck.hits + ' 击'
      : '中立 ' + Math.floor(duck.roundHits) + '/' + need + ' · 累计 ' + duck.hits + ' 击';
    ctx.save();
    ctx.font = '900 15px "PingFang SC","Microsoft YaHei",sans-serif';
    const tw = ctx.measureText(txt).width;
    const pw = tw + 26, ph = 26;
    const px = clamp(duck.x - pw / 2, 6, W - pw - 6);
    const py = clamp(duck.y - duck.hh - 38, 6, H - ph - 6);
    ctx.globalAlpha = 0.94;
    roundRectPath(ctx, px, py, pw, ph, 13);
    ctx.fillStyle = 'rgba(10,42,63,.85)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = col;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, px + pw / 2, py + ph / 2 + 1);
    ctx.restore();
  }

  function drawBlobs() {
    for (const b of blobs) {
      let a = 1;
      if (b.life < 1.2) a = Math.max(0, b.life / 1.2);
      const wob = 1 + 0.09 * Math.sin(b.wob + clock * 9);
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const stretch = Math.min(1.18, 1 + sp / 3000);
      const ang = Math.atan2(b.vy, b.vx), r = b.r;

      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.scale(stretch, wob / stretch);
      const g = ctx.createRadialGradient(-r * 0.3, -r * 0.34, r * 0.12, 0, 0, r * 1.06);
      g.addColorStop(0, b.gen ? '#d8ffbc' : '#affa90');
      g.addColorStop(0.55, b.gen ? '#84e65e' : '#5fd94a');
      g.addColorStop(1, '#2f8f2a');
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = Math.max(2, r * 0.16);
      ctx.strokeStyle = '#123d18';
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#123d18';
      ctx.beginPath();
      ctx.ellipse(b.x - r * 0.34, b.y - r * 0.16, r * 0.11, r * 0.16, 0, 0, Math.PI * 2);
      ctx.ellipse(b.x + r * 0.34, b.y - r * 0.16, r * 0.11, r * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#123d18';
      ctx.lineWidth = Math.max(1.4, r * 0.09);
      ctx.beginPath();
      ctx.arc(b.x, b.y + r * 0.16, r * 0.3, 0.18 * Math.PI, 0.82 * Math.PI);
      ctx.stroke();
      ctx.restore();
    }
  }

  function crossPath(g, cx, cy, s, t) {
    const a = s / 2, b = s * t / 2;
    g.beginPath();
    g.moveTo(cx - b, cy - a); g.lineTo(cx + b, cy - a); g.lineTo(cx + b, cy - b);
    g.lineTo(cx + a, cy - b); g.lineTo(cx + a, cy + b); g.lineTo(cx + b, cy + b);
    g.lineTo(cx + b, cy + a); g.lineTo(cx - b, cy + a); g.lineTo(cx - b, cy + b);
    g.lineTo(cx - a, cy + b); g.lineTo(cx - a, cy - b); g.lineTo(cx - b, cy - b);
    g.closePath();
  }

  function drawHp(f) {
    const s = 80, th = 0.46;
    const floatY = f.sky > 0 ? -56 : 0;
    let cy = f.y + floatY - f.hh - s / 2 - 10;
    if (cy - s / 2 < 6) cy = f.y + floatY + f.hh + s / 2 + 12;
    const cx = clamp(f.x, s / 2 + 6, W - s / 2 - 6);
    const ratio = clamp(f.hp / f.maxHp, 0, 1);
    const txt = String(Math.round(f.hp));

    ctx.save();
    crossPath(ctx, cx, cy, s, th);
    ctx.fillStyle = '#08161f';
    ctx.fill();

    ctx.save();
    crossPath(ctx, cx, cy, s, th);
    ctx.clip();
    const bottom = cy + s / 2;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cx - s / 2, bottom - s, s, s);
    const grd = ctx.createLinearGradient(0, bottom - s * ratio, 0, bottom);
    grd.addColorStop(0, '#ff6a5a');
    grd.addColorStop(1, '#d61b14');
    ctx.fillStyle = grd;
    ctx.fillRect(cx - s / 2, bottom - s * ratio, s, s * ratio);
    ctx.restore();

    crossPath(ctx, cx, cy, s, th);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(6,20,32,.75)';
    ctx.stroke();

    let fs = Math.round(s * 0.34);
    ctx.font = '900 ' + fs + 'px "PingFang SC",sans-serif';
    while (fs > 8 && ctx.measureText(txt).width > s - 18) {
      fs -= 1;
      ctx.font = '900 ' + fs + 'px "PingFang SC",sans-serif';
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, fs * 0.22);
    ctx.strokeStyle = 'rgba(6,20,32,.9)';
    ctx.strokeText(txt, cx, cy + 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(txt, cx, cy + 1);
    ctx.restore();
  }

  function drawFx() {
    for (const r of fx.rings) {
      const p = r.t / r.dur;
      const rad = r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - p, 2));
      ctx.save();
      ctx.globalAlpha = (1 - p) * 0.85;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = (r.w || 2.4) * (1 - p) + 0.6;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    for (const s of fx.sparks) {
      const p = s.t / s.dur;
      ctx.save();
      ctx.globalAlpha = 1 - p;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2 + 0.4;
        const r0 = 5 + p * 16, r1 = r0 + 6 * (1 - p);
        ctx.beginPath();
        ctx.moveTo(s.x + Math.cos(a) * r0, s.y + Math.sin(a) * r0);
        ctx.lineTo(s.x + Math.cos(a) * r1, s.y + Math.sin(a) * r1);
        ctx.stroke();
      }
      ctx.restore();
    }
    for (const s of fx.shards) {
      const p = s.t / s.dur;
      const x = s.x + (s.tx - s.x) * p, y = s.y + (s.ty - s.y) * p;
      ctx.save();
      ctx.globalAlpha = (1 - p) * 0.9;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.moveTo(x, y - 4); ctx.lineTo(x + 3, y); ctx.lineTo(x, y + 4); ctx.lineTo(x - 3, y);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    for (const n of fx.nums) {
      const p = n.t / n.dur;
      ctx.save();
      ctx.globalAlpha = p < 0.1 ? p / 0.1 : (p > 0.7 ? Math.max(0, 1 - (p - 0.7) / 0.3) : 1);
      ctx.font = '900 ' + n.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const y = n.y - p * 28;
      ctx.lineWidth = Math.max(3, n.size * 0.18);
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(6,20,32,.72)';
      ctx.strokeText(n.text, n.x, y);
      ctx.fillStyle = n.color;
      ctx.fillText(n.text, n.x, y);
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.save();
    if (shakeAmp > 0.01) {
      ctx.translate(Math.sin(clock * 97) * shakeAmp * 7, Math.cos(clock * 79) * shakeAmp * 5);
    }
    drawBackdrop();
    drawDuck();
    drawBlobs();
    for (const f of fighters) drawChar(f);
    drawHammer();
    drawDuckTag();
    drawFx();
    for (const f of fighters) drawHp(f);
    drawSnow();
    ctx.restore();
  }

    if (R.on) setSkill('skHammer', 'active', '挥击中', (HM.dur - R.t).toFixed(1) + 's', 1 - R.t / HM.dur);
    else {
      const left = Math.max(0, HM.period - R.idle);
      setSkill('skHammer', left <= 0.05 ? 'ready' : '', left <= 0.05 ? '就绪' : '冷却', left.toFixed(1) + 's', 1 - left / HM.period);
    }

    const ultTag = R.ultLeft + '/' + CFG.rabbit.ult.uses;
    if (R.ultLeft <= 0) {
      setSkill('skUlt', '', '已用尽', '0/' + CFG.rabbit.ult.uses, 0);
    } else if (R.lockT > 0) {
      setSkill('skUlt', 'lock', '锁血中', R.lockT.toFixed(1) + 's', R.lockT / CFG.rabbit.ult.lockDur);
    } else if (R.iceT > 0) {
      setSkill('skUlt', 'active', '冰岛展开', R.iceT.toFixed(1) + 's', R.iceT / CFG.rabbit.ult.iceDur);
    } else {
      const need = clamp((rabbit.hp / rabbit.maxHp - CFG.rabbit.ult.hpThreshold) / (1 - CFG.rabbit.ult.hpThreshold), 0, 1);
      setSkill('skUlt', 'ready', '待触发', ultTag, need);
